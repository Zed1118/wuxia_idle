name: CI

# 挂机武侠持续集成:analyze + 代码生成 + 全量测试。
# 平台 ubuntu-latest(纯 Dart 逻辑测试 + Isar `initializeIsarCore(download:true)` 跨平台拉 core,
# 无 golden / 无 Android / 无 native build,故不需要 macOS runner)。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一 ref 新推送取消进行中的旧 run,省 Actions 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pubspec.lock 的包 url 锁定国内镜像 pub.flutter-io.cn,CI 对齐以命中 content-hash。
  # 不设 FLUTTER_STORAGE_BASE_URL:让 flutter-action 从官方拉 SDK/engine(海外更稳)。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  test:
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地开发环境对齐(Flutter 3.41.5 / Dart 3.11.3 stable),
          # 钉死版本防「本地绿 / CI 红」的工具链漂移
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # .g.dart 全部 gitignored,checkout 后不存在,必须先生成 Isar schema + Riverpod provider
      - name: Generate code (build_runner)
        run: dart run build_runner build

      - name: Check formatting
        if: matrix.shard == 0
        run: dart format --output=none --set-exit-if-changed lib test docs

      - name: Analyze
        if: matrix.shard == 0
        run: flutter analyze --no-pub lib test tool

      # 先按文件分组，再完整运行所选文件，避免各片重复加载全部测试套件。
      - name: Run tests with coverage
        run: dart run tool/run_test_shard.dart 4 ${{ matrix.shard }}

      - name: Upload shard coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-shard-${{ matrix.shard }}
          path: |
            coverage/lcov.info
            coverage/test-shard-manifest.json
            coverage/test-results.json
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Download shard coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: flutter-coverage-shard-*
          path: coverage/shards
          merge-multiple: false

      # 保留分片目录避免同名 lcov.info 互相覆盖；缺片或空片必须失败。
      # ratchet 按源文件路径和行号取最大命中数，直接拼接不会重复计数。
      - name: Merge shard coverage reports
        shell: bash
        run: |
          set -euo pipefail
          reports=()
          for shard in 0 1 2 3; do
            report="coverage/shards/flutter-coverage-shard-${shard}/lcov.info"
            test -s "$report"
            reports+=("$report")
          done
          cat "${reports[@]}" > coverage/lcov.info

      - name: Enforce line coverage ratchet
        run: dart run tool/coverage_ratchet.dart

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code (build_runner)
        run: dart run build_runner build

      - name: Build macOS debug app
        run: flutter build macos --debug --no-pub

      - name: Test macOS short-sound pool
        run: bash test/native/run_macos_sfx_pool_tests.sh "${RUNNER_TEMP}/macos-sfx-tests"
