encounters:
  - id: cl_enc_reach_checkpoint
    spawn_config:
      active_limit: 4
      reinforcement_threshold: 1
      entry_warning_ticks: 10
      attack_grace_ticks: 6
    token_budgets:
      melee: 2
      ranged: 2
      charge: 0
      support: 0
    spawn_entries:
      - entry_id: road_blocker
        archetype_id: arch_bandit
        role_id: melee_brute
        entrance_id: entrance_fixture
        position_id: position_fixture
        behavior_id: behavior_fixture
      - entry_id: road_archer
        archetype_id: arch_bandit
        role_id: ranged_scout
        entrance_id: entrance_fixture
        position_id: position_fixture
        behavior_id: behavior_fixture
    objectives:
      completion_rule: all
      clauses:
        - id: reach_route
          kind: reach_checkpoint
          checkpoint_ids: [checkpoint_gate, checkpoint_bridge]
