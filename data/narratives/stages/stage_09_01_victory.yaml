id: stage_09_01_victory
title: 符引出关 · 承
paragraphs:
  - 刀疤脸的环首刀脱手落地，人靠着烽燧的塌墙坐下去，喘着气。他身后几个早跑散了，马蹄声往南去，转眼被风吞没。
  - 「你真要往里走。」他仰头看你，语气里没了先前的横，「劝你一句——碛北再往里，越走风越怪。有时候前头明明有城，有水，有人招手，你走过去，什么都没有。那不是路，是碛子哄人。前头那个揣符的，就是追着一座城走没的。」
  - 你没答话，从他刀下捡起自己该拿的东西，转身朝北。碛石在脚下咯吱作响，每一步都陷进半寸。回头看，烽燧已经小成一个黑点，再往南，受降城的影子早没了。
  - 铜符贴着胸口，朝北一角始终烫着，像一根看不见的线，牵着你往那片灰茫茫里去。你想起灰衣人的话——符认路，你别认路。前头哪怕真有城有水，那也未必是路。你迈开步子，头一回踏进了连脚印都留不住的地方。
