id: stage_15_01_victory
title: 山门官道 · 胜
paragraphs:
  - 最后一记拳风散在秋风里。使拳的宗师收势后退，抱拳的手停在胸前，半晌，长出一口气：「好。压箱底的东西全亮了，一招没接住你的。中原这些年看着你从山下走到山上，今日总算亲手称过了——这份斤两，走多远的路都够用。」
  - 道旁的同道纷纷上前，不再动手，只逐一抱拳。有人递上一囊酒，有人递上一把炒得喷香的胡豆，说是西边路上干燥，带着解闷。使拳的宗师拍拍你的肩，把你送出半里地，才停住脚：「送君千里，终须一别。我等就到这儿。」
  - 你回望来路。山门已经望不见了，只有官道笔直地铺回秋色深处，钟声早停了，风里只剩叶响。同道们立在道旁没有走，一排抱拳的身影，越来越小。
  - 你转身向西。头一程有人送，往后的路，就要自己走了。
