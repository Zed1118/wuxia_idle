id: stage_18_01_opening
title: 碛口 · 起
paragraphs:
  - 碗底并不平。白壳铺过去二三里，地势又往下收了一道，收出一个豁口，两侧是被风削立起来的砂岩，中间只容两三人并行。这是进凉州的路口。
  - 豁口里坐着一个人，背靠岩壁，膝上横着一根乌黑的短棍，两头包铁。听见脚步声，他没有起身，也没有抬头。
  - 「站住。」
  - 你站住了。
  - 「从东边来的？」
  - 「是。」
  - 他这才抬头看了一眼，看得很快，从你的靴子看到腰间的剑，又落回你的脸上，然后收回目光，重新盯着膝上的棍子。
  - 「东边来的，这些年也有几个。」他说，「走到丘脊上的多，下得来的少。下来了还站得住的，这十年我见过两个。」
  - 「那两个人呢？」
  - 「一个回去了。一个……」他顿了顿，「一个也回去了，只是抬着回去的。」
  - 风从豁口上头掠过，砂粒打在岩壁上沙沙地响。他把短棍在膝上转了半圈。
  - 「我不问你来做什么。来这儿的人都为一件事，问了也是白问。」他站起身，个头比坐着看上去矮些，肩却很宽，「我只管一件：碛口以西，我要看着人过。看着能过的过，看着不能过的回。」
  - 「怎么算能过？」
  - 「打一场就知道了。」他把短棍横在身前，两脚一前一后踩实在砂岩上，整个人像在地里生了根，「我不追你，也不抢先。你过得来就过，过不来就回去——回去不丢人，这条路上回去的人比过来的人体面得多。」
