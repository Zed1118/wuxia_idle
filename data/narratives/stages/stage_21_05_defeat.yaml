id: stage_21_05_defeat
title: 绝顶平台 · 折
paragraphs:
  - 你退了。
  - 不是被打退的——是脚下那块地，站不住了。
  - 少年收了势，站在三步外，胸口起伏得厉害。他脸上没有胜的样子，只有一种更冷的东西：他看明白了。
  - 「你撑不住。」他说。
  - 你没有答。
  - 「他们说那位不还手。」他慢慢走到青石边，把那枚铜符拿起来，翻过来看了看，「不还手是因为不用还。你不还手，是因为还不了。」
  - 风从东面上来，把云推得很低。
  - 「所以这山真的空了。」少年把符按回石头底下，手在石面上停了一下，「我下山了。」
  - 「等一等。」
  - 「等什么？」他回头，眼睛很亮，也很硬，「等你歇好了再打一场？前辈，撑得住就是撑得住。撑不住的时候歇一歇再撑住，那不算。」
  - 他朝山道口走了两步，又停下。
  - 「符我留在原处了。」他说，「不是留给你。是留给下一个上来的人——万一他撑得住呢。」
