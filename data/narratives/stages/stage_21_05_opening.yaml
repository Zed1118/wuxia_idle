id: stage_21_05_opening
title: 绝顶平台 · 起
paragraphs:
  - 绝顶还是那块平台。云在脚下，来路群山尽低。
  - 北头那块青石也还在。石头底下压着的东西被人取出来了，摆在石面上——一枚铜符，符面朝着来路，边缘让几十年的雨水啃出了一圈毛边。
  - 符旁边坐着一个少年。
  - 十六七岁，瘦，衣裳单薄，嘴唇冻得发白。他抱着膝盖坐着，眼睛盯着山道口——不知道盯了几天。听见脚步声，他猛地站起来，站得太急，晃了一下才站稳。
  - 他看着你，从头到脚看了一遍，眼里的光一点一点暗下去。
  - 「你也是上来的。」他说。不是问句。
  - 「你等了几天？」
  - 「四天。」少年把手在袖子里搓了搓，「我以为上头有人。他们都说有人——说那位坐在这儿，你打上去，他不还手，你就自己知道自己差在哪儿了。」
  - 他指了指那块青石。
  - 「我上来的时候，石头底下压着这个。符面朝着来路。我在道上捡过一枚一模一样的，也是朝着来路。」他的声音有点抖，分不清是冷还是别的，「我以为那是留给我的路标，一枚接一枚，一直走到有人的地方。」
  - 「结果没人。」
  - 「结果没人。」他说，「四天。我把这山头走遍了，连个火塘的灰都没有。这里荒了很久了。」
  - 风从东面上来，掀了掀他的衣角。
  - 「那你为什么不下山？」
  - 少年愣了一下，随即把腰挺直了。
  - 「因为符是朝着来路的。」他说，「朝着来路的符是留给后来人的。既然只有我一个后来人，那这符就是我的事。我要是下去了，这符就白留了。」
  - 你看着他。四天没吃东西的人，站得笔直。
  - 「你打算怎么办？」
  - 「等。」他说，「等到那位回来，或者等到我自己变成那位。」他忽然抬起眼，很直地看着你，「你上来做什么的？」
  - 「我上来看看这条路还活着没有。」
  - 「活着。」少年说，「我就是活着的证据。」
  - 他往前踏了一步。风吹得他晃，可他脚下没动。
  - 「我要跟你打一场。」他说，「不是抢这个位子。是我等了四天，得知道这山还配不配人上来——你要是撑不住我，那这山就真空了，我把符还回石头底下，下山去，一辈子不再上来。」
  - 「我要是撑住了呢？」
  - 「那我就接着等。」他说，「等我自己够格。」
  - 你把剑解下来，搁在青石上，就搁在那枚铜符旁边。
  - 「不用剑。」你说。
  - 少年的眼睛一下子亮了，亮得几乎有点凶。
  - 「你不还手？」
  - 「我站着。」你说，「你打你的。你打得完，这山就还立着。」
  - 云在脚下合了又开。他没有再问，欺身上来了。
