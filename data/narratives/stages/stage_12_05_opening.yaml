id: stage_12_05_opening
title: 荒村野店 · 启
paragraphs:
  - 山坳的尽头是个荒村，村口一间野店，半塌的招牌上字迹早已褪尽。店里只一个老者，正弯腰扫着地上的落叶，又起身给油灯添了点油。一身洗得发白的旧衣，背有些驼，扫地的动作慢吞吞的，是你这一路见过最不起眼的人。你进门要了碗茶，起初并没把他放在心上。
  - 可坐下不久，你端茶的手便顿住了。这老者扫地、添油、走动，样样寻常，你的目光却怎么也在他身上落不实——他周身的气息静得没有一丝破绽，静得反常。名门那些人，威势摆在面上，一眼看穿；这老者把什么都收进了里头，绵绵软软一层，底下藏着的东西，你竟探不到底。
  - 「客官找的东西，不在名头上。」老者放下扫帚，缓缓开口，也不问你是谁，「老朽没有名号。名是身外物，练招的人一旦惦记它，招就长歪了。守着一处不肯走的，困在名头里不肯放的，都是一样的困。老朽只是把该练的练进了骨头，如此而已。」
  - 你放下茶碗，站起身。守拙翁困在旧路里，是「守拙」的困；眼前这老者不困于地、不困于名，把本事练进了骨子，是「守拙」的成——你一路要寻的那个「实」，此刻就站在这半塌的野店里。你握住了剑。一流这一程的最后一招，你要在这无名之人手上，亲手接下。
