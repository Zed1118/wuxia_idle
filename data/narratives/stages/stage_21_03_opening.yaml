id: stage_21_03_opening
title: 嵩山旧坪 · 起
paragraphs:
  - 论剑坪没变。
  - 还是那块半亩见方的平地，还是四围的老松，石碑还立在北头。碑前那三柄旧剑也还插着——剑身锈成了褐色，锈得连剑脊都圆了，倒像三根从石头缝里长出来的东西。有人在剑柄上系过红绳，绳早褪成了白，被风吹得贴在锈上。
  - 变的是坪上的人。
  - 二三十个年轻人分散在坪上，各练各的。有人对着老松打桩，有人两两拆招，有人只是坐着看。声音不大，招法也不见得多好，可整片坪是活的——你记忆里的这块地，只在论剑那三天活过，散场之后就空了几十年。
  - 一个年轻人从人堆里走出来。二十出头，衣裳干净，走路脚下很轻。
  - 「客人上坪，按规矩要报个来路。」他说得客气，不生硬。
  - 「西边。」
  - 「西边远。」他笑了笑，「多远？」
  - 「阳关外。」
  - 坪上有几个人停了手，转过头来。年轻人的笑没收，眼神却认真了一层。
  - 「那就更要报了。」他说，「这坪上如今练的功夫，一半是从西边传回来的。」
  - 你没有说话。
  - 「三十年前有个人从这里往西去。」他说，「后来陆陆续续有东西传回来——不是他传的，是别人带的。走商的、押镖的、还俗的和尚。一句半句，一招半式。我们这一辈把它们拼起来，拼出个大概样子，就照着练。练了十几年。」
  - 他往石碑那边偏了偏头。
  - 「碑上刻的是我爷爷那一辈的名字。那一辈论的是谁高谁低，论完了各回各家，剑插在这儿就没人动过。我们这一辈不论高低——我们论的是那个人往西看见了什么。」
  - 「论出结果了吗？」
  - 「没有。」他说，「所以还在练。」
  - 他退开两步，两手空着，重心落在前脚掌上。
  - 「客人从阳关外回来，身上必有个答案。」他说，「我们这一坪的人，等这个答案等了十几年。你不肯说，我就自己来取——取不到是我学艺不精，取到了，坪上二十几个人都能少走十年弯路。」
  - 松风穿过坪子。三柄锈剑纹丝不动。
