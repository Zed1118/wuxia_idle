id: stage_18_04_defeat
title: 演武场 · 挫
paragraphs:
  - 你倒在夯土上的时候，三个人都还站在原处，连站位都没有乱。
  - 女子走过来，蹲下，看着你。
  - 「你想赢。」她说。
  - 你想反驳，可是喘不上气。
  - 「我们三个不比快。刚才那一场，我们三个也没有一个人抢先出手。」她说，「你从头到尾都在找空子——找我们的破绽，找我们的接不上。找了半个时辰，你自己先散了。」
  - 她站起身，退回去两步。
  - 「破绽是有的。可你找的是能一下赢的那种破绽。」她说，「那种破绽我们三个守了几十年，早补干净了。」
  - 「那还有什么破绽？」
  - 「有一种。」女子说，「等我们自己动的时候。我们一动，就有一瞬收不回来。可那一瞬要等——等不来就不出手，等来了就一下。你要是心里想着赢，就等不住那一瞬，因为等着的时候什么都不做，看着像在输。」
  - 她把袖口松开又扎紧。
  - 「歇着吧。想清楚了再来。这道场我们守了几十年，不差你这几天。」
