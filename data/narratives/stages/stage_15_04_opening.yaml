id: stage_15_04_opening
title: 沙海故道 · 起
paragraphs:
  - 沙海比传闻里更大。商路故道从沙丘之间穿过，两旁隔一段就立着一根半埋的石桩——前人留下的路标，桩身被风沙打磨得只剩半人高。你顺着石桩走到第二日，日头正毒的时候，沙丘背后转出一队人马，弯刀出鞘，把故道拦了个严实。
  - 为首的汉子跨一匹健马，满面风沙刻出来的沟壑，抱着一柄厚背大刀坐在鞍上，居高临下地打量你：「单人穿沙海，几十年没见过几个。这条道姓什么，外来的懂不懂规矩？」他啐了一口沙，「留下买路的东西，或者留下本事——沙海总瓢把子的规矩，几十年没改过。」
  - 你不答话，只往前走。总瓢把子眯起眼，忽然翻身下马，大刀拄进沙里：「有点意思。几十年前也有这么一个不开口的，背着剑，单人往西走，老子那时还是个小喽啰，眼看着他从刀阵里走过去，一个人都没杀。」他掂起大刀，沙从刀背上流下来，「老子等了几十年，就想知道那样的本事到底是个什么斤两——今日你来了，正好。」
  - 马匪们在四周的沙丘上围成一圈，不上前，只看。总瓢把子的刀势缓缓抬起，沙海的热风忽然停了。你放下行囊，拔剑。
