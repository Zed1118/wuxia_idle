id: stage_12_03_opening
title: 秋山道 · 启
paragraphs:
  - 出了市井，往山里去。秋山的石道又陡又窄，一个挑山客担着两大捆柴，正一步一步往上挪。他年岁不小，脚下却极稳，山风把他汗湿的衣衫吹得贴在背上，那两捆柴压得扁担弯成一张弓，他的腰却没弯多少。
  - 你跟在后头看了半程，看出些门道来。他每上一级石阶，落脚之前，身子先微微一沉，把担子的坠力卸进腿里，再借那一沉的势往上送。一担死柴，被他挑出了活劲——这卸力借势的功夫，是阴柔一路的上乘，你在洛阳榷场那些拿银子堆名声的人身上，连边都摸不着。
  - 到了一处平缓，挑山客放下担子歇脚。你上前问他师从哪一门、有何名号，他抹了把汗，憨憨摇头：「就是个挑担的，哪有什么名号。这点力气，挑了三十年柴，自己长出来的。」他说得随意，像在说山里的天气。
  - 你没有走开。三十年挑担挑出来的功夫，你想亲手接一接。名门给不出的东西，兴许就藏在这一担柴的分量里。你退到道旁较宽处，握住了剑——这低调行家名实到底相不相副，你接他一招便知。
