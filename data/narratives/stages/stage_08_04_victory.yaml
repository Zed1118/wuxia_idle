id: stage_08_04_victory
title: 孤城闭雪 · 终
paragraphs:
  - 厚背刀砍进城门前的拴马桩，深达半寸。老卒双手把着刀柄，却拔不回去了——你的剑尖，停在他咽喉一寸外。半月阵的长枪僵在半空，雪落在枪尖上，没人敢动。
  - 你收剑，后退一步，又拱了拱手。老卒盯着你看了半晌，忽然放开刀柄，摆手叫戍卒散了。「是条汉子，招数也正。」他喘着白气，「进城说话。」城门在你身后吱呀合拢，三十年的门轴，涩得很。
  - 火塘边，你取出铜符。老卒只看了一眼，猛地站起来，甲叶子哗啦一响。「这纹——」他声音都变了，「三十年前，北派巡边的人佩过这个。那时受降城还开着门，北派的人一年过来两趟，城里粮道靠他们护着。后来北派不来了，碛北的路断了，城才闭的门。」他坐回去，看着火，半天没说话。
  - 你问灰衣人在城里打听什么。「打听碛北那一位，还收不收人。」老卒往火里添了根柴，「城里最老的更夫告诉他：收不收，不看人，看符。他听完就走了，走的时候，背影像被抽掉了一根骨头。」火塘噼啪响。你把符收回怀里，符贴着胸口，一夜都是沉的。
