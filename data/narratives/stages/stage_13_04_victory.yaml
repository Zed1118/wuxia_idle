id: stage_13_04_victory
title: 断崖瀑布 · 胜
paragraphs:
  - 铁锏没有半分花哨，一锏下来就是实打实的千钧之力，砸得窄梁嗡嗡地颤。你不退——这窄梁上退一步就是深渊——硬是连着接了他三十六锏，虎口震裂了，剑势却一剑比一剑沉。第三十七锏砸落时，你不再卸力，剑锋顺着锏身硬顶上三步，一步一声，把他生生逼退到了窄梁尽头。铁锏横在胸前，再砸不下来了。
  - 壮汉低头看看自己的脚——脚跟已经悬在崖外。他忽然放声大笑，笑声盖过了瀑布：「好！十九年，今天这堵墙，叫人撞开了！」他收锏侧身，把窄梁让了出来，「过吧。当年顶上那位说，拦不住的就放过去——我守了十九年，守的就是今天。」
  - 你收剑，问他往后去哪。他抹了把脸上的水珠子，望着瀑布出神：「我守在这儿，是因为当年那一锏把我打怕了，怕得不敢再上去。今天你从我锏底下走过去，我才看明白——不是他那一锏重，是我自己停了。」他把铁锏往肩上一扛，「你上你的顶。我再练十年，十年后，我也上去。」
  - 你走过窄梁，瀑布的水雾劈头盖脸打下来，凉意透骨。身后水声依旧，只是那堵拦了十九年的墙，从今天起，换了个性子——不再是拦人的墙，是量人的尺。断崖过了，绝顶只剩最后一段。
