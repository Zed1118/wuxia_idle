id: stage_17_04_defeat
title: 沙海深处 · 挫
paragraphs:
  - 你等它使完了。
  - 这是个错——那道砂柱攒到第七圈，已经不是砂了，是一堵横着扑过来的墙。你剑上的力气全被砂吃掉，人被推着退了十几步，最后半跪在洼底，满口都是白砂的腥。
  - 卷沙手收了手，脚边的砂慢慢静下去。他走过来，蹲在你面前，看了一会儿。
  - 「你在等它。」他说，「东边人爱等，我知道——你们讲后发制人，等对方老了再出手。这一路上，等是对的。可对着这一下，等就是错的。」
  - 他伸出两根手指，在砂上画了一道渐渐变粗的线：「它一直在长。你等得越久，它越大。天底下的事分两种：一种越等越弱，你等它；一种越等越强，你得在它还小的时候按住。」
  - 他站起身，拍掉膝上的砂：「什么时候分得清这两种，什么时候再来。」
