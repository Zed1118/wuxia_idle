id: stage_17_02_victory
title: 黑风口 · 胜
paragraphs:
  - 你没有跟他抢那半步。他一刀压下来，你顺着风势侧开，让风替你带走了那一分力；刀落空的一瞬，两边的岭正好把风收窄，他自己的势被风顶了回去。你的剑在他收势的空当里搭上了刀背。
  - 黑风刀客愣了一息，随即大笑，笑声在槽里撞出好几重回响：「借风！」他把刀抽回来拄住，「十一年，在这口子上跟我动手的，用风的你是第二个。」
  - 「第一个是谁？」你问。
  - 「不知道。」他抹了把脸上的砂，「二十几年前的事了，那会儿我还没守这儿，是听上一个守口的说的。他说来过一个背剑的中原人，在这槽里走了一天一夜，出去的时候人还站着。上一个守口的问他怎么过的，他说了句怪话——他说这风不是拦路的，是指路的，顺着它走，它就送你。」
  - 他把刀横过来递到你面前，刀身平得像面镜子：「拿这个挡脸，能省一半力气。到了古城还我。」他侧身让开那条被砂埋了一半的路，「往西十里出槽，再八里，有座城。你别指望在那儿歇脚——那城早叫沙吃了。不过城里有人，你路过，替我问一声他还活着没有。」
