id: stage_11_05_defeat
title: 问鼎台 · 殇
paragraphs:
  - 鎏金公蓄起那一诀，金光煌煌灌注，四十年的名头随之压将下来。就在这一瞬，你心底那个「名震中州」的念头，竟先你一步动摇了——你迟疑了半息，剑势顿住。便是这半息的迟疑，让那片金光卷住了你的剑，将你重重震下问鼎台。
  - 「你也被唬住了。」鎏金公立在台上，声音里听不出得意，「你一路看穿了那么多虚名，到了我这里，却先信了『名震中州』这四个字。信了，剑就软了半分——你输的不是这一诀，是你自己那半息的心虚。」这话像一盆冷水，浇醒了你。
  - 你撑剑起身，胸口那口气堵得发慌。是了，方才那半息，你分明是被他四十年的名头压住了，忘了自己一路看穿的道理——名头再响，也只是旁人给的；他这一诀练透没练透，得你亲手接了才算数，怎能未接先信？连你，也差点栽在这一个「名」字上。
  - 你合上眼，把「名震中州」这四个字，连同满台的敬畏，一并沉到心底去，直到眼前只剩下他那一诀里，起势之后那一段虚软的收势。再睁眼时，那半息的迟疑散了。你重新握剑，望向台上那位名满天下的老人——这一回，你只看他的剑，不看他的名。
