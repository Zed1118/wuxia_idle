id: stage_07_04_defeat
title: 灰衣重现 · 殇
paragraphs:
  - 你单膝跪进雪坡，喘着气。灰衣人的烛影从四面收拢，你竟没看清哪一记是实的、哪一记是虚的。他没有追击，收了袖，退开半步。
  - 「看不清，是么。」他的声音还是那么淡，「重手看得见，我这一手看不见。看不见的东西，最难破。」他偏头看你，「你太急了。急着替南边那一脉立威，急着不靠李寒的余荫。可这一手不吃急——它吃的，是静。」
  - 你没有答。心里那句「独当一面」卡住了。你想起师父三句遗言里最后那一句——「最后那一段路——」。你原以为独当一面，就是不靠师父。这一夜你才隐约觉着：不靠余荫是一回事，能不能自己站住，是另一回事。灰衣人的灰影没进松林。你扶剑起身。这一坡的雪，你还要再上来一回。
