id: stage_18_05_defeat
title: 火堆前 · 挫
paragraphs:
  - 你躲了。
  - 那一掌太慢了，慢得像在邀你躲。你往左，左边是火；你往右，右边是石；你往后，后面早被他的掌势占住了。等你发现无处可去的时候，掌已经贴到了胸口。
  - 落地的地方离火堆只有两步。热气烤在脸上，你却觉得冷。
  - 霸主没有追。他把手收回去，重新在石头上坐下，往火里推了一根柴。
  - 「你躲了。」他说。
  - 「躲不开。」
  - 「本来就躲不开。」他说，「我这一掌慢，就是为了让你去躲。你一去躲，就等于承认你想全须全尾地过去——想全须全尾过去的人，接不住这一掌。」
  - 你撑着地坐起来。
  - 「那要怎么接？」
  - 「站着不动。」霸主说，「让它压到跟前，压到你以为要完了，然后等它收。任何一掌打出去都要收回来，收回来的那一线上没有力。你要的是那一线。」
  - 「万一它不收呢？」
  - 「那你就死了。」他说得很平静，「所以这不是招式的事。招式我可以拆开了讲给你听，讲三遍你就会了。可讲会了没有用——真到跟前，你还是会躲。」
  - 火苗歪了一下，又立直。
  - 「你师父第一回也躲了。」霸主忽然说。
  - 你抬起头。
  - 「他躲了三回。」霸主说，「第四回他站住了。」
  - 他往火里又添了一根柴，抬眼看了看东边的天。天还黑着。
  - 「回去。」他说，「我不急。等了四十年，不差你这几天。」
