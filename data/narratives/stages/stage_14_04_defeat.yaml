id: stage_14_04_defeat
title: 演武旧坪 · 败
paragraphs:
  - 第几荡你数不清了。人马俱进的刹那，天地都朝你压过来，再睁眼时已躺在坪边的草丛里，耳畔青石板的震响还没停。副将收兵勒马，没有半分得意：「荡势没到，骨头先怯了。回去把下盘练沉了再来。」
  - 你撑坐起来，望着坪心那道被长兵犁出的石痕，胸口发闷，心里却清明——五荡之威，不在力，在那股一往无前、连退路都不给自己留的势。马队不下山，副将的话还在坪上立着：接全五荡，才见得着主人。这一败的斤两，你一两一两记进了骨头里。
  - 下山歇脚时，你反复复盘那几荡：荡势一起，人马合一，退则其势愈盛，唯有抢进中线才有一线生机——可抢进的那一步，需要把生死先押上去。你在坪边的石上坐了半夜，听了一夜的松涛。天快亮时你站起身，拍去衣上草屑。势再盛，也是人使出来的；人能使，人就能接。
