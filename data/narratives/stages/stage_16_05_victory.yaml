id: stage_16_05_victory
title: 西凉门户关城 · 胜
paragraphs:
  - 万骑之势在最后一线上折了。接关人的重刀停在你剑前一寸，停了很久，然后缓缓收回，归鞘——声音沉得像落闩，只是这一次，是开门的意思。
  - 「几十年前那一战，他让我三分，我记到今天。」接关人侧过身，让出门洞，灰白的须发在穿堂风里动，「今日这一战，你没让我——一分都没让。好。霸主等的分量，就该是这样的。」
  - 「铁马冰河，你破了它，它就是你的了。」他从怀里取出一卷帛书，双手递过来，「西凉的规矩：招不认主，认接得住它的人。当年霸主把这路刀法传给守门的，如今守门的把它交给破门的——它到你手上，比在我手上走得更远。」
  - 「往里走。」接关人退回门边，站回他站了几十年的位置，「过了这道门，沙海往纵深去，凉州城在沙海那一头。霸主在西凉深处等，等东边再来一个故人——这句话，他说了几十年。」你接过帛书，抱拳一礼，跨过门洞。身后没有落闩声——西凉的门，始终开着。
