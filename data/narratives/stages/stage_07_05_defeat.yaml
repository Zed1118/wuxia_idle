id: stage_07_05_defeat
title: 千钧压顶 · 殇
paragraphs:
  - 你被那一记千钧压顶震得倒退，单膝按进北派山门的石阶。宗匠的拳停在你头顶三寸，没有落尽——他收了手。石阶上的积雪被震得四散，落回你肩上。
  - 「差一线。」宗匠的声音闷闷的，「你的剑不弱，可你太想一剑定输赢了。这门重手压的，就是这个『急』字——你越急着破它，它越压得实。」他退回石阶，「南边那位李寒，当年破西凉的剑，靠的不是急，是静。你差的，是这一口静气。」
  - 你没有答。心里那句「独当一面」，又一次卡住。灰衣人在雪坡上说你太急，宗匠在山门前也说你太急。你原以为不靠太祖的余荫，就是独当一面。这两战教你隐约觉着：站住，比不靠人更难。你扶剑起身，北派山门那道深深的凿痕，在你眼前很近。这道门，你还要再来叩一回。
