id: stage_11_02_victory
title: 金鼎山门 · 胜
paragraphs:
  - 那套家传剑法的架子确是周正，可你一搭手便探到了底。招式规整得像临帖，一笔一画都照着祖师的样子，偏偏笔笔都是描的，没有一笔是他自己写进去的。你顺着他一个照本宣科的转身，剑背一压，将他逼退到山门的石阶下。
  - 「不……不可能，」他连退三步，撞在门柱上，「这可是我金鼎门传了八十年的剑！」你收剑立定：「剑是好剑，是你祖师的。可你只学了架子，没练进骨头里去。祖上的匾额挂在门楣上，替不了你手里这一剑。」
  - 他仰头看了一眼那块黑底金字的匾额，脸上血色褪尽。那匾额压了他一辈子，也护了他一辈子，护得他从没想过，有朝一日光靠这块匾，是压不住一个北边来的生人的。门人们面面相觑，再没人敢抬那高高的下巴。
  - 你越过石阶，往山门内走。中州名门的第二层虚，你也看清了——头一个是拿排场唬人，这一个是拿祖上的名头唬人。名门二字里的这个「门」，有时候护着的不是本事，是几代人躲在匾额后头，谁也不肯再往前迈一步的怠惰。
