id: stage_20_05_opening
title: 孤城开 · 起
paragraphs:
  - 日头偏西，长烟贴着戈壁浮起来。孤城在前，城门紧闭——跟几十年来的每一个黄昏一模一样。
  - 不一样的是门下立着一个人。
  - 甲胄还是那身旧得发暗的，须发比那年更白，腰背仍旧笔直。他望着你从驿道上走近，不动，直到你在一箭之地外站定。
  - 「称过的。」他开口，声音沙得像风磨过城砖，「出关那日，老夫亲手称过你。今日不用称了——人走成什么样子，一眼就看得见。」
  - 他从门房里取出一本册子。册子不厚，纸边磨圆了，让几十年的手汗浸成了深色。
  - 「出这道关往西、老夫亲手放行的，一页一个名字。」他翻开，一页一页过，动作很慢，「几十年，只添，不销。」
  - 他翻到很靠前的一页，停住，指给你看。
  - 「背剑的少年。某年某月，西出。未归。」
  - 又翻到靠后的一页。
  - 「山上来的留符人。某年某月，西出。」他合上册子，抬起眼，「今日，回来了。」
  - 「销账用笔？」
  - 「不用。」他把册子搁回门房的石台上，按住了刀柄，「用手。老夫这一辈子练的是落闩的功夫——闩落下来，城就闭了，砂进不来，人也进不来。孤城闭，那年你接住了，学去了。」
  - 「可门不能只闭不开。」他缓缓拔刀。刀身暗沉无光，像一根门闩，「闭门的功夫守城。开门的功夫——救人。开门先破闩，破的是自家落了几十年的闩。这一手老夫练了几十年，没使给人看过。不是藏私。是配看的人，得从门外回来。」
  - 长烟落日，孤城之下，他把刀提到身前，刀尖微微下垂，像门闩离槽前的最后一寸。
  - 「接住这一开。」他说，「门就是你的。账，也就销了。」
