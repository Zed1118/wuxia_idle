id: stage_14_05_opening
title: 绝顶峰台 · 起
paragraphs:
  - 马战宗师上山的时候，没有骑马。一万里路的马蹄声停在坪下，他一步一步走上峰台，走得很慢，像在用脚量这座山。须发花白，腰刀未佩，一身半旧的皮裘，唯有一双眼睛亮得惊人：「中原绝顶换了新人。消息传到西凉，用了四个月；我走到这里，又用了一年半。」
  - 他在你对面站定，先打量峰台，再打量你，末了目光落向石下那枚凉铜符的一角：「我听说过这里的规矩——前人留符，后人循符。」他摇头，「我不循符。西凉的路数，是自己走出来的。你站上这个被看的位置，我是后来的第一个人，可我不是来接你的符的，是来试你的斤两的。」
  - 他活动肩颈，骨节咯咯作响，摆开架势——沉腰，坐马，人与地势合一，明明脚下无马，整座峰台却仿佛响起万马奔腾的余音：「十荡十决，西凉军中马战杀法，一往无前，有进无退。我把马留在山下，把荡势带上来了。中原的绝顶，借我一战。」
  - 你望着这个须发花白的老人。他不带一兵一卒上台，气势却比演武坪上的五荡沉了不知几倍——副将的荡，是学来的；他的荡，是从骨头里长出来的。你想起候峰翁守了四十六年的那座峰台，想起石下那枚符。从前你循符而上，今日有人循你的名而来。你缓缓拔剑，剑尖垂地：「这座山，借你。」
