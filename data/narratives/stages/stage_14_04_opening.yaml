id: stage_14_04_opening
title: 演武旧坪 · 起
paragraphs:
  - 半山有一处演武旧坪，不知是哪一代人演武留下的，青石板被踩得发亮。副将立马坪心，甲叶未卸，长兵横在鞍前，人马合一，像一堵会喘气的墙。他见你上来，不下马，只把长兵一顿，石板嗡嗡震响：「信使、先锋、西域人，你都过了。到我这儿，是马队的第四程。」
  - 「我家主人的杀法叫十荡十决。」他缓缓催马绕坪一周，马蹄声一下重过一下，「荡者，人马俱进，一往无前。我学了他四十年，学得五荡。」他在坪心勒定，长兵斜指，「规矩简单——接住我五荡，坪子让给你，主人亲自上山。接不住，你下山去，马队也下山去，这座山当我们没来过。」
  - 你看了看这片旧坪。青石板碎了几块，缝里长着草，不知荒废了多少年——山中人早不用它了，今日却被一队远来的骑兵重新踩响。你忽然觉得这座坪子等这一天，或许也等了很久。你走上坪心，站定：「请。」副将一提缰，战马人立而起，第一荡到了。
