id: stage_09_04_defeat
title: 黑水绝壁 · 殇
paragraphs:
  - 守口人一臂横扫，你架剑硬接，只觉一股蛮力顺着剑身撞进来，五脏都跟着一震，人被掀翻出去，撞在黑石壁上。剑还在手里，胸口却像塞了块石头。
  - 「起来。」守口人没有追击，负手立在窄口当中，「四十年，栽在这道口上的，比过去的多得多。栽了不丢人。丢人的是栽一回就不敢再站。」他顿了顿，「那位在里头等着，可他不等没过这道口的人。」
  - 你撑着石壁站起来。师父那句遗言又翻上来——听那处地方的风。黑水绝壁这道窄口，风被石壁夹得又急又直，像一柄绷紧的弦。你闭了闭眼，去听那股风的走势，听它从哪里来，往哪里去，什么时候松，什么时候紧。
  - 风紧了一分。你睁眼，重新沉腰持剑，正对着那堵挡了四十年的墙。这一回，你不接他的力，你等他的风。
