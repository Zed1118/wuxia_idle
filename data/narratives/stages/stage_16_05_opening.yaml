id: stage_16_05_opening
title: 西凉门户关城 · 起
paragraphs:
  - 沙海尽头，两山夹峙，一座关城起在山口之间——石头垒的，比阳关矮，却厚，像从山骨里直接长出来的。最出人意料的是那道门：大开着。门洞深处的风穿堂而过，吹得两壁火把明明灭灭，门后隐约是更深的西凉。
  - 门下立着一人。铁甲按刀，须发灰白，腰背笔直，站姿竟与阳关那位守关老将像是一个模子里出来的——只是老将守的门常年闭着，他守的门，常年开着。
  - 「东边来的。」接关人开口，声音像两块石头相磨，「阳关闭门，是中原的守法——门里的东西金贵，怕丢。西凉这道门开着，是我们的守法——门后的东西，拿得动的人才配进来；拿不动的，进来了也是白来。」
  - 「我在这道门底下替霸主接东边的人，接了几十年。」他缓缓拔刀——刀极重，刀背厚得像一段城砖，双手端平了，刀身上映着门洞里的火光，「几十年前接过一个。那一战，是他让的我。打那以后霸主吩咐：东边再来人，还是这一战——接关一战。」他向前一步，蹄声般的劲力从砂地下隐隐透上来，「铁马冰河。西凉万骑冲杀的路数，收在这一刀里。接住了，门后的西凉随你走；接不住，回东边去——这道门，不挪地方。」
