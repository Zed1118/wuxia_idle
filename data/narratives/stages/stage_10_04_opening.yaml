id: stage_10_04_opening
title: 嵩阳关 · 启
paragraphs:
  - 嵩山脚下有一座关，唤作嵩阳。关不大，一夫当道，却是入中州腹地的必经之处。守关的是个花白胡子的老者，据说在这关上一守就是三十年，中州几家门户换了几茬掌门，他还杵在这儿，像关墙上一块长了青苔的旧石。
  - 你到关下时，老者正背手立在关门中央。他不问你来路，只上下看了你一眼：「又一个想过关的。」他声音沉，像敲在石头上，「这关我守了三十年，守的不是石头墙，是个规矩——想进中州腹地，先证明你担得起中州的风浪。过不去我这一关的，趁早回头，省得进去害人害己。」
  - 你说你自有要去的地方。老者摇头：「人人都说自有去处。三十年了，多少人从我这关下过，说要去闯一番天地，回来时不是断了手脚，就是没了骨气。」他缓缓抬起手，掌心宽厚，「我拦下的，是那些还没准备好就往深处闯的。让我看看，你准备好了没有。」
  - 他一步踏出，关门下的地砖都似震了一震。这是纯以气力筑成的一堵墙，稳、沉、不给你半分取巧的余地。你凝神握住剑，迎上去。
