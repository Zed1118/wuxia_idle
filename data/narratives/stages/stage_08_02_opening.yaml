id: stage_08_02_opening
title: 瀚海孤烟 · 启
paragraphs:
  - 草原走到尽头，脚下换了沙。瀚海不是海，是一片望不到边的大碛，沙梁一道压着一道，像凝住的浪。日头明晃晃地悬着，风卷着沙粒打在脸上，细细地疼。远处一座废弃的烽燧，燧顶歪着，一缕孤烟笔直地升上去。
  - 有烟就有人。你朝烽燧走，走到半里外，沙梁后头忽然掠起几条人影——身法极快，踩着沙脊几个起落，就兜到了你前后。都是短衣束袖的打扮，脸上蒙着沙巾，只露一双眼。当先一人手里一对分水刺，刺尖在日头底下亮得扎眼。
  - 「烽燧里的水，是我们弟兄的。」当先那人声音又轻又快，「过路的，把水囊留下，兵刃留下，人可以走。」他说话间，脚下没有一刻站定，绕着你转，沙巾后头那双眼上下打量。
  - 你解下水囊掂了掂，没有递过去。瀚海腹地还有几百里，没有水，追不到人。当先那人眼一眯，分水刺一翻。「敬酒不吃。」两侧人影同时动了。你拔剑。
