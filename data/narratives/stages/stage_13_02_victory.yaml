id: stage_13_02_victory
title: 半山寺 · 胜
paragraphs:
  - 知客僧的竹帚使的是一路灵巧功夫，帚影如剑，专点你招式将发未发的节骨眼。你不与他比快，由着他点，点的次数多了，倒看清了他帚法里藏的东西——那不是拦人的招，是留人的招，招招都往你下盘扫，扫的不是腿，是你心里那点「半山也很好」的念头。你剑势一沉，不退反进，一剑递到帚影最密处。竹帚停了。
  - 「好一个不退。」知客僧收帚合十，念了声佛，「小僧在这儿扫了三十年叶子，扫走的上山客没有一百也有八十。多数人输在脚软——不是武功不够，是心里已经住下了。施主这一剑，剑尖一直指着山上，半分没偏。」
  - 他推开寺后的小门，门后一条石阶，笔直插进云里。「小僧不是拦路，是替山上问一句：你知不知道上去要舍什么。答『不知道』还肯走的，才是真要走的人。」他顿了顿，「施主舍过东西么？」你想起怀里两枚旧物，想起守拙翁的潭、无名客的灯——这一路你得了许多，也一路在把得着的放下。知客僧看你的神色，笑了：「舍过的人，不用答。」
  - 你迈上石阶。身后扫帚声又沙沙地响起来，半山寺的僧还在扫他的落叶，扫得心安。半山确实很好——只是你的路，在半山以上。
