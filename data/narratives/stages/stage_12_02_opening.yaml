id: stage_12_02_opening
title: 槐花巷 · 启
paragraphs:
  - 过江之后是一片市井。你转进一条僻静的陋巷，槐花落了满地。巷子尽头，一个赤膊汉子正对着墙根打拳。拳风朴实，一招一式全无花样，看着像庄稼把式，可你站定看了一会，便挪不动脚了——他每一拳都打在同一处砖缝上，日子久了，那砖竟被打出一个浅浅的凹坑。
  - 你看得出神。这拳法没有名目，没有起承转合的讲究，甚至称不上好看，可那份「熟」，是二十年如一日、一拳一拳砸出来的。名门弟子的剑练给看客，这汉子的拳，练给墙根。招是最笨的招，底子却是最实的底子。
  - 汉子察觉有人，收了拳，抹一把汗回过头。你问他师承哪一门，他愣了愣，摇头：「没师父，自己瞎练的。街坊都笑我练这没名堂的东西，练它作甚。」他说得实在，没有半分自矜，倒像在说一件顶寻常的事。
  - 你没笑。你在名门里见够了有名无实，此刻却想亲手掂一掂这没名堂的东西，到底有几斤几两。你退开半步，握住了剑。这一巷子的槐花底下，藏着的是虚名，还是真功夫，你接他几拳便知。
