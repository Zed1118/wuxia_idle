id: stage_07_01_opening
title: 北地风寒 · 启
paragraphs:
  - 雁门关的关楼在你身后一点点矮下去。风从北面来，不带中原的土腥，也不带西凉的砂粒——是干冷的、裹着雪粒的风，一路刮过阴山、云中、朔方，到雁门这里已经走了几百里。关外的道上没有客栈的灯，只有一队戍卒的火把在雪地里明灭。
  - 你出关这一日，是接掌门户的第九日。师父那柄旧剑背在你身上。你想起师父当年也是这样离山独行，只是他往的是西、是昆仑，你往的是北。师父听过的三处风里，没有这一处。过了这道关，太祖的余荫就照不到了——这一程的风，要你自己去听。
  - 火把近了。当先一名戍卒披着旧甲，拳上缠着磨得发亮的布带。「南边来的？」他打量你背上的剑，话不多，「这条道往北，不是你们中原人惯走的。北派的地界，过路要留个说法。」布带一紧，拳风已经压了过来——沉，像拳里裹着一块石头。
  - 你退开半步，认出这一路拳法的底子：刚猛，走的是一个「重」字。这是北派重手一门的外围功夫。你按住剑柄。北地的第一战，在雁门关外的雪地里开了。
