id: stage_12_05_defeat
title: 荒村野店 · 殇
paragraphs:
  - 无名客一掌绵绵推来，软得没有半分锋芒。你只当是虚招，凝神去防他后续的杀着，却不料那软绵绵的一掌底下，一点针劲早已藏好，趁你分神，无声无息穿了进来，直刺心脉。你闷哼一声，剑势散乱，被那一点针劲逼得连退数步，撞翻了店里的桌凳。
  - 「你防的是招，不是实。」无名客立在原地，并不追击，「一路上，你破的都是有名的虚招——名越大，破绽越显，你自然看得穿。可老朽这一招，没有名，没有势，把针藏进绵里，藏进骨头里。有名的虚，你防得住；无名的实，你头一回遇上，就防错了方向。」
  - 你按住心口，那点针劲还在里头隐隐作痛。是了，这一路你太顺了——名门的招都摆在明面上，你只消看穿那层虚，便能破。可眼前这一招，虚实全藏在里头，你还用看破虚名的老法子去看它，自然看不见那枚针。你破惯了「名」，头一回，栽在了「实」上。
  - 你合上眼，把「看招破虚」那套旧法子放下，凝神去感那绵软底下、一线若有若无的针意。再睁眼时，眼前不再是他那绵绵的掌，而是掌心深处那一点最狠的锋。你重新握剑——这一回，你不看他的绵，只看他藏在绵里的那枚针。
