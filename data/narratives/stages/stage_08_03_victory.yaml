id: stage_08_03_victory
title: 沙夜袭影 · 终
paragraphs:
  - 烛影摇红卷到中途，被你一剑截断。灰衣人袖子一空，人已退出火光之外，半跪在沙梁上。这一招他蓄到七分就仓促发了——在阴山，他是从容的；在这里，他不是。
  - 「长进了。」黑暗里，他的声音有些哑，「同一手烛影，阴山那夜你只能硬接，今夜你敢截它的腰。」他慢慢站起来，风帽滑落，火光够不到他的脸，只照见下颌一线，绷得很紧。「可你截得断我的招，截不断我的路。我必须往北。」
  - 你问他北边有什么。他静了片刻。「有一个说法。」他说，「我等了半辈子的说法。」说完他后退一步，身形淡进黑暗里，只留下最后一句话，被夜风送过来——「符带在你身上，是祸不是路。受降城以北，没人会给你让道。」
  - 火堆重新亮起来。沙地上留着他半跪过的浅印，一夜风过，就会平掉。你坐回火边，把剑横在膝上，没有再睡。北边那个「说法」，宗匠的旧事，怀里的符——三条线，都指着同一个地方。
