id: stage_21_02_opening
title: 黄河渡 · 起
paragraphs:
  - 河比记忆里宽。
  - 三月开河，冰刚走，水是浑黄的，卷着上游下来的碎木和草根，声音闷在水面底下，像一整条河在低声说话。渡口的木栈桥朝水里伸出去一截，桥板换过新的，颜色比两边浅。
  - 桥头系着一条渡船。船不大，船底刷了新桐油。一个老人蹲在船舷上，正在用一块麻布擦桨——不是擦脏，是擦木头，一寸一寸，擦得桨柄发亮。
  - 「过河？」他没抬头。
  - 「过河。」
  - 「一个人？」
  - 「一个人。」
  - 老人把桨立起来，靠在肩上，这才回过头。他脸上的纹路很深，是水上人被光反着晒出来的那种深，眼睛却清。
  - 「这渡口我摆了五十一年。」他说，「义渡——不收钱。收的是分量。」
  - 「怎么收？」
  - 「上船之前，我掂一掂。」他伸出一只手，掌心朝上，手指微微屈着，像在等什么落进去，「不是掂银子。这条河脾气大，一船坐几个人、装多少东西，我心里得有数。差一分，河就替我算账。」
  - 你顺着他的手看下去。他掌心的茧不在指根，在虎口和掌沿——是握桨握出来的，一辈子往同一个方向使劲。
  - 「早年这渡口有个规矩。」他说，「往西去的，我送到对岸就回；往东回来的，我要多问一句。」
  - 「问什么？」
  - 「问他把东西留在西边了没有。」老人笑了笑，「人往西走，总要留下点什么，才走得动。留得越多，回来的时候越轻——轻了好，河喜欢轻的。可有的人相反，越走越沉，什么都往身上背，那样的人我不渡。」
  - 「你怎么知道谁沉谁轻？」
  - 「掂。」
  - 他把桨从肩上放下来，双手横握，桨叶贴着水面，水从叶下面滑过去，没有一点声响。
  - 「来吧。」他说，「上船先过秤。」
