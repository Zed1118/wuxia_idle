id: stage_10_05_victory
title: 止水潭 · 胜
paragraphs:
  - 老人只出一手。那一诀没有声音，没有风，像这一潭静水本身漫过来，要把你连同你的剑、你的念头一起抚平。你几乎要陷进那片静里——直到你想起洛水照影碎裂的那一瞬：不接，不等，只管往前。
  - 你没有去化解那一诀的静，也没有去追它的势。你只把剑径直递出去，像迈出没有路的第一步。你的剑不求滴水不漏，只求向前——而向前，正是这守了四十年的止水里，唯一没有的东西。剑锋破开那片静，停在老人咽喉三寸之外。
  - 老人的手停在半空，缓缓落下。潭水被这一剑搅起四十年来头一回的波纹。他看着你的剑尖，极轻地叹了口气，那叹息里没有败意，倒像卸下了什么。「守得住，未必踏得出。」他说，「这一诀，唤作止水，从今日起，也是你的了——你拿它去，别学我，守死在一处。」
  - 你收剑。止水诀的路数留在眼底：起于静，止于静，四十年的分量全压在那不肯向前的一守里。你终于懂了守拙翁，也懂了自己与他的分野——他守，你行。破过这一诀的人，才担得起它，也才不会被它困住。
