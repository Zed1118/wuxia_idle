id: stage_16_04_opening
title: 大漠游骑 · 起
paragraphs:
  - 出孤驿第二天，地平线上起了一线烟尘。烟尘压着风过来，越来越近，近了才看清是马队——十几骑，一色的砂色皮甲，弯刀斜挂鞍侧，不喊，不叫，散成一弯半月，把你围在当中。马速不减，绕着你转，砂被蹄铁卷起来，像一圈慢慢收紧的墙。
  - 领头的一骑忽然从圈里切出来，在你面前三丈处勒住。马打了个响鼻，骑手翻身落地——个子不高，极精悍，一柄快刀背在身后，刀柄上缠着褪了色的红绳。
  - 「中原人。」游骑将开口，砂哑的声音，「凉州地界，巡边的规矩：东边来的，要么回头，要么下马较量。赢了，前面的路随你走；输了——」他朝东边扬了扬下巴，「沙海自会送你回去。」
  - 「黑石滩的话昨夜传过来了。说东边又来了个不取镜的。」他缓缓把刀从背后抽出来，出鞘的声音又轻又快，像撕开一层砂，「霸主等的人，不能是个软的。我替西凉，先称一遍。」他刀尖斜指着地，人已经欺进一步，「接刀吧。」
