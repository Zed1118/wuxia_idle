id: stage_12_04_victory
title: 老铁铺 · 胜
paragraphs:
  - 老铁匠抡起铁锤，那锤在他手里，比任何一柄兵器都沉、都准。他不抢先，只守着自己一方天地，你近身一分，他的锤便封住一分，落点又稳又狠，砸得你剑身嗡嗡作响。你与他缠斗了半炷香，才在他一锤砸空、旧力已尽新力未生的一瞬，抢进去，剑锋抵住了他持锤的手腕。
  - 铁匠松了手，铁锤「哐」地落在砧上。你收剑喘息，胸口发闷——这一场，比先前三场加起来还要吃力。他这一身功夫，没有半分虚的，全是守着这一炉火，几十年一锤一锤养出来的。守成二字，原来这样重：守着一门手艺不让它荒，比闯出一个名头，难得多。
  - 「你赢得辛苦。」老铁匠拾起锤，重新看向炉火，「我这打铁的没什么可教你的。只一样——手艺是守出来的，不是喊出来的。名头喊得再响，炉子冷了，铁就废了。我守着这炉子，图的不是人知道，是它别在我手上断了。」
  - 你收剑，心头忽然掠过守拙翁的影子。那老人也在「守」，守死一潭水，把自己困成了虚；这铁匠也在「守」，守一门手艺，把自己守成了实。同是一个守字，一个守成了困，一个守成了实，差的那一线，你隐约摸到了，却还说不真切。你谢过铁匠，往山坳更深处走——那里，兴许有人能把这一线，替你点透。
