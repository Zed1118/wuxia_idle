id: stage_13_04_opening
title: 断崖瀑布 · 启
paragraphs:
  - 竹林再往上，山忽然断了。一道断崖横在眼前，瀑布从断口上直挂下来，白花花一匹，砸在潭里，声如闷雷。崖边一条窄梁，仅容一人，是过崖唯一的路。窄梁这一头，立着个赤膊的壮汉，抱一杆铁锏，任你瀑布轰鸣，他自岿然不动，像崖上多长出来的一块石头。
  - 「站住。」他开口，声音压过了水声，「断崖之后是登顶的路。这条路，我守了十九年。」他抬起铁锏，往窄梁上一指，「山脚下老把式跟你讲道理，半山寺和尚跟你讲舍得，竹林里那位跟你讲收锋——他们讲的都是『要不要上去』。我这儿不讲。我这儿只问一句：你上不上得去。」
  - 你问他守的是谁的规矩。壮汉咧嘴一笑，露出白牙：「没有规矩。我年轻时也要上绝顶，走到这儿，叫顶上那位一锏打了回来。他说，什么时候我拦得住别人，什么时候再上去。我就守在这儿，一守十九年——拦不住的，我放他过去；拦得住的，回吧，你不配上去。」他一顿铁锏，窄梁上的碎石簌簌地跳，「十九年了，没人过得去。你看着比他们结实点。」
  - 窄梁下水声如雷。这一关没有道理可讲，没有巧可取——守关人就是登顶路上最后一堵墙，墙有多高，全看你手里有多少实打实的功夫。你踏上窄梁，拔剑。
