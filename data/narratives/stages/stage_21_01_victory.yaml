id: stage_21_01_victory
title: 潼关 · 承
paragraphs:
  - 戟杆斜着落地，戟刃入土三寸，立住了。
  - 关河卒松开手，退开一步，朝门洞侧了侧身。门里的风穿出来，是热的——中原三月的风，带着土腥和麦子的气。
  - 「进吧。」
  - 你没有立刻动。
  - 「那句话。」
  - 他点点头，站直了，像在交一件保管了很久的东西。
  - 「我爹说：『若有一日，有个从西边回来的人叩这道门，别问他见着什么了。』」
  - 「为什么不问？」
  - 「他没说为什么。」关河卒挠了挠头，「我琢磨了十几年，琢磨出一点意思——问了，他就得答；答了，那一路就成了一段能讲的故事。可有些路，讲出来就短了。」
  - 他把那叠通关文书重新压回石头底下。
  - 「所以我不问。」他说，「你自己走的，你自己收着。」
  - 你走进门洞。里头果然很深，脚步声在两侧墙上来回撞。走到一半，你回头看了一眼——门框把外面的天切成方方一块，亮得刺眼；那方亮里没有人，关河卒已经坐回石台后面理他的文书去了。
  - 出了瓮城，是中原。
  - 官道两边的田翻过了，土是新的。远处有个村子，炊烟直上去，风很轻，烟不散。
  - 你站住了一会儿。上一次看见这样的烟，是几十年前，也是在这道门里侧。
  - 那时你朝西走。
