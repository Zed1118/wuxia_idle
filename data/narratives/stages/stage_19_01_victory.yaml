id: stage_19_01_victory
title: 东望 · 承
paragraphs:
  - 他退开两步，站住了，那双大手垂下去，慢慢松开。
  - 「明白了。」他说。
  - 你等他说下去。
  - 「当年我掉头，是因为我以为往西走到头，就有个东西在那儿等我。」他望着西边，天边那道丘脊已经淡下去了，「走到城下我忽然怕起来——万一到了头，那儿什么也没有呢？我怕的不是没走到，是走到了，发现是空的。」
  - 「那儿有个人。」你说，「他等了四十年。」
  - 折返客愣了很久。
  - 「那也是空的。」他忽然笑了，笑得比刚才长，「等了四十年的人，等到了，他的四十年就没了。跟什么也没有，差得不多。」
  - 「不一样。」
  - 「哪儿不一样？」
  - 「他不是等着拿一样东西。」你说，「他是把一句话攒了四十年，攒到有人能听懂。听懂了，那四十年就在听懂的人身上了。」
  - 他把这句话在嘴里过了两遍，忽然弯下腰，从砂里抠出那只旧水囊，抖了抖，递过来。
  - 「拿着。这囊我背了三十年，一次也没背出过这道丘。」他直起身，「往东的路还长。到了黑石滩，替我看一眼那面镜子——我当年也路过，没敢看。」
  - 你接过来。囊皮已经硬了，捏上去像块木头。
  - 「你不跟着走一段？」
  - 「不了。」他重新在背风的地方坐下来，「我在这儿坐三十年，坐出一身毛病。可有一样好处——往东回来的人，我头一个见着。这就够了。」
