id: stage_17_01_victory
title: 砂丘初程 · 胜
paragraphs:
  - 最后那一下，你没有去踩他脚下的砂——你踩了他刚离开的那一片。那片砂已经塌完了，塌完的砂，反倒是这道坡上唯一硬的地方。他半个身子沉下去，笑了一声，抬手认了。
  - 「快。」踏沙客从坡里拔出腿，抖了抖裤脚的砂，「我领过的人里，摔一跤就明白的，你是头一个。」
  - 「记住这个：沙上没有稳的地方，只有刚塌完的地方。」他伸手在坡面上划了一道，砂顺着划痕淌下去，淌完，露出下面一层压得瓷实的旧砂，「东西都是这样——正在动的碰不得，动完了的踩得住。你们中原练功也讲这个，只是你们叫它别的名字。」
  - 他替你把靴筒里的砂倒干净，指了指西边：「一路往西，第二程是黑风口。那地方风走窄道，一进去就是一整夜，睁不开眼。你要是走到一半迷了，别硬闯——蹲下来，等。」他顿了顿，「这话我对每个人都说。听的人不多。」
