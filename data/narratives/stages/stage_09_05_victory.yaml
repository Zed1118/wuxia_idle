id: stage_09_05_victory
title: 符尽之处 · 终
paragraphs:
  - 他只出一手。你看不清是掌是指，只觉一片沙尘无声无息卷起，像要把你连人带剑埋进碛里。这一诀沉在他身上四十年，落下来时却轻得没有一点声响——沉默出手，不在快，在你连躲的念头都还没起，它已经到了。
  - 你没有躲，也没有追。阴山教你守自己那一寸，大碛教你风来不追，黑水教你等风的那一线。此刻你把三样合在一处——不接他的沙，不避他的势，只在那一诀旧力已尽、新力未生的一线之间，剑锋递进去，停在他咽喉三寸之外。
  - 老人的手停在半空，缓缓落下。他看着你的剑尖，看了很久，忽然极轻地叹了口气，那叹息里没有败意，倒像卸下了背了四十年的一副担子。「接住了。」他说，「这一诀，唤作沉沙。从今日起，也是你的了。」
  - 你收剑。那一片无声的沙尘落回地上，露出井台。你这才觉出，后背早已被冷汗浸透。沉沙一诀的路数还留在眼底——起于沉默，止于一击，四十年的分量，全压在那不肯出的第二手里。破过它的人，才担得起它。
