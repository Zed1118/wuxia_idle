id: stage_19_05_victory
title: 黑石重照 · 合
paragraphs:
  - 鞭子落在砂里，没有再收回去。
  - 守镜人站着没动，胸口起伏得很厉害，兜帽早掉在脑后。你这才看清他的脸——比你想的年轻，又比你想的老：没有多少皱纹，可那双眼睛里的东西，是几十年一个人待着才有的。
  - 「这一手叫一镜双照。」他说，「使的时候，不是打你，是照你。你怎么打过来，它就怎么打回去。所以守东西的人用得着——你不来，它就不动。」
  - 「你打了。」
  - 「我照了。」他笑了一下，「照出来的是一个从最西边走回来的人。够了。」
  - 他退开三步，让出那块黑石。
  - 「取吧。」
  - 你走过去。黑石上那半面镜就在那儿，镜面朝天，星子在里头一动不动。你把霸主那半面从怀里取出来，两只手各托一半，慢慢合上去。
  - 没有声音。
  - 严丝合缝。合上以后连一道缝都看不出来，倒像它本来就是整的。
  - 你举起来。镜里是你的脸，风砂刻过，比出关那年老。你把它转向西——镜里是戈壁、黑石、一路过来的砂；再转向东——还是戈壁、黑石、一路的砂。
  - 「一样的。」你说。
  - 「一样的。」守镜人在你身后说，「所以它照的不是地方，是人。你从东边来的时候照，跟从西边回来照，镜子没变，脸没变，可你自己知道，那是两张脸。」
  - 你把镜子收进怀里。这一回它不硌了——两半合上以后，边缘是圆的。
  - 「你以后做什么？」
  - 守镜人在黑石上坐下来，两只手撑在膝上，像是终于可以歇一歇。
  - 「不知道。」他说，「几十年了，头一次不知道明天做什么。听着挺吓人的，其实还行。」
  - 他往东边扬了扬下巴。天边有一线灰白，快亮了。
  - 「往东出去，一日到阳关。」他说，「四十年前有个背剑的从那道门出来，一路向西；后来你也从那道门出来。你是头一个要从那道门回去的。」
  - 「关那头是中原。」
  - 「中原那头还有嵩山，还有昆仑。」他说，「你来的时候一程一程往西数，数到头了。往回数，数的就不是地方了。」
  - 你站在滩心，回头看了一眼西边。丘脊沉在夜色里，看不见了。
  - 「他说，人间的路走到头，剩下的那一段不在东西南北里。」
  - 守镜人没答。过了很久，他说：「那你就走给他看。」
