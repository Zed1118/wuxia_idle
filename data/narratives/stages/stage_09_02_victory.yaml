id: stage_09_02_victory
title: 瀚海无路 · 承
paragraphs:
  - 最后一条人影栽进沙里，柳叶刀翻着光落在一旁。风一卷，沙面重新抹平，像什么都不曾发生。这片瀚海就是这样，连尸首都留不住。
  - 你拄剑喘了口气。四下无声，唯有风。你忽然明白那伙人为何蒙面——不是怕被认出，是这地方的沙，钻进眼、钻进口、钻进每一道衣缝，不蒙着，走不了路。
  - 铜符透出的烫，比昨日又深了一层。你顺着那点烫辨向，深一脚浅一脚地往北。日头偏西时，前头的天地线上，忽然浮起一座城的影子——飞檐，垛口，城门大开，隐约还有人在门口朝你招手。
  - 你的脚顿住了。灰衣人的话浮上来：前头哪怕真有城有水，那也未必是路。你摸了摸符——它朝北那一角仍烫，可那座城，却斜在东边。你盯着那座城看了很久，没有往东挪一步。
