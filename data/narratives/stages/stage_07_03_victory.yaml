id: stage_07_03_victory
title: 山道伏影 · 捷
paragraphs:
  - 游哨的短刀被你磕飞，落进松针堆里，只露出半截刀柄。那人退到树后，抱了抱拳。
  - 「掌门好剑。」游哨的声音很年轻，「我们奉命探路，不是来拦你死路的。宗匠在山门等你，是要亲眼看一看——南边这一脉，是不是真立得住。」他顿了顿，压低了声，「方才那个灰衣人……他在这条道上走了三日，不进山门，也不走。你若见着他，别先出手。他要的东西，不在你身上。」
  - 你收剑入鞘。松林里那个灰色的影子，还在你眼底晃。你不晓得他要什么，可你晓得自己要什么——过阴山，见宗匠，把北派上门讨的这口气，自己接下来。师父的路在昆仑就走到了头。你的路，正从这片松林里，一寸一寸往北铺开。
