id: stage_10_05_opening
title: 止水潭 · 启
paragraphs:
  - 过了嵩阳关，往山里再走，人烟越来越稀，最后只剩一条被荒草埋了半截的小径。小径尽头是一潭水，深藏在山坳里，四面无风，水面静得像一块没有一丝裂纹的墨玉。潭边一块青石上坐着个老人，须发皆白，闭着眼，手边搁着一根钓竿，钓线垂在水里，却没有钩。
  - 「来了。」老人没有睁眼，「嵩阳那老儿放过的人，总会到我这儿。」他声音很轻，像怕惊动了这一潭静水，「他让你问我，守了一辈子守出了什么。」老人终于睁眼，那目光平静得没有一丝波澜，「我守出了这一潭不起波澜的水。你看它好不好？」
  - 你说水是好水，只是太静了。老人笑了笑：「静，才守得住。这潭水四十年不曾外流一滴，也不曾让外头的浊气进来一分。我这一诀，唤作止水——来什么，化什么；起什么念，平什么念。守到极处，便是这般滴水不漏。」他缓缓起身，动作慢得像不会武功，「你想过去？过去，就得先搅乱我这潭守了四十年的水。」
  - 你握住剑。潭边真的没有风，静得能听见自己的心跳。你忽然想起师父那句遗言——剑到了一处地方，就要听那处地方的风。可这里没有风。你屏住呼吸，迎向那个从青石上缓缓站起的老人。
