id: stage_10_05_defeat
title: 止水潭 · 殇
paragraphs:
  - 老人只出一手。你想向前，那片静却先一步漫过来，将你的剑势、你的脚步、连你要迈出去的那个念头，一并抚平。你僵在原地，剑递不出去，退不回来，最后被那无声的一诀卸了力，踉跄着跪坐在潭边。
  - 「你急着向前。」老人重新坐回青石，声音平得像脚下的潭水，「向前是对的，可你向前得太用力，力一散，就被我这潭静吞了。」他重新阖上眼，「向前不是把自己豁出去，是像水一样，认得清什么时候该动，什么时候该沉。你还差这一层。」
  - 你撑着剑起身，胸口那口气堵得发慌。潭水已经重新平静，映着你狼狈的倒影。你想起嵩阳关主的话——想清楚你要过关，是为了向前，还是只为了不甘心停下。此刻你才分得清：方才那一剑，多半掺了不甘。
  - 你合上眼，把这一路的一切沉下去，沉到潭底，直到心跳也慢下来。再睁眼时，那口不甘的气散了，只剩下向前的那一点定。你重新握剑，面向青石上那个守了四十年、从未真正出手的老人。
