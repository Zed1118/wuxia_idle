id: stage_17_03_opening
title: 沙埋古城 · 起
paragraphs:
  - 先看见的是一截墙头。
  - 半人高，土坯的，从砂里斜斜地探出来，砖缝里还嵌着当年抹的草筋。你顺着墙头往前走，走了百来步，才反应过来这不是一段残墙——这是整座城的城墙，只是城墙其余的部分都在砂底下。你走的这一路，脚下都是城。
  - 再往里，露出来的东西多了些：一根旗杆的顶，一段拱门的弧，一口井的沿。都只露一点点，像水面上浮着的东西。砂把这座城整个吞了下去，吞得不急，一年埋一寸，几百年埋完，连一声响都没有。
  - 城中心有个坑，是砂自己塌出来的，露出下面半座衙门的檐角。檐下坐着一个老人。
  - 他穿着一身早就看不出颜色的号衣，膝上横着一柄卷了刃的长刀，正在用一块破布擦。听见脚步，他抬起头，眼睛甚浑，却盯得极准。
  - 「站住。」他说，「这是城里。」
  - 你环顾四周——砂，砂，还是砂，除了脚下这半座檐角，看不出半点城的样子。
  - 「你看不见，是你眼拙。」老卒把长刀擦完，横回膝上，「城墙在你左手三丈，城门在你身后十七步。我在这儿守了四十年，闭着眼也走得出街。」他的手在膝上按了按刀，「城没了人，没了屋，没了名字，可它还是城。守城的人不走，它就还是城。」
  - 「你要过去，从城门走。」他站起来，动作极慢，慢得像怕惊了什么，「不是我拦你——是规矩。城还在，规矩就还在。你从墙上跨过去，我这四十年就白守了。」他把刀立起来，刀尖朝下点在砂里，「过城门要验。验完了，我给你开。」
