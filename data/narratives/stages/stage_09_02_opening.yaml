id: stage_09_02_opening
title: 瀚海无路 · 启
paragraphs:
  - 再往北两日，碛石化作了沙。一望无际的沙，风一过，沙面像水一样起伏，脚印落下去，转眼被填平。这地方唤作瀚海，走进来的人都知道它名不副实——没有一滴水，只有白骨。沙脊上时不时露出半截枯骨，被风蚀得发亮，认不出是人是马。
  - 铜符烫得更紧了。你正辨着方向，沙脊后忽然立起几条人影——一色的窄袖短打，蒙着面，脚下踩着沙却不陷，轻得像贴着风走。为首一个抽出两柄柳叶刀，刀身薄得近乎透光。「揣符的。」他的声音闷在面巾里，「这片沙是我们的道。留下水，留下符，指你一条活路。」
  - 你说这瀚海无路，何来活路。蒙面人笑了，笑声散在风里。「路是我们踩的。这沙底下埋着多少揣符来的、寻宝来的、迷了道的——」他刀尖朝脚下一点，「你想不想跟他们做伴，就看你这柄剑够不够快。」
  - 几条人影散开，踩着沙脊绕你游走，忽远忽近，像一群嗅到腥的沙狐。你把符贴紧胸口。沙上留不住脚印，也留不住退路。你侧身，剑锋斜指，盯住那几点飘忽的影。
