id: stage_12_01_opening
title: 寒江渡 · 启
paragraphs:
  - 出了中州名门的地界，往深处走，人烟渐稀。一条大江横在前头，江面上薄雾未散，只一条旧木船泊在滩边。撑船的是个佝偻老翁，一身粗布，脸上沟壑纵横，正拄着长篙打盹。渡口冷清，连块招牌也没有，与你先前见惯的排场，隔着两个世道。
  - 你要过江，老翁也不多问，撑篙离岸。江心水急，你却觉出些异样——那长篙点在水里，看着随意，落点却分毫不乱：水急处点得深，水缓处点得浅，一篙下去，船身稳得几乎不晃。这撑篙的手法，你在中州那些名家身上，一次也没见过。
  - 你随口问他江湖上的名号，老翁只顾撑船，半晌才应一句：「撑了四十年篙，哪来什么名号。」你心头一动，反手在船舷上叩了一记，暗运内力荡开一圈水波。老翁眉头微皱，长篙横过来一压，那圈水波便无声散了——他不是不会，是懒得会。
  - 你收回手，心里那点连日来的空落，忽然动了一下。名门堆里寻不着的真章，倒在这无名渡口的一个撑篙老翁手上，露了半分。你没有说破，只握住了剑柄。这平常人手底下的东西是虚是实，你要亲手接一接，才作数。
