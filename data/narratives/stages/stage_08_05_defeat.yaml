id: stage_08_05_defeat
title: 残照回风 · 殇
paragraphs:
  - 那一卷袖风折返的刹那，你的剑追了上去——追进了空处。回风未尽，第二卷已至，你的手腕一麻，剑脱手飞出，插在三步外的沙里，嗡嗡地颤。
  - 灰衣人收袖，站在原地没有动。「还是在追。」他的声音听不出得意，反而有些倦，「沙夜里我说过一回，今夜你还是这个毛病。这一手回风，起势是退，你眼里只有我退，就看不见劲往回走。追它的人，永远慢半拍。」
  - 他走过去，把你的剑从沙里拔出来，剑柄朝你递还。「回南边去，或者，想明白了再来。」他重新坐回山墙根下，残照照着他半边身子，「我等得起。这座门我回不去，横竖是要守在这儿的。」
  - 你握着剑退开几步，坐在一根断柱上。师父那句遗言又翻上来——听那处地方的风。碛北黄昏，风住了，四下里静得能听见自己的心跳。你忽然觉着，要听的或许不是风声，是风住的那一刻。你起身，再一次面向山墙。
