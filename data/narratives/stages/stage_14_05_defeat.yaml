id: stage_14_05_defeat
title: 绝顶峰台 · 败
paragraphs:
  - 第十荡没到，你先被荡势掀下了中线。人在半空，只觉整座峰台都在随着那道势头推进，退无可退。宗师收势立定，没有追击，只望着你，目光平静：「一往无前的杀法，破法不在躲——你越退，它越盛。」
  - 你撑起身，胸口气血翻涌。他没有下山的意思，反而在峰台边的青石上坐了下来，望着关外的方向：「我等了一年半才走到这儿，不急这一天。你回去想一想——想通了，再来。十荡十决在这里，这座绝顶也在这里。」云起云落，他把「借山一战」四个字，说得像一场非赴不可的约。
  - 你退下峰台时，回头看了一眼。老人仍坐在青石上，背影融进暮色，像一尊守在关外的旧石像。一万里路他走了一年半，一句「不急这一天」说得云淡风轻——这样的人，这样的杀法，值得你回去把这一败嚼碎了咽下去。山下马队的篝火次第亮起来，你望着那片火光，把今日荡势的每一瞬，重新在心里过了一遍。
