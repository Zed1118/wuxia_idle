id: stage_21_02_victory
title: 黄河渡 · 承
paragraphs:
  - 桨落回水里，稳住了。
  - 老人喘了一口，把桨叶从水中提起来，甩了甩，水珠连成一条线落回河面。
  - 「够轻。」他说，「上船。」
  - 船离了岸。他站在船尾摇桨，动作很小，几乎看不出使力，船却顺着水斜斜地朝对岸走。河心的水比岸边急，船身晃了一下，他把桨往下压半寸，晃就止住了。
  - 「你留在西边的东西不少。」他忽然说。
  - 「你掂得出来？」
  - 「掂得出空。」他说，「人身上有几处地方，本来该有东西的。你那几处是空的，空得干净——不是被人抢的，是自己搁下的。搁下的和被夺的不一样：被夺的地方是个口子，会漏；自己搁下的地方是个坑，坑里会长新的。」
  - 河面上起了一阵风，把浑黄的水推出一层细鳞。远处水鸟贴着水飞，翅膀没沾湿。
  - 「那我该长出什么了？」
  - 老人没答。船到了对岸，船底轻轻蹭上滩，他跳下去，把缆绳往木桩上绕了两圈。
  - 「我摆了五十一年渡。」他一边绕一边说，「渡过去的人，十个里有九个我记不住脸。记得住的那一个，往往是回来的时候变了个人——去的时候东张西望，回来的时候只看脚下。」
  - 他直起腰，指了指东边。
  - 「你现在就只看脚下。这不是长出来的，这是磨出来的。」
  - 你上了岸，回头看那条河。水还是浑的，一刻不停地往东流。
  - 「老丈。」你说，「往东是嵩山？」
  - 「往东是嵩山。」他重新蹲回船舷上，拿起那块麻布，「再往东，官道就到头了。」
  - 「到头之后呢？」
  - 「到头之后没有道了。」他低下头擦桨，「只有山。」
