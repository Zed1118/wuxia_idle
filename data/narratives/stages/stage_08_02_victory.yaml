id: stage_08_02_victory
title: 瀚海孤烟 · 终
paragraphs:
  - 分水刺插在沙里。当先那人被你一剑挑落沙巾，仰面坐在沙梁上，那双眼里的悍气散了，只剩惊。两侧的人影收住脚，没人再绕。
  - 你收剑，弯腰去捡水囊。俯身时，怀里的铜符滑出半截。当先那人看见符，忽然从沙上弹起来，又硬生生站住，声音都变了。「这符——客官从哪儿得的？」你说是阴山北派的宗匠所赠。他盯着符看了半晌，朝你抱了抱拳。「大碛里头，刀子好使，这纹路比刀子还好使。祖上传过话：见着这门纹，让路。」
  - 你问灰衣人。他点头。「昨日黄昏过的烽燧，没讨水，人像是熬干了。往北去了——北边只有一座受降城，再北，就是没人回来过的地方。」他顿了顿，压低声音，「客官，那人身上没有符。没有符往碛里走，是去送命的。」
  - 烽燧的孤烟还直直地升着。你灌满水囊，辨了辨方向。受降城在北，灰衣人在北，那个「没人回来过的地方」也在北。你踩着沙脊出发，身后的沙盗们立在原地，望着你，谁也没动。
