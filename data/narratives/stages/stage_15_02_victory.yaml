id: stage_15_02_victory
title: 黄河渡 · 胜
paragraphs:
  - 剑光在月下一收。夜客定在原地，剑尖垂向栈桥，许久，缓缓归鞘。他俯身望着水面碎银，忽然笑了：「暗流碰上深水，才知道自己浅。几十年的悔，今夜补上了——不冤。」他退开一步，郑重抱拳，「掌门的剑，配得上走最远的路。」
  - 渡船靠岸，船夫吆喝上客。夜客把你送上船，立在栈桥上没有动。船离岸的时候，他忽然扬声道：「掌门此去，替在下带一句话给西边——中原的剑，不是只有当年那一柄！」
  - 船行河心，水声浩大。你回望东岸，渡口的灯笼缩成一点暖黄，再往远处，是中原沉沉的夜色。从这条河起，身后的一切都是「来路」了。
  - 对岸的风带着土腥气，比中原的风粗粝。你立在船头没有坐下——出了中原，这条路才算真正开始。
