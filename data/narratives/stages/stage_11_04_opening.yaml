id: stage_11_04_opening
title: 玉京阁 · 启
paragraphs:
  - 循着中州名门的声势往里走，你来到一座唤作玉京阁的所在。楼阁飞檐鎏金，庭中植着名贵的花木，处处透着不惜工本的讲究。阁中正设着一场比剑的雅集，四下坐满了中州各家的名流，人人锦衣，个个执杯，等着看阁主一展成名的绝学。
  - 玉京阁的阁主，人称玉京剑主，是中州近年最负盛名的一位。他缓步出场，长剑一引，那套成名的剑法便使将开来——招式繁丽，剑光如金鳞铺展，一招一式都极尽好看，满座名流轰然喝彩，酒杯都为之一顿。
  - 那剑光扫到你面前，玉京剑主微微一笑，笑意里满是自负：「北边来的野客，也配站在玉京阁里？我这套『流金剑法』，中州上下无人不知。今日让你死也死个明白，见识见识什么才叫名门绝学。」他剑势一凝，金光大盛，威势逼人。
  - 满座的喝彩几乎要把你的心神也卷进那片金光里去。你握紧了剑，压下那点被华丽晃花了眼的心浮——招式再好看，终究是要伤人的；这一庭金光底下，究竟有没有真正的杀招，得你亲手去接了才知道。
