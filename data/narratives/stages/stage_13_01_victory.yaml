id: stage_13_01_victory
title: 山脚茶棚 · 胜
paragraphs:
  - 烧火棍使得又沉又稳，一招一式都是四十年前的老底子，刚猛里透着股不肯服输的劲。你不硬接，只顺着棍势走了十几招，待他一趟棍法使老，才轻轻一剑压住棍梢。老把式挣了两下，挣不动，忽然笑了，撒手把棍子一丢：「好。四十年了，我这根棍子，今天才算打得值。」
  - 他重新蹲下烧火，往你碗里续了茶，话却比先前实在了许多：「往上去，半山有座寺，寺里的人不劝你上山，倒劝你留下。再往上是竹林，林子里的人不爱露锋。过了竹林是断崖，断崖上有人拦路——那一关最难过。至于顶上……」他望着云里的山峰，摇了摇头，「顶上有什么，我说不清。当年那位老爷子下来的时候，只说了一句话。」
  - 「他说什么？」你问。老把式把铜壶从火上提下来，慢慢道：「他说，山上不冷，就是等人等得久了些。」他抬眼看你，「我当时不懂。今天看你这一剑，我有点懂了——他是在等一个走得上去的人。你去吧，替我瞧瞧，他还在不在。」
  - 你饮尽碗中茶，把茶钱压在碗底。老把式也不推辞，只把烧火棍横在膝上，望着你上山的背影，像望着四十年前那个没敢再往上走的自己。茶棚的炊烟在你身后细细地升起来，山脚的第一关，留在了烟火气里。
