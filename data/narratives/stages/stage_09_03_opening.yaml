id: stage_09_03_opening
title: 蜃楼幻影 · 启
paragraphs:
  - 那座城不散。你越往北走，它越清晰——始终斜在东边，像一直等着你偏过去。城门口那个招手的人影，渐渐显出一件灰袍，垂着袖口，站姿你熟得不能再熟。
  - 「是我。」风里飘来一个声音，是灰衣人的声音，「废寺我守腻了，追上来陪你走一程。往东，城里有水，有阴凉，歇一晚再赶路。」那灰袍身影朝你招手，一步步往城门里退，退得你心头发慌——像怕他就此不见。你几乎要迈步过去。
  - 脚抬起来，又落回原处。灰衣人分明留在了大碛的废寺，守他回不去的门，怎会在这儿。你想起他碎在残照里的那句话——回风专等追的人，追它的人，永远慢半拍。这座城，这个身影，都在等你追。
  - 你转回头，正对着符所指的北方。东边那座城顿时扭曲起来，飞檐塌了，人影散了，露出底下的真容——一团裹着沙的阴影，本没有形状，是你眼里的念想给了它形状。它见你不追，反倒朝你扑来。你握紧剑，不退，也不追，只守住脚下这一寸。
