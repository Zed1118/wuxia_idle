id: stage_10_01_opening
title: 河套渡口 · 启
paragraphs:
  - 黄河到了河套，绕出一个大弯，水面宽得望不见对岸。渡口的艄公说，过了这条河，就算进了中原的地界。你在渡口等船，把铜符搁在膝上——它不再烫了，朝哪个方向都一样凉。头一回，你得自己拿主意，往哪儿走。
  - 渡口的木栈桥上横着个人，一身劲装，腰间挂剑，正拦下你前头那个背包袱的行商收「过渡钱」。行商赔着笑塞了银子，他才让开。轮到你，他上下打量，目光在你风尘仆仆的旧衣和背上的剑之间来回：「面生。北边来的？这渡口的规矩，剑客过河，要么留钱，要么留一手让我瞧瞧。」
  - 你说你只是过河。他嗤地笑了，拔剑出鞘三寸：「河套这一段水，是我盯着的。北边来的野路子，我见得多——一个个都说只是过河，过完河就在中州搅事。想过，先接我一剑，让我看看你够不够格。」
  - 你没有多话。这是入中原的头一道坎，拦着的不是符，是活生生的江湖规矩。你握住剑柄。河风比碛北的横风柔和，却也黏，吹在脸上有水汽的重量。
