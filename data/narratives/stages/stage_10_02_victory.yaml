id: stage_10_02_victory
title: 雁门道 · 胜
paragraphs:
  - 他的快，快在飘忽不定；你的剑，慢，却慢得每一下都落在他非停不可的那一点上。几个照面下来，他的飞蝗石打空了，身法乱了，最后一记扑击被你剑脊格开，整个人踉跄着撞回崖壁。
  - 「你……看得见我落脚。」他喘着气，脸上头一回没了轻佻，「北边来的，眼睛毒。」他抹了把汗，忽然咧嘴，「行，算你过。这道我不拦你了。」他往山下努努嘴，「往前是洛阳地界，水更浑。你这号人，早晚要跟中州那几家门户碰上——碰上了，别说是雁门道放你过的。」
  - 你收剑往前走。这中州的江湖，一道关一个样：河套讲门户的规矩，雁门讲拳头的规矩，再往前，不知又是什么规矩。边塞的路是一条直线，往北就是往北；中原的路却像脚下这盘山径，绕来绕去，每一段都得自己认。
  - 你摸了摸怀里的铜符，凉的。它认不了这样的路。可你发觉，没有符，你反倒把每一步都走得更清醒了些。
