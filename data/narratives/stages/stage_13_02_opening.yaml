id: stage_13_02_opening
title: 半山寺 · 启
paragraphs:
  - 半山腰间一座小寺，没有匾额，山门前一株老松，松下一方石坪。一个知客僧正在扫落叶，竹帚划过青石板，沙沙地响。廊下另有二十四名僧客，各持棍棒、石子与护院兵器。见你从山脚上来，知客僧直起身合十，脸上没有半分意外：「施主从茶棚来？老把式的棍子，可还使得动？」
  - 你答使完了。知客僧笑笑，侧身让你看寺里的景致——此处半山，云在脚下，田在眼底，风从山下吹上来，带着烟火气。「施主你看，半山也很好。」他指着远处的村落，「看得见人间，听得见鸡鸣，夜里还有灯。多少人走到这儿就不走了，不是走不动，是舍不得。小寺收留的，全是这样的人。」
  - 「那为什么不往上走？」你问。知客僧不答，反问：「施主为什么要往上走？名，你在中州挣过了；实，听说荒村里你也寻着了。山顶风大，什么都没有，只剩个『高』字。为一个高字，丢了半山的暖和，值吗？」他提起竹帚，往石坪上一顿，「答得上来，小僧让你过。答不上来——就用拳脚答。上山的路从小寺后头过，要过去，先受众人分批考校，最后再过小僧这一关。」
  - 你望着扫帚下干净的石坪，也望着石坪四周层层列开的考校者，忽然明白这半山寺是什么地方——它是上山路上第一个「留」字。知足不是错，可你的答案不在半山。你拔剑，替自己答。
