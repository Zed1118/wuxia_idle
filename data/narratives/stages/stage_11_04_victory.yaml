id: stage_11_04_victory
title: 玉京阁 · 胜
paragraphs:
  - 你硬接了那片金光。剑锋相触的一瞬，你便探明了——「流金剑法」华丽是真华丽，招式铺开如金鳞漫天，看得人眼花；可这一身的功夫，尽花在了那层好看的皮面上，力道到了紧要处，便虚了一分。你避开那些唬人的虚势，一剑刺向他真正的空当，剑尖抵住他的胸口。
  - 满座的喝彩戛然而止。玉京剑主执剑的手僵在半空，脸上的自负一寸寸裂开。「我这套剑法……名动中州……」他喃喃着，像是不敢信。你收剑退开：「名动中州的，是它好看。可你把功夫全练在了好看上，练给这满座的人看，没练一分给真敌手。招式再繁丽，练不进骨头，便是一副空架子。」
  - 阁中的名流们哑了声，你看得出他们眼里的错愕——原来这位人人追捧的玉京剑主，绝学竟是中看不中用。这一层虚，比排场、门第、银钱都更难看穿，因为它裹着一层实打实的好看，唬得连使剑的人自己，都信了那是真本事。
  - 你转身走出玉京阁。这中州名门层层深入，每一层的名头都比前一层更响，虚也藏得更深。玉京剑主之上，还有一位名震整个中州的老名宿——你隐约觉着，那最响的一层名头背后，藏着的会是这一路最重的一个「虚」字。
