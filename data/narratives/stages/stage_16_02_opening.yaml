id: stage_16_02_opening
title: 黑石戈壁 · 起
paragraphs:
  - 过了界石，天就黑了。戈壁上的黑石滩在夜里更黑——大大小小的黑石半埋在砂里，绵延十几里，风从石缝里穿过去，呜呜地响，像有人在很远的地方吹埙。入冬的第一场夜风，冷得干脆。
  - 你举着火把走到滩心，火光忽然照见一样不该出现在这里的东西：一块半人高的黑石上，端端正正搁着一面小铜镜。巴掌大，镜背的缠枝花纹被风砂磨浅了，镜面却干干净净，朝着天，映着满天星子。几十年的风砂过去，它就这么搁着，像是昨天才放上去的。
  - 「站住。」石后转出一个人，裹着一身砂色斗篷，兜帽压得很低，声音听不出年纪，「镜前三步，是我的地方。」
  - 「霸主当年留镜在此，说，东边会有人来取。」守镜人缓缓拨开斗篷前襟，腰间一条软鞭垂下来，鞭梢贴着砂面，像一条醒着的蛇，「我在这滩上守了几十年。来过一个——看了一夜，没取，走了。你是第二个。」兜帽底下的目光落在你脸上，静了片刻，「取不取，是你与霸主的事。过不过得了镜前这三步，是你与我的事。」
