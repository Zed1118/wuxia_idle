id: stage_20_05_victory
title: 孤城开 · 承
paragraphs:
  - 刀归鞘。
  - 守关老将站了片刻，像在听什么。然后他转过身，走到门下，双手搬闩。闩木挪动的那一声闷响，像从城墙根的土里传出来的。
  - 门开了一线，再开。门洞里灌出来的风是暖的，带着黄土和灯火的气——中原的风。你出关那年，这风在你背后；如今它迎着你的脸。
  - 「过来。」他把册子摊在门槛的石台上，就着最后一线天光，取笔，蘸墨。
  - 「山上来的留符人。」他找到那一行，手腕一沉，一笔划过。墨很饱，线划得很直。
  - 「还有一行。」你说。
  - 他停住了。
  - 「背剑的少年。」你说，「我从他走过的路上回来。西边有一面镜子，在黑石上朝天搁了几十年，干干净净；西凉深处有一个人，等了四十年，等到了，把半面镜亲手交给东边来的人，说——所以现在给你。」
  - 你把怀里那面镜取出来，搁在册子边上。合上的镜是圆的，镜面朝天，映着天边最后一线光。
  - 「他没有回来。」老将说。
  - 「他把话走完了。」你说，「话回来了，东西回来了，路回来了。人回不回来，账上那一行怎么算，你说了算。」
  - 老将看着那面镜，看了很久。城头的风把他的白须吹起来，又放下。
  - 很久之后，他提笔，在「背剑的少年」那一行上，轻轻划了一道——划到一半，笔锋停住，提起来了。
  - 「留半行。」他把笔搁下，「销了，像他没来过。不销，像老夫还在等。留半行——他来过，他不回来了，老夫不等了。这三件事，一道线画不全，半道刚好。」
  - 你看着那半道墨线，忽然想起怀里这面镜——也是两个半面，合成的一个圆。
  - 「进去吧。」他把册子合上，让开门洞，「日落之前，这门为你多开一个时辰。老夫守了几十年的规矩，今日破一回。」
  - 「破例不怕账上又多一笔？」
  - 「怕。」他说，「所以这一笔，老夫记在自己头上。」
