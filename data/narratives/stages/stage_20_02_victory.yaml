id: stage_20_02_victory
title: 望关 · 承
paragraphs:
  - 守烽人收了手，退开两步，先看天，再看柴堆，最后看你。
  - 「不用点。」他说。
  - 他在柴墙边上坐下来，拍了拍身边的位置。你没坐，他也不勉强。
  - 「西边如今是什么样子？」他问，「老将军几十年前托出关的人看一眼。你看了，先说给我听听——我这墩子，替关望了三十年西边，望见的只有砂。」
  - 「西边没有要打过来的东西。」你说，「西边只有等着的人。守镜的，守城的，守话的。一个等了几十年，一个等了四十年。」
  - 「等着的人。」守烽人低声把这几个字过了一遍，「那跟我一样。」
  - 「不一样。他们等的是人。你等的是坏消息。」
  - 「都一样。」他说，「等什么，什么就是你的日子。我等了三十年坏消息，坏消息就是我的日子——它一天不来，我这日子就一天是好的。这么算，我这三十年，全是好日子。」
  - 他说完自己笑了，笑声不大，风一吹就散。
  - 「有一件事托你。」他忽然指向关城的方向，「城头那根旗杆，我在这儿望了三十年，只望得见杆，望不见旗。你走近了，替我看一眼——旗是什么颜色。」
  - 「三十年，你没走近看过？」
  - 「烽子离墩三里，斩。」他说得很平常，「规矩是死的，我也懒得叫它活。你看了，不用回来告诉我——你过关的时候朝这边挥挥手，红的挥一下，别的颜色挥两下。我看得见。我什么都看得见。」
