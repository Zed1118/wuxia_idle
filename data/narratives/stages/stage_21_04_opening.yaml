id: stage_21_04_opening
title: 樵径 · 起
paragraphs:
  - 官道到头了。
  - 尽头没有牌子，也没有岔口，路面就那么一点一点变窄、变软，最后被草接了过去。你记得这地方：几十年前你也是走到这里，站住，往上看，看见一条被草埋了半截的樵径钻进林子里。
  - 草不见了。
  - 径还是那条径，可草被踩秃了，露出下面的土和石头。土是踩实的，石头被磨得发亮。径两侧的枝子朝外让开，让出一条一人宽的空当——那是常年有人走才走得出来的样子。
  - 径口横着一根扁担。
  - 扁担底下坐着一个老仆，灰布短褐，脚上一双草鞋，鞋底磨穿了一个洞。他背靠着石头，闭着眼，膝上摊着一件正在补的旧衣，针停在半路。
  - 你脚一落地，他就睁了眼。
  - 「上山？」
  - 「上山。」
  - 老仆把针别在衣襟上，慢慢站起来。他个子不高，一站直，肩膀却宽得出奇。
  - 「多久了？」他问的不是你，像是问自己，「今年第九个。」
  - 「你在这儿拦人？」
  - 「拦。」他说，「不拦不行。这条径原本是死的——我在这儿坐了四十年，头三十年，一个人也没有。第三十一年上来一个，从那以后就没断过。」
  - 他把那根扁担从地上抄起来，横在身前。扁担是硬木的，两头包了铁，被手汗浸成了深褐。
  - 「上头那位交代过：路可以活，不能滥。」老仆说，「谁都能上去，那上头那点东西就不值钱了。所以我在这儿坐着——不认脸，不问名，只掂一掂。掂得住的，我让；掂不住的，我劝他明年再来。」
  - 「四十年前你就在这儿了？」
  - 「在。」
  - 「那时候我从这儿上去过。」
  - 老仆看了你很久。他的眼睛不好，眯着，把你从上到下看了两遍。
  - 「那时候我没拦你。」他终于说，「那时候我还是个扫径的，没人交代我拦。你上去了，过了些日子下来，把上头那位的东西带走了——我远远看着，没敢问。」
  - 他把扁担又抬高了半寸。
  - 「今日我拦你。」他说，「不是不认得你。是因为今年上去了八个，有三个是空着手回来的，一个到现在没下来。上头那位换了人之后，规矩松了——我不能让它一直松下去。」
  - 「你怎么知道换了人？」
  - 「他们下来的说法变了。」老仆说，「从前下来的人说『那位不还手』；这些年下来的说『那位不在』。」
  - 林子里很静。径往上拐了个弯，看不见头。
  - 「上头空了多少年了？」你问。
  - 「不知道。」他把扁担握实了，「所以更要拦。空着的地方，得留给填得满的人。」
