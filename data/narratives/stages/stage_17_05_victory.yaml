id: stage_17_05_victory
title: 西凉腹地门前 · 胜
paragraphs:
  - 你砍在他身上的每一剑都像砍进一堵沙墙——力气进去了，没有回声。绳子在他手里绕成一圈又一圈的风，把你所有的快都磨钝了。打到日头压到丘脊上，你已经不再急着出手。
  - 你在等。
  - 等他把绳子抡起来的那一刻。那是他唯一使劲的时候——铜环被甩到最高处、绳身绷成一条直线、他整个人的重心随着绳走的那一线。那一线极短，短到只有半个呼吸。可它每次都来，来之前必有一声极轻的绳鸣。
  - 第七声绳鸣响起时，你没有去接那个铜环，也没有退。你顺着绳子被甩起来的方向，跟着它一起走——就像雁跟着风走。半个呼吸之后，绳还在最高处，人已经到了绳底下。
  - 剑尖抵住了他的咽喉。
  - 领路人保持着那个把绳子抡到最高处的姿势，久久没有动。然后他松开手，铜环落在砂上，闷闷地响了一声。
  - 「平沙落雁。」他说。
  - 「什么？」
  - 「你刚才那一下。」他把落在地上的绳子拾起来，慢慢缠回小臂，「琴上有支曲子叫这个名字。写的是雁过沙洲——万里平沙，一群雁从高处斜着落下来，落得又稳又轻。你知道雁为什么能落在沙上，人不能？」
  - 他自己答了：「因为雁不跟风争。它挑风将歇的那一线下来。」
  - 他解下腰间一个磨得发白的布袋，从里头取出一卷帛：「这一路我领过十七个人。走到这儿的有六个，看懂那一线的，你是第一个。这支曲子该给你。」
  - 你双手接过。帛卷入手极轻，像捧着一把砂。
  - 「往下走，第三道坡拐过去就是城门。」领路人指了指坡下那缕淡烟，「他在城里等了许多年了。」
  - 「他等的是故人。」你说，「可我跟他素未谋面。」
  - 领路人看了你一会儿，忽然笑了：「素未谋面。」他把这四个字在嘴里过了一遍，摇摇头，「这话你进去当着他的面说说看。」
  - 他退到路边，让开那条通向坡下的路，像门户关城上那个人一样，站回一个他站惯了的位置。
  - 「另外——」他在你走出十几步后又开口，声音顺着风送过来，「你身上带的那半句话，他手里有另外半句。别急着问。他等了几十年，你就多等一天，明日进城，把今日学的这一线，睡一夜睡进骨头里再去。」
