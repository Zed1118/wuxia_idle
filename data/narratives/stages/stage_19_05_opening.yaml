id: stage_19_05_opening
title: 黑石重照 · 起
paragraphs:
  - 黑石滩在夜里更黑。大大小小的黑石半埋在砂里，绵延十几里，风从石缝里穿过去，呜呜地响。跟你头一回来的那一夜一模一样。
  - 不一样的是这回你不用举火把。滩心那块半人高的黑石上，有一点光。
  - 那面小铜镜还搁在原处。镜面朝天，映着满天星子，几十年的风砂过去，它还是干干净净。
  - 守镜人站在石边，兜帽掀在肩后。
  - 「第三回了。」他说，「来过一个，看了一夜，没取。第二个——就是你——也没取。今天是第三回。」
  - 「还是我。」
  - 「还是你，可不是同一个你。」他上下打量你，那双眼睛在夜里很亮，「上一回你站在那儿，跟我隔着三步。这一回你从西边回来，你身上带着西边的分量。」
  - 你把霸主那半面取出来，托在掌心。两面镜隔着几步远对着，一面在你手上，一面在黑石上。
  - 「他亲口说了。」你说。
  - 守镜人很久没有动。
  - 「说了什么？」
  - 「他说，四十年前有个人坐在他对面，他一句话也没跟那人说。」你说，「他等的不是那个人回来。他等的是有人把那一句走完，走回来说给他听。」
  - 「你说了？」
  - 「我说了。」
  - 「他怎么回的？」
  - 「他把这半面给我，说，所以现在给你。」
  - 守镜人抬起头，望向天。星子铺满了整个天，一直铺到砂地的边上。
  - 「那我这几十年，就到今天为止。」他说得很轻，像在跟自己交代什么，「我守的是话没说完之前的那段空。话说完了，空就填上了，不用人守了。」
  - 他把手伸进衣襟，抽出一条软鞭。鞭梢垂到砂上，贴着砂面，像一条醒着的蛇。
  - 「取镜之前，还有最后一件事。」他说。
  - 「你要拦我？」
  - 「不是拦。」他往前走了三步，站到黑石和你中间，「上一回你没取，是你看懂了。这一回你要取，也得让我看懂——看懂你取的是什么。」
  - 他把鞭子在身侧一抖，砂面上划开一道浅痕。
  - 「几十年了，我这一手没在人前使过。」他说，「不是使不出来。是守东西的人不该出手——出了手，守的那样东西就不干净了。」
  - 「今天不一样？」
  - 「今天它不用我守了。」兜帽底下那双眼睛亮得吓人，「所以今天我可以出手。」
