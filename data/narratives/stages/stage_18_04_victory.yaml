id: stage_18_04_victory
title: 演武场 · 胜
paragraphs:
  - 三角散了。
  - 女子先退出去，退到木桩边，一手扶着桩子直起腰；两个男子退得慢些，肩并着肩，脚下踩出的印子还留在夯土上。三个人身上都没有伤，可谁也没有再摆架势。
  - 「够了。」女子说。
  - 你收剑。
  - 「你等了两次。」她说，「第一次是我们合围那一下，你没有硬冲，退到桩子边上，让我们自己散了半边。第二次是他起势那一下——」她抬下巴指了指左边的男子，「你等他起到一半才进的手。」
  - 「起到一半的时候他收不回来。」你说。
  - 「对。收不回来。」女子笑了一下，笑意很淡，「守了几十年，被人看破了。」
  - 场上一时无话。风从平顶的屋脊上过去，木桩上的旧麻绳晃了晃。
  - 「那四个字，我现在可以告诉你了。」她忽然说。
  - 你看着她。
  - 「无物可赠。」她一个字一个字地说，「当年师父对那个背剑的说的，就是这四个字。他把剑插回鞘里，什么也没给。」
  - 你没有立刻接话。那四个字落下来的时候，你想起山门里那把空了九日的旧椅——原来他从这么远的地方回去，怀里也是空的。
  - 「为什么？」
  - 「我们三个回来以后争了好些年。」中间的男子接过话，「老大说是师父输得不甘心，老三说是那个人不配。我说都不是。」他顿了顿，「后来我想通了——给东西是给还在路上的人的。那个背剑的当时已经不在路上了。」
  - 「他去了哪里？」
  - 「不知道。」男子摇头，「往西去了，再没回来。这几十年师父一直坐在火堆前，我以为他在等那个人回来。」他看了你一眼，「现在看，不是。」
  - 女子把手从木桩上放下来，让开了通往场西的一条路。
  - 「进去吧。绕过那排屋子，火堆就在后头。」
  - 你往那条路走。走到场边，背后传来女子最后一句话，声音比刚才轻了很多。
  - 「他今天添了两回柴。」她说，「往常一天只添一回。」
