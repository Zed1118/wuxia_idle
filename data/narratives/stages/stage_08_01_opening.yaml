id: stage_08_01_opening
title: 塞外风急 · 启
paragraphs:
  - 出关第五日，驿道断了。官修的路到界碑为止，界碑以北，只剩牧人踩出的草径，一路伸进漠南草原。枯草压着残雪，风从草梢上刮过去，呜呜地响。你勒紧衣领，沿草径往北。
  - 午后，草原上起了马蹄声。先是三骑，从坡后转出来，随即左右又各是四五骑，散成一张弧，不紧不慢地兜着你。为首那人披一件油亮的老羊皮袄，马鞍边挂着一柄雁翎刀，刀鞘磨得发白。「南边来的？」他在马上打量你，「一个人，一柄剑，走漠南——客官，这道上的规矩你懂不懂？」
  - 你说你找一个人。灰衣，独行，往北去了。为首那人和左右对了个眼色，忽然笑了。「找人？这大草原上找人，先得问过我们弟兄。」他把雁翎刀抽出半截，「留下盘缠和那柄剑，规矩我教你。」
  - 马队围拢过来，蹄声从四面压过来。你不退。这一程是你自己定的，头一道坎，不能绕。你按住剑柄，迎着风站定。
