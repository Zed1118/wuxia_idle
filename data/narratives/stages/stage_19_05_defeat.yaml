id: stage_19_05_defeat
title: 黑石重照 · 败
paragraphs:
  - 你倒在砂里。黑石就在几步之外，石上那面镜子还朝着天，星子在里头一动不动，像什么也没发生。
  - 软鞭收回去了。守镜人站在你和黑石之间，把鞭子一圈一圈盘回腰间。
  - 「起来。」他说。
  - 你撑着砂坐起来。怀里那半面镜掉出来了，落在砂上，镜面朝下。他弯腰替你捡起来，掸干净，递回你手里。
  - 「这一手照的是你自己。」他说，「你打得越急，它回得越狠。刚才你急了。」
  - 「我等了很久了。」
  - 「我等了几十年。」他说得很平常，不像是在压你，「急不出来的。这面镜子搁在这儿几十年，多等你一夜，它也不会怎么样。」
  - 他退回黑石边，重新站定，兜帽拉起来罩住脸，又变回你头一回见他时那个样子。
  - 「气顺了再来。」他说，「我还在这儿。反正在这儿，是我最会做的事。」
