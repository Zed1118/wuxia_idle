id: stage_17_04_opening
title: 沙海深处 · 起
paragraphs:
  - 出了古城再往西，砂丘不再一浪叠一浪了——它们变得又高又缓，像凝住的大水。丘与丘之间的洼地宽到能跑马，洼底的砂细得发白，一脚下去没到小腿，抽出来时带起一蓬白雾。这里是沙海最深的地方，方圆百里，没有一块石头。
  - 你是先听见声音的。不是风声——风此刻极小。是砂在响，从右前方那道大丘的背面，簌簌，簌簌，一阵一阵，有节拍。
  - 绕过丘脊，你看见了他。
  - 一个精瘦的汉子，赤着上身站在洼底，两只手在身前慢慢地绕。他每绕一圈，脚边的白砂就跟着旋起来一寸；绕到第七圈，一人高的砂柱已经在他身前立住了，柱子里的砂飞快地转，把午后的光绞成一片浑浊的白。
  - 他绕得极慢，极专注，像是根本没看见你。可当那砂柱高过他头顶的一瞬，他忽然开口了，眼睛仍旧盯着自己的手：
  - 「别站在下风。」
  - 你横跨出去两步。几乎同时，砂柱塌了——不是散，是整根扑出去，扑在你原先站的地方，砂过之后，那块洼地被削下去半尺。
  - 「卷沙的。」他终于抬眼看你，两只手垂下来，脚边的白砂还在慢慢回旋，「东边的规矩我不懂。这儿的规矩是：想过去，得让我把手上这一下使完。」他重新开始绕手，砂又跟着起来了，「你要么等它使完，要么——」
  - 他咧了下嘴：「在我使完之前，把它打断。」
