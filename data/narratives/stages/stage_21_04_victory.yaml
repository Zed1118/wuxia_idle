id: stage_21_04_victory
title: 樵径 · 承
paragraphs:
  - 扁担落地，滚了半圈，靠在石头上停住。
  - 老仆坐回原处，喘了一会儿，把针从衣襟上取下来，继续补他那件旧衣。手在抖，针脚却还是密的。
  - 「上去吧。」
  - 你没有动。
  - 「你说上头空了。」
  - 「我说的是他们说的。」他没抬头，「我自己四十年没上去过一次。上头是空是满，我不知道，也不该我知道——我的活儿是在这儿坐着。」
  - 针穿过布，扯出一段线。
  - 「不过我猜是空的。」他忽然说，「那位走的那年，我在径口听见山上有风，跟往常不一样。风过去以后，山静了很久。那种静法，是屋里没人的静。」
  - 「你为什么还拦？」
  - 老仆停了手。
  - 「你上去那年，我看着你上去的。」他说，「上去的时候你什么也没有，下来的时候你身上多了一样东西。我不懂那是什么，可我看得出来——山把东西给了你，山就空了。空了就得再有人填。这些年上来的一个一个都填不满，我心里其实是急的。」
  - 他抬起眼。
  - 「所以我拦。拦住不够格的，是替上头留着位子。万一哪天来了个够格的呢？」
  - 你在径口站了很久。
  - 「今年最小那个，」你说，「十六岁的。」
  - 「他上去了。」老仆说，「四天前。我掂了，掂不动他——不是他强，是他轻。他身上什么都没有，扁担压不住空的东西。」
  - 「他还没下来。」
  - 「还没下来。」老仆重新低下头，「我这四天夜里都睡不着。上头空着，山上没吃的。」
  - 你朝径上走了两步，又停住。
  - 「老丈。」
  - 「嗯。」
  - 「上头不空。」
  - 老仆的针停在半路，没有抬头。过了很久，他嗯了一声，那一声很轻，像是把四十年一起放下了。
  - 你上山。走出十几步回头看，他还在补那件衣裳，背靠着石头，跟四十年前一模一样。
