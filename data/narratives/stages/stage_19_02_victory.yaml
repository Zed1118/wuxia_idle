id: stage_19_02_victory
title: 旧沙海 · 承
paragraphs:
  - 他坐在砂上，喘了很久，才把气匀过来。
  - 「够远了。」他说。
  - 你把他扶起来。他轻得不像话，扶着像扶一捆干柴。
  - 「我年轻时候也想过往西。」他拍掉身上的砂，「后来改了主意，觉得量清楚一件小事，比走一条不知道尽头的路要牢靠。四十一年，我把这片砂量到几乎能背下来——哪一道脊是新的，哪一道是去年那道往东挪来的，我闭着眼睛都知道。」
  - 「这不算白量。」
  - 「不算。」他望着自己来回踩了四十一年的那条痕，「可我今天才想明白一件事。我量的是砂往东挪了多少。我自己呢？我在同一条道上来回，走的路加起来能绕这沙海几十圈，可我一直在原地。」
  - 风起来了，把他刚才踩出的脚印慢慢抹平。
  - 「你从最西边回来。」他说，「你怀里那面铜的，是从那头带过来的。它挪了整整一条沙海。」
  - 「它是半面镜子。」
  - 「半面也够了。」他把手在衣襟上擦了擦，「东西挪得动，是因为有人带着它挪。砂挪三十七丈用了四十一年，是因为没人带它。」
  - 你要走的时候，他忽然叫住你。
  - 「往东第三程，黑风口。」他说，「那儿有个人。他不量东西，他听风。你要是过得去他那一关，替我问他一句话——问他，风到底往哪边吹。」
  - 「你自己不能问？」
  - 「问过。」他重新蹲下去，抓起一把砂，摊在掌心里，「他说风哪边都吹。我不服气，服气了四十一年也没服气。你去问，兴许他换个说法。」
