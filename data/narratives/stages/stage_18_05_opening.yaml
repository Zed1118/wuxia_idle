id: stage_18_05_opening
title: 火堆前 · 起
paragraphs:
  - 绕过那排平顶的屋子，后头是一片空地。空地当中三块石头围着一小堆火。
  - 火比你想的小。烟从这么小的一堆火里升上去，笔直，不散——你在丘脊上看了三天的那缕烟，源头只有这么一点。
  - 一个人坐在火边，背对着你。他往火里推了一根柴，火舌舔上来，噼地响了一声。
  - 「坐了三天。」他说，没有回头，「丘脊上。」
  - 「你看得见？」
  - 「看不见。」他说，「烟看得见。风小的天，烟直着上去，谁在丘脊上待着，鸟会绕。我看了三天鸟绕着走。」
  - 他转过身来。
  - 他比你想的老。头发全白了，束得很整齐；脸上的皱纹是被风砂刻出来的那种，深而干。可他坐得很直，两只手搭在膝上，指节粗大。你看不出他年轻时是什么样子，只看得出这个人几十年没有着过急。
  - 「东边来的。」他说，「坐。」
  - 你在火堆对面坐下。
  - 「接关人跟你说，我在等一个故人。」
  - 「说了。领路人也说了。」
  - 「你想明白那两个字了吗？」
  - 「没有。」你说，「我想了一路。走过同一条路算不算，在同一个地方陷过砂算不算——都像，都差一点。」
  - 霸主看着你，看了很久。火光在他脸上跳。
  - 「差的那一点，说不明白。」他终于说，「四十年前有个人坐在你这个位置上。我一句话也没跟他说——他当时比你急，说了也听不进去。」
  - 「他叫李寒。」你说，「是我师父。」
  - 霸主手里那根柴停住了，没有推进火里。
  - 火堆边上静了很久，静到你能听见炭在底下裂开的细响。
  - 「四十年。」他终于说，「我连他姓什么都不知道。」
  - 「他也从没跟我提过你。」你说，「他只留下三句话。其中一句是：剑到了一处地方，就要听那处地方的风。」
  - 「那句是他在嘉峪关的石阶上坐了一夜想出来的。」霸主说，「他从我这儿往回走了很远，才把那句想明白，写在了石头上。」他把柴推进火里，火舌舔上来，「我等了四十年，等的不是他回来。他回不来了——往西走的人，都回不来。」
  - 「他没往西。」你说，「他回了中原，开了山门，收了徒弟，把那三句话留下，然后走了。」
  - 霸主没有立刻答话。他看着火，看了很久。
  - 「那更好。」他说，「走出去的人里头，总得有一个把话带回去。」
  - 「那你等什么？」
  - 「等有人把那句话听懂。」霸主站起身。
  - 他站起来的时候，你才发现他身上没有兵器。腰上没有刀，背上没有剑，两只手空着，只是那双手垂下来的时候，火苗歪了一下。
  - 「我有一掌。」他说，「起名字的时候我三十岁，站在关外往东看，看了半年没看见人。我就把它叫作阳关无故人。」
  - 火重新立直了。
  - 「这一掌我教不了你，说也说不明白。」他抬起手，掌心朝下，很慢，慢到你能看清每一根手指的动作，「你要就得自己从我这儿接一下。接得住，它就是你的了。」
  - 「接不住呢？」
  - 「接不住就还是我的。」霸主说，「我再等下一个。」
  - 他的掌停在半空，不落。
  - 「不过我劝你一句——别急着接。」他说，「这一掌不快。它慢得很，慢到你会以为随时都能躲开。等你真去躲的时候，才发现躲的地方全被它占住了。」
