id: stage_10_04_defeat
title: 嵩阳关 · 殇
paragraphs:
  - 你终究没能抢到那一线。老者的掌法看似缓慢，收发之间却没有半点破绽，一掌沉似一掌，将你逼得节节后退，最后一掌拍在你剑身上，震得你虎口迸裂，单膝跪在了关门之下。
  - 「我说什么来着。」老者收掌，并不追击，只俯视着你，「还没准备好。」他叹了口气，那叹息里没有得意，「北边的风霜是把你磨利了，可利刃也会崩口。你太急着往前，急得忘了自己脚下还没站稳。」
  - 你撑着剑喘息，胸口发闷。老者转身背手，重新立回关门中央：「回去，把这一路走过的重新想一遍。想清楚你要过这关，是为了往前，还是只为了不甘心停下。想明白了，再来。」
  - 你握紧了剑。他说得对——你确实太急。从符尽之处出来，你一心只想证明自己能自己走，反倒把每一步的稳都丢了。你缓缓起身，压下那口不甘的气，重新面向那堵三十年不曾挪动的墙。
