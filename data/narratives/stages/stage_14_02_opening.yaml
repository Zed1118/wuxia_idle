id: stage_14_02_opening
title: 山脚驿馆 · 起
paragraphs:
  - 山脚驿馆本已荒了半年，今日却飘出酒气。一个精瘦汉子独坐堂中，面前一只泥炉，炉上温着酒，两条长腿架在长凳上，听见你的脚步也不抬眼：「信使回来得比我想的快。看来山道上那三天锣鼓，敲醒的不是聋子。」
  - 他提起酒壶斟了两碗，一碗推到你面前，一碗自己端起来却不喝：「西凉的规矩，不空手拜山。我是马队先锋，讨教在先——你喝下这碗，咱们手下见；你不喝，也得手下见。」他眼里有笑，手腕却已悄悄沉了下去，「我家主人说，中原的绝顶新人，先让我称一称斤两。」
  - 你打量这间驿馆。桌椅是旧的，泥炉是新的，炉火拨得极匀——行家一出手，就知有没有，能把一堆湿柴拨成这样的火候，手上的功夫浅不了。你在他对面坐下，没去碰那碗酒：「斤两在这儿，称吧。」先锋眼睛一亮，长笑起身，两条长腿从凳上收下来：「痛快！比山道上那个敲锣的痛快多了！」
