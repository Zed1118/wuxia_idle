id: stage_20_04_victory
title: 接程 · 承
paragraphs:
  - 「接住了。」
  - 送关旧部把枪收直，杵回地上。新布经了这一场，沾了土，不那么白了——像一条写过字的纸。
  - 「三十年，老夫送出去的人，手上都是一股往外的劲。」他喘了口气，声音里带着一点不容易听出来的高兴，「恨不能把关里的一切都蹬开，蹬得越远越好。你这手不一样——是往回收的。走过头的人，才收得回来。」
  - 「这一程，算送还是算接？」
  - 「都算。」他难得地笑了一下，皱纹里落着土，「最后一程老夫送过你，头一程老夫接了你。中间那些——沙海，黑石，西凉——那些是你自己的，谁也送不了，谁也接不了。」
  - 他侧过身，让开路，枪往关门的方向一指。
  - 「去。门今日不到日落就会开。」
  - 「你怎么知道？」
  - 「磨了三道的墨，晾着会干。」他说，「老将军这个人，账比命重。他不会让墨干第二回。」
  - 你往前走了几步，他在身后忽然又开口。
  - 「替老夫也递一句。」他的声音放低了些，「就说——站上的灶，三十年温着。他要是哪天卸了甲，路过驿道，进来烤烤火。他称了一辈子人，老夫想请他坐下来，喝口热的，不称。」
