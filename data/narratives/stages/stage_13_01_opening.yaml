id: stage_13_01_opening
title: 山脚茶棚 · 启
paragraphs:
  - 进山第一条岔路口，搭着一间歪歪斜斜的茶棚。棚里只一个老把式，粗布短打，正蹲在灶前烧火，铜壶里的水咕嘟咕嘟响。见你一身行脚打扮往山里去，他也不拦，只舀了碗粗茶递过来：「喝一碗再走。上面的路，烫得很。」
  - 你接茶坐下，随口问路。老把式的话匣子却开了——他说四十年前自己也是条汉子，枪棒上没服过谁，一路打到半山，遇见一个从顶上下来的老人。「人家就站在那儿，让我打。我使了十二分力气，连他衣角都没沾着。」他伸出满是老茧的手，比划了一下，又缩回去，「那一回我就懂了，有些山，不是给咱这种人上的。」
  - 「打那起，我就守在这山脚，卖茶。」老把式往山上努了努嘴，「见过绝顶的人，不一定上得去绝顶。可上去了的人打这儿过，我看得出来——你身上这股劲，跟当年那位下山的老爷子，有几分像。」他顿了顿，忽然站起身，把烧火棍往灶边一靠，「不过话讲回来，上山的人我见得多，空手回来的更多。你要上去，先陪老朽走两招——我的话不值钱，我的棍子还值几个钱。」
  - 你放下茶碗，起身。这老把式只讲不出手的老话，一讲就是四十年；今日他肯重新抄起棍子，是把你当成了真要上山的人。山脚第一关，你抱拳，领教。
