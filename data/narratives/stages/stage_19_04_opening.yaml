id: stage_19_04_opening
title: 关城再叩 · 起
paragraphs:
  - 关城从砂里长出来的时候，天正好亮。
  - 城墙是夯土的，一层砂一层土，被风削得斜了，远看像半座塌了的丘。城门朝西开——西凉的关城，防的是东边。你从西边过来，正对着门。
  - 门开着。接关人站在门洞底下，背着手，像是站了一夜。
  - 「回来了。」他说。
  - 「回来了。」
  - 他往门外走了三步，站到日头底下。这个人比你记得的要老——不是老了，是先前你从东边来，隔着风砂看不清，如今顺光，看得见他鬓角的白和眼下深深的两道纹。
  - 「你进关那天，我说了一句话。」他说，「我跟每一个往西去的人都说那句话。说了三十六年。」
  - 「霸主在西凉深处等，等东边再来一个故人。」
  - 「一个字不差。」他点点头，「三十六年，说过一千多回。听的人有的笑，有的不信，有的走了两天就回头。你是头一个走到底的。」
  - 他停了一下。
  - 「所以今天我没话说了。」
  - 你没接。
  - 「你不明白。」他看着你，眼神很平静，「三十六年，我起床开门，站在这儿，等一个往西去的人，跟他说那句话。那句话是我这条命的形状。今天你从西边回来，那句话就说完了。它说完了，我这个人也就……」
  - 他没说下去，抬起手，握了握拳，又松开。
  - 「所以我得拦你一回。」
  - 「你要拦什么？」
  - 「进关的时候我看的是，你够不够格进去。」他往前踏了一步，脚下的砂被压出一个坑，「出关的时候我要看的是——你带出来的那样东西，配不配从这道门过去。」
  - 「你知道我带了什么。」
  - 「我知道。」他说，「守镜人在黑石上守了几十年，霸主等了四十年，我在这道门底下说了三十六年。三个人加起来一百多年，都押在你怀里那半面上。」
  - 他把背在身后的那只手拿出来。手里没有兵器。
  - 「这一百多年，不能就这么让你揣着走过去。」他说，「你得叫它经一回手。」
