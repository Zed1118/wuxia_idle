id: stage_11_05_opening
title: 问鼎台 · 启
paragraphs:
  - 中州名门的最深处，是一座高高的问鼎台。台上只坐着一个人——鎏金公，中州名头最响的一位老名宿。他成名四十年，一手「鎏金诀」名震中州，据说当年一诀既出，金光耀得三里外都能望见，从此江湖上再没人敢在中州提「第一」二字。台下的后辈仰头望着他，眼里全是不加掩饰的敬畏。
  - 老人缓缓起身，枯瘦的手一引，鎏金诀便起了势。金光自剑上层层漫开，煌煌然如熔金泼地，那威势比玉京阁的流金剑法更盛十倍，逼得你几乎睁不开眼。台下一片惊呼，有人当场就跪了下去。这便是名震中州的成名绝学，四十年不败的招。
  - 「北边来的小子，」鎏金公的声音不高，却压得满台皆静，「你一路踏平了中州几家门户，也算有些本事。可到了我这问鼎台，你该知道什么叫真正的名门。接下我这鎏金诀，你再谈往深处去。」金光愈盛，威压如山。
  - 你迎着那片刺目的金光，握紧了剑。这一路，你看穿了排场的虚、门第的虚、买来的名声的虚、华而不实的绝学的虚。可眼前这一位，是名震整个中州的老名宿——他这四十年的名头压下来，究竟是货真价实的一座山，还是这满江湖最重的一个「虚」字？你要亲手去接他这一诀，才能知道。
