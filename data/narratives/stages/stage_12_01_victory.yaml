id: stage_12_01_victory
title: 寒江渡 · 胜
paragraphs:
  - 老翁被逼得放下了篙，才真正使出手上的东西。那撑了四十年篙的手，使起招来又稳又巧，借力卸力，一分不多，一分不少。没有花势，没有喝彩，每一招都落在最要紧的地方。你与他缠斗数十回合，才在他一记卸力的空当里，将剑锋递到了他咽喉前。
  - 老翁停了手，也不恼，重新拄起长篙。你收剑立在船头，看清了他这一身功夫的来路——不是哪家名门的绝学，是四十年一篙一篙，在这江心水急处磨出来的。招是死的，水是活的，他把活水里练出的巧，一分不剩地喂进了招里。这样的功夫，撑得起一次真拼，撑不起半句吹嘘。
  - 「你输不了几招，倒也看得出好歹。」老翁重新点篙离岸，语气平淡，「我这手上没什么招，撑船撑熟了，手就这样了。名号那东西，当不得饭吃，也挡不得风浪。」船身一稳，又是分毫不晃。
  - 你接过他递来的一句「手熟」，与怀里那几样旧物搁在一处。名门那一程，你见的是有名无实；到了这无名渡口，头一回见着有实无名。原来你先前寻本事寻错了地界——真章不在金字招牌下，在这些无人抬举的手上。船靠了对岸，你迈步上去，往中州更深的去处走。
