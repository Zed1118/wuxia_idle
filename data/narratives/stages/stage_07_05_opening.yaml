id: stage_07_05_opening
title: 千钧压顶 · 启
paragraphs:
  - 阴山脚下的北派山门，是青石砌的，门楣上没有匾，只刻着一道极深的凿痕——像被一记重手劈下去、又生生收住的印子。石阶上立着一个人，身形不高，肩背极厚，双手垂在身侧，站得像一块钉进地里的石头。这就是北派的重手宗匠。
  - 「南边的掌门，来了。」宗匠的声音低而闷，「李寒飞升，你这一脉一夜成名。北派下帖上门，不是要欺你新立——是要看看，这名声底下，有没有真东西。」他抬起手，「你若过得了我这一门重手，北派认你；过不了，回南边去，把门户守好，别再往北。」
  - 他往前踏一步，那一步落地，石阶上的积雪竟被震得跳了起来。「这门功夫，唤作『千钧坠岳』。」他说，「十年前被人取了去藏了十年，你在关外该已见过那人。可这门重手，根子在北派——他借得走招式，借不走这一门的根。」他的拳缓缓抬起，未落，一股沉压已经罩了下来，像一座山正朝你顶上坠。
  - 你稳住下盘。这一记「千钧坠岳」，比一路来所有的重手都沉。你想起灰衣人借它藏了十年、想起北派为它上门讨艺——这门功夫的根，今夜就在你面前。你没有回头看南边。师父不在这里。这一战，只有你自己。你迎着那股沉压，拔剑上前。
