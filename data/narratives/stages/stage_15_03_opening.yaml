id: stage_15_03_opening
title: 戈壁古窟 · 起
paragraphs:
  - 过河之后，土越走越黄，树越走越少。第七日，戈壁边缘起了一线石壁，壁上凿着层层佛窟——几百年前的手笔，风沙磨圆了佛像的眉眼，却磨不掉那份端坐的安稳。窟前一道细泉，泉边坐着一位灰衣僧人，芒鞋磨穿了底，一望便知走了极远的路。
  - 僧人起身合十：「施主往西去？贫僧往东来。这眼泉水，是两条路上唯一的甜水，你我在此相遇，是缘法。」他打量你片刻，目光落在你背后的剑上，「施主身上有山的气象——想必就是东边新起的那位。贫僧从更西的地方走来，一路听人说起中原绝顶，本想去山上讨教，不想在这里就遇上了。」
  - 他退后三步，在窟前的黄沙上站定，双掌一合一开：「佛门的拳，不为杀伐。明王怒目，是拦，不是杀——拦住恶念，拦住来势，拦住不该过去的东西。施主要往西去，西边的路上多的是拦路的东西，贫僧把这套拦法演给你看，你破得开，路上就没有破不开的拦。」
  - 千年佛像在他身后静坐，风沙从窟顶掠过。你放下行囊，缓缓拔剑：「请大师——拦我一程。」
