id: stage_15_02_opening
title: 黄河渡 · 起
paragraphs:
  - 到黄河渡口的时候，天已经黑透了。夜渡的船要等上弦月过河心才开，渡口的灯笼在风里晃，照着三两个等船的旅人。你在栈桥尽头站定，听水声拍岸——过了这条河，就出了中原腹地，往西再没有这样宽的水了。
  - 灯影里有人起身。一位青衫客，剑囊斜背，在渡口的灯下把你打量了很久，才缓步走近：「白日里官道上的动静，在下远远看了一眼。中原绝顶要出关西行——这样的事，几十年遇不上一回。」他解下剑囊，「在下在这渡口练了半辈子剑，专候过河的高手讨教一手。夜长，船未至，请掌门赐一战。」
  - 你望着这位渡口夜客。他的剑意藏而不露，像这条夜里的河，面上平静，底下全是暗流。他见你打量，淡淡一笑：「当年也有一位往西去的剑客，在这渡口等过船。那时在下年少，没敢上前递剑，悔了几十年。今夜这一手，是补当年的。」
  - 河心的月升上来了，水面碎银一片。你拔剑出鞘：「船到之前，请。」
