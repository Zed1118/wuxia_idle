id: stage_09_04_opening
title: 黑水绝壁 · 启
paragraphs:
  - 瀚海到了尽头，是一道断崖。黑黢黢的石壁从沙里拔起，直插进云；壁脚一线干涸的河床，河床里的石头也是黑的——这地方唤作黑水，水早死了几百年，只剩个名。断崖中间裂开一道窄口，仅容一人过，是碛北最深处唯一的门。铜符烫得几乎攥不住，朝北那一角，正指着那道窄口。
  - 窄口当中，站着一个人。铁塔一般的身架，赤着半边膀子，任碛北的寒风刮着，纹丝不动。他手里没有兵器，两条手臂比寻常人的腿还粗。「站住。」他的声音撞在石壁上，嗡嗡回响，「符我认得。可认符的是那位，不是你。想过这道口，先过我这一关。」
  - 你说你循符而来，只求见那一位一面。守口人摇头。「见那位的，四十年里我放过三个。三个都是自己走到这口子上，我拦不住的——拦得住的，就没资格进去。」他往前踏一步，脚下的黑石裂开一道缝，「你是哪一种，打过才知道。」
  - 窄口容不下花巧，只容硬碰硬。守口人双臂一沉，气势像整面石壁压了下来。你退无可退——这道门槛，是那一位摆在门口的一堵墙，过不去，符再烫也没有用。你沉腰，剑锋前指，正对着那堵墙。
