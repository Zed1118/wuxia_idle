id: stage_15_05_victory
title: 阳关城下 · 胜
paragraphs:
  - 孤城闭最后一次落下。老将的刀势如门闩下坠，静到极处，快到极处——你却在旧势将尽、门闩未落的那一线之间抢进中线，剑尖抵在他持刀的腕前，停住。风声重新流动，长烟从两人之间缓缓穿过。
  - 老将维持着落闩的姿势，凝立不动，忽然低声笑了：「破了。老夫这一手『孤城闭』，关的是来势——你不跟老夫拼来势，专等门闩落到一半。」他收刀入鞘，退后一步，把你上上下下重新打量一遍，「静功破静功。几十年了，头一个。」
  - 他从关楼下的石匣里取出一卷用旧布裹了几层的册子，双手递来：「孤城闭。老夫守关几十年琢磨出来的东西，只此一卷，没传过人。」见你迟疑，他把册子按进你手里，「关外的路比关内险。中原的杀法讲究进，老夫这一手专讲守——往西去的人，得会守，才活得到走回来的那一日。」
  - 「当年那个少年过关的时候，老夫只抬了抬手，什么也没给他。」老将转身，亲手去拉门闩，声音混在门轴的沉响里，「几十年了，老夫总想着，那日要是多给他一手守的功夫，兴许他早回来了。这个念想，今日补在你身上。」
  - 关门缓缓开了一线，又开了一线。门洞尽头，戈壁铺向天边，落日正沉在长烟里。老将立在门边，抱拳，直挺挺的像关墙上一杆旗：「出关罢。老夫在这儿——等你从西边走回来。」
