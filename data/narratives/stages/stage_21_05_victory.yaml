id: stage_21_05_victory
title: 绝顶平台 · 承
paragraphs:
  - 最后一招落空。
  - 少年收不住势，往前扑了半步，一只手撑在地上才没倒。他跪在那儿喘，喘得整个背都在起伏，喘了很久也没抬头。
  - 你还站在原地。脚下的位置和开打之前差了不到半尺。
  - 「你没还手。」他终于说。
  - 「不用还。」
  - 「我打了这么久……你连一步都没退。」
  - 「退了。」你说，「退了半尺。」
  - 少年抬起头。他脸上全是汗，风一吹，汗结成霜。
  - 「那半尺是你让的。」
  - 「不是。」你说，「那半尺是你挣的。你最后那一手，我没见过。」
  - 他怔住了。
  - 「你师承哪家？」你问。
  - 「没师承。」他说，「道上捡的符，坪上偷学的架子，村里看人打架看的。他们说那是野路子，练不成。」
  - 「最后那一手叫什么？」
  - 「没名字。」他低头看自己的手，像是也不认得它，「就是打到那儿，觉得不能再往上打了——再往上没有了，只能往外。」
  - 山风从东面上来，把云推开一线。极远处有一点雪白。
  - 你在青石边坐下，把那枚铜符拿起来，在手里翻了一面。
  - 「几十年前我在这儿，也是这么打上来的。」你说，「那时候坐在这儿的是个老人。他也不还手。打完了他跟我说一句话——」
  - 「什么话？」
  - 「他说：绝顶之上没有更高的山了，可有比山更远的东西。」
  - 少年愣了很久。
  - 「所以往外。」他喃喃道。
  - 「所以往外。」你把符递过去，「拿着。」
  - 他没有接。
  - 「这是留给后来人的。」
  - 「你就是后来人。」
  - 「那你呢？」
  - 「我把它留下的时候，就已经不是了。」
  - 少年伸出两只手，接了。符很小，在他手里显得更小。他捏了一会儿，忽然把它翻过来，符面朝着山道口——朝着来路。
  - 「我也要留给后来人。」他说。
  - 「你还没走完。」
  - 「那我先替他压着。」他把符按回青石底下，手掌在石面上按了按，像在按一件很重的东西，「等我走完了回来，再交给他。」
  - 你笑了。这是几十年里你头一次觉得，有些话不必说得那么明白，年轻人自己会走到那儿去。
  - 云合拢，又散开。来路群山依旧低。
