id: stage_13_05_opening
title: 绝顶平台 · 启
paragraphs:
  - 断崖之后，山势忽然平了。绝顶是一方不大的石台，台上没有树，只有云——云从平台四周漫过去，来路的群山全在云底下，低成了小小的起伏。石台中央坐着一个老人，灰袍，瘦削，面前一方青石，石上摆着一副残棋，黑白子各半，像是自己跟自己下了几十年。
  - 「来了。」老人不抬头，把一枚白子轻轻落在盘上，「茶棚的棍子，半山的帚，竹林的影，断崖的锏——你一路打上来，他们五个，我都是听着风声知道的。」他这才抬眼。那双眼睛极静，静得像深潭，潭底沉着几十年的山，「我四十六年前上的绝顶。上来那天我就明白了，绝顶之上没有更高的山，只有等人的人。我在此等，等一个走得上来、还接得住我一招的人。」
  - 你问等什么。老人笑了，笑意很浅：「等你替我看一眼——我看了四十六年的这些山，在一个刚走上来的人眼里，是什么样子。」他缓缓起身，灰袍垂落，周身没有半分气势，可满台的云忽然都静了，「我叫候峰翁。候是等候的候。这一招我藏了四十六年，叫一览众山——不是打人的招，是看山的招。你接得住，它就归你；接不住，下山去，我接着等。」
  - 你想起山脚老把式的话：山上不冷，就是等人等得久了些。眼前这位，就是等的人。你按了按怀里的止水旧印和凉铜符——前人留符引你到此，今日这一步，没人能替你走。你拔剑。绝顶之上，云开一线。
