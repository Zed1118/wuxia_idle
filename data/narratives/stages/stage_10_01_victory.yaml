id: stage_10_01_victory
title: 河套渡口 · 胜
paragraphs:
  - 三招之后，那人的剑被你压在栈桥的木板上。他的剑法路数分明、招招扎实，是正经门户里教出来的；可你在碛北跟马贼、跟隘口守卫、跟那一位过过手，那些不讲规矩的凶险，早把你的剑磨出了另一种东西——他守得住招式，守不住招式之外的那点空当。
  - 「你这剑……不像门户里的。」他收剑退开，神色复杂，「野是野了些，可扎实。」他让开栈桥，「过河吧。中州水深，你这样的，进去要么闯出个名头，要么栽个大跟头。」
  - 你踏上渡船。艄公撑篙，河面缓缓退开北岸。你回头望了一眼——河套以北，是你走了整整三章边塞路才走出来的天地；河套以南，是你一无所知的江湖。铜符在怀里凉着，这一次，没有谁替你指方向。
  - 你却不慌。没有路的碛北你都走过来了，何况这有渡口、有人烟、有规矩可循的中原。船到南岸，你迈上青石板，脚步比自己想的要稳。
