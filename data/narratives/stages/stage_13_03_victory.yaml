id: stage_13_03_victory
title: 竹林 · 胜
paragraphs:
  - 竹隐客的招不在手上，在整片竹林里——他人在竹间时隐时现，出手全从你最想不到的方向来，阴柔的劲顺着竹势走，借着风声掩着声息。你接连几剑都递空了，索性收剑立定，把一身锋芒尽数敛进剑鞘。风过时，竹涛又起，你在竹涛最盛的一瞬听出了那一点不属于竹子的声息，反手一剑，正点在青衣人的袖角。
  - 「妙。」竹隐客退开三步，看着袖角上那道剑痕，眼里没有恼，倒有喜色，「我在这片林子里隐了二十年，没人找得着我——你是头一个肯先把剑收起来的。」他抚着身旁一竿老竹，慢慢道，「竹子收锋，是收给自己看的；你收锋，是收给对手看的。同一个收字，你比我多走了一层。」
  - 「为何不去山顶？」你问。他笑了笑，笑容很淡：「我把『收』字当成了尽头，你把它当成了过路。这就是你我分别处。」他抬手掰下一截竹枝，替你在小径尽头拨开一丛竹，「上去吧。过了竹林是断崖，断崖上那位守关的，跟我可不一样——我是收，他是拦。断崖之后，就真的没有回头路了。」
  - 你走过他拨开的竹丛。身后竹涛复起，青衣人重又隐进绿里，像一滴水回了河。走出很远你回头望，漫山竹子一齐俯仰，分不清哪一竿底下，藏着那个把锋收了一辈子的人。
