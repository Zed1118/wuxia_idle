id: stage_07_05_victory
title: 千钧压顶 · 终
paragraphs:
  - 那一记千钧压顶，被你从正中一剑破开。宗匠的拳收在半空，没有落下。他退到石阶上，肩背那股钉进地里的沉，第一次松了。山门檐角的雪，簌簌落下一片。
  - 「这一剑……你从『千钧坠岳』的正中破了进来。」宗匠看着你，眼里那点考较的意思散了，「这门重手，讲究一个『整』——整座山压下来，看似无隙。你却看出了那一线隙。」他缓缓点头，「你既破得了它，这门功夫的真解，就该有你一份。北派认你。」
  - 他从怀里取出一枚旧铜符，符上刻着北派的门纹，边角磨得发亮。「这枚符你收着。」宗匠说，「灰衣人当年借走的，不止一门重手——他还借走了半桩旧事。这枚符指着的地方，比阴山更北。那桩旧事，日后要你自己去了，才知道。」你接过铜符，符很凉，凉得像雁门以北的风。
  - 你收剑，立在北派山门的石阶前。北地的风还在刮。你忽然明白师父那句「最后那一段路要自己走」——不是叫你去走师父走过的路，是叫你走出你自己的那一条。这一程从雁门到阴山，师父一招没替你挡。可你站住了。南边山门里那把空椅，这一刻你晓得，回去之后你可以坐了——不是因为你接了师父的位子，是因为你这一程，头一回没靠余荫，自己赢了下来。
