id: stage_14_04_victory
title: 演武旧坪 · 胜
paragraphs:
  - 第五荡。人马俱进的一瞬，你没退，反而抢进了马蹄内侧——荡势最盛处，也是他唯一收不住的地方。长兵擦着耳畔砸进青石板，碎石飞溅，副将连人带马冲出七八步才勒住。满坪俱静，只余战马粗重的鼻息。
  - 副将低头看看嵌进石缝的长兵，看了很久，忽然翻身下马，单膝砸在石板上，行了一个西凉最重的军礼：「五荡，你接全了。」他起身时甲叶哗啦作响，声音却放得极缓，「四十年，除了主人，没人站在这坪子上接全过。」
  - 他拔起长兵归鞍，牵马退到坪边，把整片旧坪让了出来：「我上山前，主人交代一句话——若有人接全五荡，叫他在坪上等着，别走。」他望向峰顶方向，俯身，「主人这就上山。中原的绝顶，我家主人借了——这一战，他等的路，比我们走的一万里还长。」
  - 副将下山去了，马蹄声沿着旧径一路远下去。满坪碎石之间，五道荡势犁出的深痕一字排开，一道比一道深，最后一道几乎劈开半块青石。你俯身抚过那道石痕，掌心被棱角硌得生疼——五荡已如此，十荡是什么样子？你把这份斤两记进心里，在坪上静静等着。峰顶的云，正一点一点朝这边压过来。
