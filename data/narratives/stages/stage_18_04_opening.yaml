id: stage_18_04_opening
title: 演武场 · 起
paragraphs:
  - 三条巷子都很窄，两边是平顶的土屋，门都关着。走过的时候你听见屋里有人声，压得很低，你一走过去，人声就停了。等你走远，才又续上。
  - 巷子尽头豁然开出一片空场。场是夯出来的，硬得像石头，四周立着一圈木桩，桩上缠着旧麻绳，绳子磨得起了毛。这是练武的地方，而且用了很多年。
  - 场中央站着三个人。
  - 三个人站成一个不等边的三角，彼此相隔两丈。左边那个是女子，右边两个是男子，年纪都在六十上下，风砂把脸刻得比年纪更老。三人都穿着同样的深褐短打，袖口扎紧，腰里束着宽带。
  - 你走到场边，三个人同时转过身来。
  - 「东边来的。」左边的女子先开口，声音不高，「我们三个，师父座下第三批弟子。当年山上是我们三个跟着去的。」
  - 「昆仑山顶。」你说。
  - 三个人对视了一眼。
  - 「你知道那件事。」右边靠外的男子说。
  - 「我知道那个人。」你说，「他留了一句话在嘉峪关的石阶上。我从那句话上走过来的。」
  - 场上静了一瞬。
  - 「那你更该过这一关。」女子说，「当年山顶上，师父跟那个背剑的说了四个字，我们三个就站在旁边听着。听完我们回来，回来以后守了几十年——守的不是这座城，是那四个字。」
  - 「哪四个字？」
  - 「你要是过得去，师父会自己告诉你。」她把袖口又紧了紧，「过不去就不必知道了。」
  - 三个人同时动了。不是扑上来，是各自往侧后挪了半步——三角变了形，把你圈在了中间。
  - 「师门规矩。」中间那个男子说，「见师父之前，先过我们三个。我们不欺生，也不放水。你出手，我们就接着；你不出手，我们就等着。」
  - 场边木桩上的旧麻绳被风吹得轻轻晃。
  - 「不过有一样先说明白。」女子最后补了一句，「我们三个，不比谁快。」
