id: stage_20_03_opening
title: 关下 · 起
paragraphs:
  - 关城到了跟前，才看出它的老。
  - 夯土的城墙被风沙打出一道一道的沟，深的地方能伸进半只手。有些沟里填着新土，颜色比旧墙深，像老人手背上新结的痂。
  - 墙根下蹲着一个人，正往一道沟里抹泥。他抹得很慢，一抹子压一抹子，压实了，再蘸水抹光。
  - 「城头的旗。」你想起守烽人的话，「是什么颜色？」
  - 「没有旗。」补墙匠头也不抬，「旗杆是空的。旗烂完那年，我刚来。」
  - 你抬头。那根细杆立在城楼上，光秃秃的，什么也没挂。三十年，守烽人望的是一根空杆。
  - 「他望的不是旗。」补墙匠像是知道你在想什么，「他望的是杆还立着。杆立着，关就在。关在，他那堆柴就还能不点。」
  - 他抹完那道沟，直起腰，捶了捶背，这才正眼看你。手上的泥一直糊到肘弯，指缝里全是土，土的颜色跟城墙一个色——分不清是手上沾了墙，还是墙里和了手。
  - 「墙挡不住人。」他说，「会家子一纵就上来了，我见得多。墙挡的是砂。砂一年往墙上啃一寸，我一年补一寸。」
  - 「补得完吗？」
  - 「补不完。」他把抹子在水桶沿上磕了磕，「可我补的这几十年，墙没塌。补不完，和塌，是两回事。人这一辈子的事，多数补不完，可你只要一直补，它就塌不了。」
  - 他放下抹子，在衣襟上擦手。
  - 「人要过，走门；砂要过，没门。」他往城门的方向偏了偏头，「你是要走门的。走门的人，得先过我——这几十年，从西边回来的没几个，翻墙的倒见过十几个。武艺越高的越爱翻墙，觉得叩门丢人。」
  - 「翻墙的呢？」
  - 「都让我扔回去了。」他挽起袖子，两条小臂粗得像两截夯木，「墙是我补的。从我的墙上过，跟从我身上踩过去，是一个意思。」
