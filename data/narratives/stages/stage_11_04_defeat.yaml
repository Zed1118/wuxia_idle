id: stage_11_04_defeat
title: 玉京阁 · 殇
paragraphs:
  - 那片金鳞般的剑光铺天盖地卷来，满座的喝彩在耳边轰响。你一时竟看花了眼，分不清哪一道是虚势，哪一道是真招，剑势一乱，被那华丽的剑光生生逼退。金光里藏着的一记重手撞在你剑上，震得你虎口发麻，踉跄跌坐在玉京阁的地砖上。
  - 「看花了眼罢？」玉京剑主居高临下，笑意重新爬回脸上，「我这『流金剑法』，好看便是它的厉害。你满心想着拆穿它，眼睛却先被它勾了去——你输，不是输在剑上，是输在你也没能免俗。」他这话半是自得，半却歪打正着，戳中了你的浮躁。
  - 你撑剑起身，胸口郁着一口气。你想拆穿这华而不实的绝学，却险些被它华丽的皮面唬住，忘了自己在碛北磨出来的那点定——不管招式多好看，只看它伤不伤得了人。方才那一败，败在你也让那满座喝彩，晃动了心神。
  - 你合上眼，把那片晃眼的金光沉下去，把满耳的喝彩也沉下去，直到眼前只剩下他剑势里那一处始终虚着的空当。再睁眼时，那点浮躁散了。你重新握剑，不再看他的剑有多好看，只看它，究竟哪里是空的。
