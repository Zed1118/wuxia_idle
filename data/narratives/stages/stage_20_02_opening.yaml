id: stage_20_02_opening
title: 望关 · 起
paragraphs:
  - 第三座驿亭边上立着一座烽燧。夯土的墩台，让几十年的风磨圆了棱角，像从地里自己长出来的。
  - 你从墩台边的高坡上第一次望见了阳关——天边一点黑，城楼的轮廓，再往上，一根细得几乎看不见的旗杆。
  - 墩台底下摊着一地柴。一根一根，粗细分好，晒在日头底下；旁边码着已经晒透的，码得方方正正，像一堵小墙。
  - 守烽人从柴堆后面直起身。他手里还捏着两根柴，看见你，先把柴按粗细归了位，才走过来。
  - 「西边回来的。」
  - 「换马人让我带句话。」你说，「柴再干，也别盼着点。」
  - 守烽人愣了一下，随即笑了，笑纹在风吹皴的脸上散开。
  - 「这矮子。」他摇摇头，「四十年了，就他看得穿我。」
  - 他领你看那堆柴。「三十年，我没点过一回火。烽火是给坏消息备的——西边有变，一墩火起，一墩接一墩，一夜烧到中原去。我天天把柴晒干、码好，就是为了那一夜。那一夜没来。」
  - 「三十年没来，是好事。」
  - 「是好事。」他说，「可人守着一件三十年用不上的东西，有时候会糊涂——到底是盼着用不上，还是盼着用得上。柴太干了，人就痒。这就是他让你捎那句话的缘故。」
  - 他转过身，正对着你。那双眼睛在风皴的脸上，静得像两口井。
  - 「你从西边来，身上带着西边的分量。我在这墩子底下望了三十年关，也望了三十年西边——今天西边自己走到我跟前来了。」
  - 「你要问什么？」
  - 「不问。」他把袖子挽起来，「烽子的规矩，消息不过嘴，过手。你这一身，是好消息还是坏消息，我手上称得出来。若是坏消息——」他朝那堵柴墙偏了偏头，「今夜这一墩就得点。」
