id: stage_11_03_victory
title: 洛阳榷场 · 胜
paragraphs:
  - 那柄软剑缠了你两招，第三招上，你不再由它绕，剑势直落，斩断了它虚浮的黏劲。软剑脱手飞出，钉在货栈的木板上兀自颤动。贾某踉跄一退，那副长袖善舞的从容，登时碎得干干净净。
  - 「你、你可知道我认得谁！」他慌忙搬出满口的靠山，府衙的、镖行的，一串名号报得又急又乱。你收剑淡淡道：「你认得的人再多，替你挡不了这一剑。名头是拿银子和交情买的，买得来旁人喊你一声，买不来你自己这一手。」
  - 他瘫坐在地，望着那柄还在颤的软剑，说不出话。周遭看热闹的商贾伙计，方才还都敬着他三分，此刻的眼神却变了——原来这位「响当当的贾爷」，剑法竟是这般不经打。名头这东西，堆起来风光，塌起来也快。
  - 你转身离开榷场。中州名门的第三层虚，是买来的名声。排场、门第、银钱人情——这一路见过的三样，说到底是同一样：都是名头在前头唬人，名头底下那点真章，却深浅不一。你握了握怀里的两枚旧物，往中州名门的内里去了。
