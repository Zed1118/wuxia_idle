id: stage_10_03_opening
title: 洛水照影 · 启
paragraphs:
  - 洛水绕过邙山，水面平得像一面铺开的镜子。你沿水边走，暮色里，对岸的芦苇丛忽然立起一个人影——一身与你相仿的旧衣，背上一把与你相仿的剑，连站姿都像照着你摆的。你停下，那影子也停下；你按剑，那影子也按剑。
  - 「你在找路。」影子先开了口，声音像从水底浮上来，「北边的符引你到了尽头，你以为自己在开新路，其实还在等下一个指引——等一个新的符，一个新的师父，一个替你说往哪儿走的人。」它一步踏上水面，涟漪不惊，「承认吧，没有人指路，你其实不敢往前。」
  - 你没有答。它说中了你藏在心底的那点犹疑——过了河套、过了雁门，你确实一直在盼着前头有个明确的方向。这洛水照影照出的不是你的身形，是你不肯认的那一层退缩。
  - 影子提剑迎来，招式与你如出一辙，却处处透着迟疑与退意——那正是此刻的你。要过这一关，你得先斩断照影里那个还在等人指路的自己。你迎上去。
