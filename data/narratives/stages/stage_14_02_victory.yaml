id: stage_14_02_victory
title: 山脚驿馆 · 胜
paragraphs:
  - 泥炉翻了，酒洒了一地，先锋跌坐在长凳上，愣了半晌，忽然仰头大笑。他拾起酒壶晃了晃，还剩小半壶，仰头灌了一口，把壶递给你：「好斤两。我走西凉十三部，这个斤两的人物，一只巴掌数得过来。」
  - 你问他主人何时上山。他收了笑，神色头一回郑重起来：「急什么。主人说，拜山如饮马，要一口一口来。」他站起身，拍去衣上的灰，「不过我先告诉你——我家主人马上马下浸了四十年，十荡十决，西凉无人能接住三荡。你在山上等着，一程比一程沉。」他牵马出馆，又回头补了一句，「山里还有一位使剑的，是我们路上捡的西域人，剑走偏锋，你当心他的路子野。」
  - 你望着他上马。先锋在鞍上坐定，又恢复了那副懒散模样，冲你扬了扬下巴：「馆里的酒钱我押在柜台了——西凉人不欠拜山的地头。」马蹄声起，他往山脚下的马队大营去了。你低头看那碗没动的酒，酒还温着。你端起来喝了，搁下碗，上山。
