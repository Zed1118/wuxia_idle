id: stage_11_03_opening
title: 洛阳榷场 · 启
paragraphs:
  - 洛阳城里的榷场，人声鼎沸，货栈连着货栈，镖行的旗子一面挨一面。这里论的不全是剑，更多是银子和交情。你穿过熙攘的市集，正想寻个落脚的客栈，一顶软轿在你身侧停下，轿里下来个绫罗加身的人，身后跟着一串点头哈腰的随从。
  - 那人姓贾，自称是洛阳一带响当当的人物。他也不动手，先摆开一副长袖善舞的做派：「小兄弟面生。这洛阳地界，上至府衙的老爷，下至各家镖行的总镖头，哪个不给贾某三分薄面？」他袖中滑出一柄软剑，语气温吞，「你在中州要行走，总得识几个人。识得贾某，往后便少许多麻烦。」
  - 他这话半是拉拢，半是恫吓。软剑在指间绕了个圈，路数阴柔，招招不见凌厉，却处处黏人，像他这满口的交情一样，缠得人脱不开身。「怎么样？」他笑意不减，「是交个相识，还是非要在贾某的地头上，讨个没趣？」
  - 你看着他那柄绕来绕去的软剑，忽然觉着可笑。他这一身名头，是拿银子铺路、拿人情堆起来的，铺得再厚，也铺不到剑上。你握住剑，不接他那套人情的话，只等他那绕人的软剑，露出它虚浮的底。
