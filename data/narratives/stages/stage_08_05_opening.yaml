id: stage_08_05_opening
title: 残照回风 · 启
paragraphs:
  - 受降城的老卒说，碛北的路早没了。你还是走了三日。第三日黄昏，沙尽处起了一线山影，山脚下伏着一片残垣——半堵山墙，几根断柱，柱础上的刻纹被风沙磨得只剩浅浅一层。你认得那纹路。铜符上的门纹，和它同出一脉。这里是北派的祖庭，塌了不知多少年。
  - 灰衣人就坐在山墙根下，像已经等了很久。残照从他背后压过来，把他的影子拉得极长。「我到不了更北了。」他说，「符不在我身上。追了半辈子，路断在门口。」他站起来，掸了掸衣上的沙，「你也不必再追了——我不走了。」
  - 「阴山借的重手，沙夜里的烛影，都不是我的。」他缓缓抬起双臂，宽大的灰袖垂下来，被风掀起一角，「北派说我骨头是阴柔的骨头，练不得他们的刚猛。他们说对了。这一手，是我自己的——拿你的剑来试。你赢了，符我死心；我赢了，符归我。」
  - 残照沉下去半分，风忽然停了。他的袖子却动起来——先是缓缓一卷，像要收势退走，卷到半途，袖底那股劲道猛地折返。你握紧剑。追了五程，这是他头一回站定了不走。这一战之后，再没有下一程的追逐了。
