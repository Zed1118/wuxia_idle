id: stage_10_02_opening
title: 雁门道 · 启
paragraphs:
  - 过河再往南，官道钻进一片山。雁门道是入中州的隘口，两侧峰峦夹峙，一条石径盘在中间，走一整日也见不到几个人。你打听过前路，都说这条道近来不太平，有伙来去如风的人，专挑独行客下手。
  - 果然，转过一道山弯，石径上不知何时多了个人，斜倚在崖壁上剔指甲，身法看着懒散，脚下的落点却一个不乱。他抬眼瞧你：「独身一个，背把剑，北边来的吧？」他直起身，指节一弹，一枚飞蝗石擦着你耳边钉进崖壁，「这雁门道的买路钱，比河套贵。北边的规矩我不管，进了中州，就得守中州的规矩。」
  - 你问什么规矩。他笑得轻佻：「我说是什么，就是什么——这就是江湖。」话音未落人已欺近，身法快得像一道影子，出手不见招式，只见破绽处处是杀机。这是与河套剑客截然不同的路数，不讲堂堂正正，只讲一击得手。
  - 你侧身让过他第一击，剑未出鞘。他这一路的快，你在灵巧一脉的敌手上见识过；可再快的身法，也有落脚的那一瞬。你盯住那一瞬，缓缓拔剑。
