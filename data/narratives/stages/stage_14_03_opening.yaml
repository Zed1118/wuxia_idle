id: stage_14_03_opening
title: 山林 · 起
paragraphs:
  - 上山的旧径穿过一片山林，林子里没有马蹄声——那人弃了马，徒步站在路当中。一身灰袍，背负一柄细长弯剑，剑鞘上錾着你认不出的西域纹样。他汉话说得慢，一字一顿：「我，不是马队的人。路上遇见，跟着来看热闹的。」
  - 他拔剑，剑身映着林隙漏下的天光，弯如新月：「西域的剑，不读中原的谱。你的路数我看过两场，刚猛灵巧都有，独独没见过我这样的。」他剑尖垂地，人却忽然欺近，快得不像他方才的慢吞吞，「主人说，要我替他把第三关。过了我，你才配站到他马前。」
  - 你侧身让过这一剑，剑风擦着衣角掠过去，凉得像蛇信。好怪的路子——中原剑法讲门户、讲规矩，他的剑却没有门户，人从剑后走，剑从人意来，快慢全不在节拍上。你收了几分试探的心思。跟马队走了一万里路的看客，肯替人把守第三关，本身就不简单。
