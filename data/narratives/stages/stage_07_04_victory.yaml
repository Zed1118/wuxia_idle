id: stage_07_04_victory
title: 灰衣重现 · 破
paragraphs:
  - 灰衣人的袖影收住。他退开两步，站定，还是那副松松的站姿。满坡的雪光重新亮了起来，坡上一片静。
  - 「烛影摇红……你破了。」他并不恼，反倒像松了口气，「这一手，我藏了十年没给人看过。你接下了。」他看你一眼，「只是这一招的路数，你今夜只窥见了三分。剩下的七分，要你自己回来，一回一回想全——想全了，它才是你的。」这一战他没有输干净，你也没有赢干净。他留了一线，你也只看清了那烛影里的一角。
  - 他转身要走。你没有拦。松林的风穿过雪坡，你忽然想起师父那句「剑到了一处地方，就要听那处地方的风」。灰衣人这一手阴柔，就是阴山这一处的风。你听见了，可还没听全。你晓得要再上这坡几回，才能把这一手，听到骨子里去。
