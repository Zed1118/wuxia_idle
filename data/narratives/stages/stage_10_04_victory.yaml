id: stage_10_04_victory
title: 嵩阳关 · 胜
paragraphs:
  - 老者的掌法沉稳厚重，一掌接一掌，像要把你钉在原地。你没有跟他硬拼力气——碛北的隘口守卫教过你，硬墙不必正面撞，要在他收掌换势、旧力已尽的那一线切进去。几番周旋，你终于抢到那一线，剑锋贴着他的掌沿递到胸前，逼得他不得不撤步。
  - 老者收掌，退了半步，花白的胡子微微发颤。他盯着你的剑，良久，忽然让开了关门：「过吧。」他语气里有一丝不易察觉的怅然，「你这样的，我拦不住，也不该拦。」
  - 你收剑要走，他却在身后又说了一句：「往里去，你会碰上一个守潭的老家伙。他比我守得还死。」老者望着关外的方向，「我守关，好歹还盼着有人能过；他守那潭水，是真的一步都不肯挪了。你要是过得了他，替我问一句——守了一辈子，到底守出了个什么。」
  - 你把这句话记下，迈过嵩阳关。守关的老者没有再动，仍旧背手立在关门中央，像一块长了青苔、还会再守下去的旧石。你却知道，自己和他不是一路人——他守着一处，你要往深处去。
