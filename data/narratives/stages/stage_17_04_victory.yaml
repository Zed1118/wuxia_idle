id: stage_17_04_victory
title: 沙海深处 · 胜
paragraphs:
  - 第七圈没有绕完。他手腕转到第五圈半的时候，剑到了——不是砍他的人，是斩在那道正在成形的砂柱腰上。柱子从中间断开，上半截失了旋，哗地垮下来，把他自己浇了一头一脸。
  - 卷沙手抹了把脸，砂从他下巴上一串串往下掉。他没有再起手。
  - 「打断了。」他说，语气里没有火气，倒有点像松了口气，「你算是看懂了。这一下不是使出来才厉害——是它在攒的时候最凶，攒到头，谁在下风谁没命。可它攒的时候，也是它最空的时候。」
  - 他弯腰在砂里摸了一阵，摸出一个磨得发亮的皮筒，抽掉塞子，倒出一卷薄薄的羊皮：「风卷流沙。我使了半辈子，从没让人打断过。今天让你打断了，它就该跟你走。」
  - 你没有即刻接：「你不留着？」
  - 「留着做什么。」他把羊皮塞进你手里，「这一路上的东西，都不是谁的。你看那老卒守着一座没了的城，你看黑风口那位守着一条谁也不走的槽——我们这些人守的都是空的。真要说有主，是这片沙海。」
  - 他往西边一指。日头正落在那个方向，把远处的丘脊烧成一线金。
  - 「再往前，就到边上了。沙海的边上有个人在等——他不拦路，他领路。」卷沙手顿了顿，「不过丑话说在前头：我这一下，你打断了；他那一下，打不断的。」
