id: stage_16_02_victory
title: 黑石戈壁 · 胜
paragraphs:
  - 鞭影收回砂里。守镜人退开三步，让出那块黑石，兜帽微微抬起来——你第一次看清那双眼睛，很亮，不像守了几十年荒滩的人该有的眼睛。
  - 你走到石前。铜镜不大，镜面映着火把的光，也映着你。几十年前，有人在这面镜子前站过一夜——他没取。你看了很久，看清了镜里的自己，然后把已经抬起的手，收了回去。
  - 「也不取？」守镜人的声音里听不出意外，倒像是终于等到了什么，「当年那个，是没看懂，走了。你这个——」他顿了顿，「是看懂了，所以不拿？」
  - 你没有答。守镜人低低笑了一声，把软鞭盘回腰间：「几十年，守来两个不取镜的。也好。镜是霸主的一句话，话，要他亲口说出来才算数。」他朝西边扬了扬下巴，「去吧。今夜这件事传到西凉深处，霸主就知道了——东边，又来人了。」
