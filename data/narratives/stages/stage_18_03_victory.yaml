id: stage_18_03_victory
title: 西凉城下 · 胜
paragraphs:
  - 最后一下，你没有打下去。
  - 他的旧毡被搅得翻了个面，粗陶碗滚出去老远，水洒在土里洇出一小片深色。老人半跪在门洞的阴影里，一只手撑地，另一只手还维持着最后那个架势，可那只手在抖。
  - 你把剑收了。
  - 他抬头看你，看了一会儿，忽然把撑地的手也放开，索性坐在了地上。
  - 「你为什么停？」
  - 「你问的不是我打不打得过你。」你说，「你问的是别的。」
  - 老人沉默了很久。门洞里穿过来的风把他的白发吹得乱了，他也不去理。
  - 「四十年前那个人跟我说，坐到有人从东边走进这道门，我自己就知道。」他说，「我一直以为，我要等的是那个人有多厉害。厉害到能一路打进来，那我这四十年就值了。」
  - 「不是这个。」
  - 「不是。」他说，「刚才你停手的时候我才明白——我等的不是能打进去的人，是肯在我这儿停一下的人。前面那两个都没停。第一个太急，第二个……第二个是被抬着的，他停不下来。」
  - 他撑着地慢慢站起来，这一次没有拒绝你伸过去的手。
  - 「我这四十年算什么，现在我知道了。」他把毡子拾起来，抖了抖上面的土，「算一个人在门口坐了四十年，然后有一个从东边来的人，在他跟前坐下来，问了他一句你等谁。」
  - 他把毡子夹在腋下，让开门洞。
  - 「进去吧。往里走，穿过三条巷子，有一片空场。空场上有三个人在那儿等着——那三个不是等答案的，那三个是真拦人的。过了他们，再往里，就是火堆了。」
  - 你迈进门洞。走出几步，听见他在背后把陶碗捡了起来。
