id: stage_12_03_victory
title: 秋山道 · 胜
paragraphs:
  - 挑山客空出手来，那身挑担的功夫便化进了招里。你的剑势递过去，他不硬接，只微微一沉一让，便把你这一剑的力，像卸柴担一样卸到了一旁。他不抢攻，只化力，任你剑招连绵，都落进他那一沉一送的节奏里。你缠了他许久，才在他一次卸力卸得稍老时，抢进一步，剑尖点在他肩头。
  - 他停手退开，仍是那副不争的模样。你收剑立在石道上，看清了他这一身的来路——没有一招是学来的，全是三十年挑担，在这陡山窄道上磨出来的。别人练功夫是练功夫，他是把功夫过成了日子：挑一趟柴，便练一趟力；走一程山路，便走一程功夫。日子有多实，他的本事就有多实。
  - 「客官的剑，比我这担柴金贵。」挑山客重新挑起担子，「我这点道行，上不了台面，也没想上台面。柴总要人挑，路总要人走，练顺了，日子好过些，如此而已。」他一步一沉，又往山上去了，扁担弯成一张弓。
  - 你目送他上山，久久没有收剑。名实相副这四个字，中州名门个个挂在嘴上，却个个副不起；这挑担的连个名都没有，本事却结结实实地长在骨头里。你转身往更深的山里走。这一路见的实，一个比一个纯粹，你隐隐觉得，前头还有更沉的一担，在等着你。
