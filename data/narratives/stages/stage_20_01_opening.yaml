id: stage_20_01_opening
title: 旧驿东行 · 起
paragraphs:
  - 驿道西头第一座驿站，就是当年那一座——土屋，矮墙，墙头一杆褪了色的旗。三十年送人出关的老卒守着的地方。
  - 站门开着。你走进院子，灶是温的，马槽里添着新料，草香还没散。墙上那副枪架空着，架子上的布垫磨出了枪杆的印子，印子是旧的，灰是新扫的。
  - 「站主不在。」院角有人说话。
  - 说话的人蹲在一匹瘦马边上刷毛，个子矮，手背上全是缰绳磨出来的旧茧。他刷完最后一把，站起来，把刷子别回腰后。
  - 「他去哪儿了？」
  - 「往东。」换马人说，「三十年头一遭，把枪也带上了。他说他去接个人。」
  - 你看了一眼空枪架。
  - 「接谁？」
  - 「他没说。」换马人上下打量你，「不过我猜，就是你。这道上往西去的人我见了四十年，往东回来的，你是头一个。」
  - 他把那匹瘦马牵回棚里，动作很慢，拴好了才回过身来。
  - 「我在这站上管了四十年马。西去的马走到这儿都疲了，我把疲马收下，换精神的出去；换下来的养好了，再等下一拨。马认得道，人认得马——这条道上的事，一半在人腿上，一半在马腿上。」
  - 「我没有马。」
  - 「我知道。」他说，「你来回都没有马。一趟西边，人腿走到底。所以我想称一称——站主称人心，老将军称人的分量，我只会称脚力。走了这么远回来的人，腿里还剩下什么，我得亲眼看看。」
  - 他从腰后解下一条旧缰绳，在手里绕了两圈，绳头垂下来，贴着地。
  - 「别嫌我这行当粗。」他把重心沉下去，整个人忽然轻了，「四十年，我追回来的惊马比你见过的马都多。」
