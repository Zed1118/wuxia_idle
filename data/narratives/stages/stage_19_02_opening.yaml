id: stage_19_02_opening
title: 旧沙海 · 起
paragraphs:
  - 沙海还是那片沙海。
  - 来的时候你在这里陷过一次砂，费了半日才拔出来。那一回你记住了教训：砂不能踩实，得借着塌下去的那股势往前送。如今再走，同样的坡，同样的松砂，你走过去连停都没停。
  - 走出很远才反应过来——不是砂变了，是你不再跟它较劲了。
  - 日头偏西的时候，你看见沙脊上有一个人在走。
  - 他走得极慢，一步一停，每停一次就蹲下去，抓一把砂，摊在掌心里看看，又扬掉。走十几步，掉头，沿着原路走回去，还是一步一停，还是抓砂看砂。来来回回，像在丈量什么。
  - 你走近了他也不抬头。
  - 「今日的砂比昨日细。」他自言自语，「细了三分。」
  - 「你在量什么？」
  - 他这才抬起头。是个瘦得只剩一把骨头的人，皮肤晒成了砂的颜色，眼睛却很清亮。他把手里最后一点砂撒掉，站起来，掸了掸衣襟。
  - 「量它一年往东移多少。」他说，「这片沙海是活的，年年往东挪。挪得慢，一年不到一丈，人看不出来。我从二十三岁量到现在，量了四十一年，它往东挪了三十七丈。」
  - 「量出来做什么？」
  - 「不做什么。」他说得很平常，「起先是想弄清楚它什么时候会埋到关城下头。后来算出来了——一千二百年。我这辈子看不见，我徒弟的徒弟也看不见。」
  - 「那你还量。」
  - 「量顺手了。」他笑了笑，露出一口被砂磨坏的牙，「再说，不量我做什么去？往西走我不敢，往东回去我没脸。就在这中间来回走，一年三十七分之一丈，也算走了路。」
  - 他忽然盯住你怀里。
  - 「你揣着东西。」他说，「铜的。走一步硌一下，你自己不觉得，我听得见——我在这片砂上听了四十一年，风里落一根针我也听得见。」
  - 他往后退了半步，站定，两手在身前虚虚一合。
  - 「往东回去的人，得让我看看。」他说，「我量了一辈子挪三十七丈的东西。我想知道，一个人一辈子能挪多远。」
