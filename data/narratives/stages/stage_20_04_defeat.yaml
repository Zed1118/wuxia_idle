id: stage_20_04_defeat
title: 接程 · 败
paragraphs:
  - 你退出去三步，膝盖一软，单手撑在地上。
  - 送关旧部收了枪，没有追。他把枪杵回地里，看着你，眼神不严厉，也不惋惜，就是看着。
  - 「手上的东西散了。」他说，「走远路的人，身上的东西得捆紧——不是捆在包袱里，是捆在骨头上。路太长，你有些东西还搭在肩上挂着，没长进去。」
  - 「差多少？」
  - 「不多。」他说，「可接这一手，差一线就是差一程。」
  - 他朝驿道的方向偏了偏头。
  - 「回去。站里灶温着，火边坐一夜，把这一路从头想一遍——想紧了，再来。」他顿了顿，「回去烤火，不丢人。老夫送出去那么多人，个个都在那灶边上坐过。」
