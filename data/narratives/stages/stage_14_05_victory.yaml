id: stage_14_05_victory
title: 绝顶峰台 · 胜
paragraphs:
  - 第十荡。宗师的气势蓄到极处，脚下无马，胜似有马，整座峰台的云气都被他这一进荡得翻卷起来——一往无前，有进无退，杀法里连半分回旋的余地都不留。你不退了。你想起断崖上的守关人、演武坪上的五荡，想起这一路所有「接住」的时刻，迎着那道荡势抢进中线，在他旧势已尽、新势未生的一线之间，递出了一剑。
  - 云气轰然散开。宗师冲出七八步，在峰台边缘硬生生收住，脚下碎石滚落深谷，久久不闻落地之声。他背对着你站了很久，忽然放声大笑，笑声滚过群山：「好！一往无前的杀法，死在『不给自己留退路』上——这个道理我讲了四十年，今天头一回被人用剑讲给我听。」他转过身，郑重抱拳，「这一战，借得值。」
  - 他从怀里取出一卷油布裹着的册子，双手递过来：「十荡十决，西凉军中从不外传。今日留在你这儿——不为败，为你接得住。」你接过，册子边角磨得发亮，不知被摩挲过多少遍。他摆摆手止住你的推辞：「杀法是死的，人是活的。它在我这儿，是西凉的；到了你手里，往后就姓中原了。」
  - 宗师下山前，在坪边勒马回望，忽然又说了一句：「你这样的身手，西凉不是没人想见——阳关外头，还有一位比我老得多的人，看了中原几十年。他要是在世，迟早会知道你。」马蹄声得得远去，百人百马退出山口，像一阵风退出了这座山。你立在峰台，怀里的十荡十决沉沉地坠着——比山更远的东西来过了，留下一卷杀法，和一句指向更远的话。
  - 你在峰台上又站了很久。石下的凉铜符还在原处，符面向着来路；而你怀里的五卷真解，有三卷来自这座山，一卷来自荒村野店，最新的一卷，来自万里之外的西凉。你忽然明白候峰翁那句「比山更远」的分量——山守在一处，江湖却没有边。你站得越高，找上门来的路就越远。远客已去，关山犹在，下一段路，该轮到你走出去了。
