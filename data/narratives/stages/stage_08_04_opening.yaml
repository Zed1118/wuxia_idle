id: stage_08_04_opening
title: 孤城闭雪 · 启
paragraphs:
  - 出瀚海那日，天变了。黄沙尽处起了云，云压下来，落的不是雨，是雪。又走半日，雪里现出一座城——受降城。城不大，墙是夯土的，垛口塌了几处，城门紧闭，门前的积雪没过脚踝，看得出闭门已有些时日。
  - 你上前叩门。门楼上探出几杆长枪，随即城门开了一条缝，拥出一队戍卒，把你围在门前。当先一名老卒，甲上落满雪，一口刀提在手里，刀背厚得像一块铁尺。「站住。」他声音沙哑，「三日前来过一个灰衣的，进城打听了半夜，天不亮就走了。你又是什么人？跟他一路的？」
  - 你说你追他，不是随他。老卒眯眼把你从头到脚看了一遍，目光在你背上的剑停了停。「追他？」他冷笑一声，「这座城闭门三十年，就是叫北边来路不明的人闹的。灰衣的来一个，追灰衣的又来一个——受降城的规矩：来历不明，先过我这口刀。」
  - 他把厚背刀横过来，雪片打在刀背上，簌簌地落。身后戍卒把长枪压平，围成半月。你退无可退，也不想退。城里有灰衣人问过的东西，你必须进去。你拱了拱手：「得罪。」拔剑。
