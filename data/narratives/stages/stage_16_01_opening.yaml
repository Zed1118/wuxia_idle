id: stage_16_01_opening
title: 阳关外驿道 · 起
paragraphs:
  - 出关第一程，脚下居然还是驿道——夯得结实的官道从关门底下伸出来，笔直往西，像中原伸出关外的最后一条手臂。道旁每隔十里一座驿亭，亭子越往西越旧，旧到后来，只剩四根柱子顶着半个棚。风从棚下穿过去，卷起一地枯草。
  - 驿道尽头是最后一座驿站。说是驿站，不过一间土屋、一圈矮墙，墙头插着一杆褪了色的旗。屋前石阶上坐着一个老卒，甲早就不穿了，一身洗得发白的短打，手里拄着一杆缠布的长枪，看着你从东边走近，不惊，不问，像是等了有些时候了。
  - 「山上来的？」老卒站起身，拍了拍身上的土，「老将军着人连夜递了话——你要过，他这些散在关外的旧部里，总得有人送最后一程。」他把长枪往地上一顿，枪杆上的布条被风扯得笔直，「老夫在这道上守了三十年驿，替关里送出去的人，数不清了。送到这一座，再往西一步，就不归中原管了。」
  - 「最后一程，规矩还是中原的规矩——递手，不递话。」他退开两步，长枪平举，枪尖压得极稳，「老将军在关上亲手称过你，老夫沾他的光，也称一回。接住这杆枪，这条驿道，就算把你送完了。」
