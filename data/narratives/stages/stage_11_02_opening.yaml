id: stage_11_02_opening
title: 金鼎山门 · 启
paragraphs:
  - 出许都往东，山道尽头是金鼎门的山门。门楣上一块黑底金字的匾额，据说是三代前一位皇亲手书的，压得整座山门都透着一股不容置疑的气派。门前的石阶被踩得溜光，两旁立着金鼎门的门人，一个个下巴抬得比匾额还高。
  - 一个年轻门人拦住你，开口先抬出祖上：「金鼎门立派八十年，出过两位一流的高手，你可知道？这山门前，颍川那些三脚猫都不敢造次。」他斜眼打量你风尘仆仆的旧衣，「北边来的？我金鼎门的门槛，可不是谁想迈就迈的。」
  - 他抽出佩剑，摆出一个极正的起手式——那架式一看便是家传的，规整、周正，挑不出错处。「这是我金鼎门的看家剑法，祖师传下来的。」他语气里全是理所当然，「让你见识见识什么叫名门正派，也好教你北边的野路子知道知道厉害。」
  - 你看着那个周正的起手式，心里却明白了几分。架子是祖上的，一板一眼都对；可这架子里头，缺了点什么——缺的正是他自己练进去的那口气。你握住剑，不去理那副唬人的门第，只等他那口气露出虚来。
