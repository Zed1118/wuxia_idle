id: stage_21_01_opening
title: 潼关 · 起
paragraphs:
  - 潼关的城门比阳关矮，比阳关厚。
  - 阳关的门是给出去的人开的，一扇木板包铁，风一年年削它；潼关的门是给进来的人设的，两重瓮城，门洞里能并排走三辆车。你出中原那年从这里过，走的是里侧那道门——那时你朝西看，门洞黑得像一口井。今日你从西边回来，站在门外，才第一次看清这道门朝外的那一面。
  - 门外一侧的墙根下有个石台，台上坐着个穿旧号衣的兵，正在把一堆通关文书按日子理齐。他把最上面那张翻过来，压了块石头，抬头看你。
  - 「哪里来的？」
  - 「西边。」
  - 「西边哪里？」
  - 「阳关。」
  - 他理文书的手停了一下，然后把整叠都放下了。
  - 「阳关的册子，前月递到过。」他说，「上头销了一行半。销半行那个写法，几十年没见过，衙门里没人认得，压在案底当废件。」他站起来，掸了掸号衣，「原来是给你销的。」
  - 「你认得那写法？」
  - 「我爹认得。」他说，「他在这道门上守了一辈子，教过我一句话——门有两道用处：拦不该进来的，也认该回来的。前一道靠眼力，后一道靠手。」
  - 他从石台后面取过一杆长戟，戟刃朝下，往地上一顿。
  - 「关河卒不查文书。」他说，「文书是纸，纸会假。人假不了——走了几十年的人，一搭手就知道。你要进这道门，得让我认一认。」
  - 你看了看那道门洞。里头黑着，深得看不见另一头，跟你记忆里一模一样。
  - 「认完了呢？」
  - 「认完了我给你让开。」他把戟横过来，「让开之后我还得跟你说一句话——这句话我爹交代了三十年，说等到那个人，就说给他听。」
  - 「什么话？」
  - 「先认。」他说，「话是给认得出的人听的。」
