id: stage_10_03_victory
title: 洛水照影 · 胜
paragraphs:
  - 你没有去接它的招——接它的招，就是承认它是你。你只管把自己的剑递出去，径直、不回头，像下山那日迈过受降城北门那一步。照影的剑迟疑了一瞬，就这一瞬，你的剑锋已穿过它握剑的手腕。水面一荡，那个与你相仿的身影碎成粼粼波光，散了。
  - 洛水重新平静。你站在水边，看着自己真正的倒影——这一个不再退缩。你终于认了：过河、过关，你一直暗暗盼着前路有个指引；而此刻你明白，盼来的指引都是别人的路，唯有不盼、自己往前迈的，才是自己的。
  - 「符的那头是又一个开始」，那一位这句话，你直到照影碎了才算真懂。开始不是有人递给你一条新路，是你肯在没有路的地方，自己踩下第一个脚印。
  - 你转身继续南行。怀里的铜符还在，你却不再时时去摸它了。前头是嵩山地界，中州几家门户盘踞之处。你走得比来时任何一程都要笃定。
