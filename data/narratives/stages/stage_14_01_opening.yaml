id: stage_14_01_opening
title: 山道 · 起
paragraphs:
  - 马蹄声在山道上敲了三天，你才看清来的是一个人。单人匹马，鞍上悬一面半旧的铜锣，锣面磨得发亮——方才三天的声响，是他一路敲上来的。他在你面前丈外勒住，不下马，先抱拳：「西凉马队开道信使。我家主人听闻中原绝顶换了新人，万里而来，借山一战。」
  - 你留意他说的是「借」，不是「讨」，更不是「踢」。一字之差，礼数全在里面。可礼数归礼数，锣鼓先敲了三天，拳帖跟着递上山门——这礼数里裹着的分量，一点也不轻。你抱拳还礼：「山在这里。要借，先过问我。」
  - 你问他主人是谁。信使摇头：「主人说，名头递在山下，拳头上见。」他翻身下马，把铜锣挂回鞍上，活动手腕，「开道的规矩——先问我这条山道，配不配我家主人的马蹄走。」山风穿谷，他摆开一个陌生的架势，沉腰坐马，竟带着几分马上的意味。
  - 你留心看他下盘。中原拳师站桩，求的是一个「定」字；他的桩架却隐隐含着一股向前的冲势，像挽着一匹看不见的马。西凉人马背上讨生活，拳脚也是从马背上长出来的——这一架未打，你已先领教了三分异域的路数。
