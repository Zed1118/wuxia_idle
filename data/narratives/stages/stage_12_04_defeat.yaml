id: stage_12_04_defeat
title: 老铁铺 · 殇
paragraphs:
  - 老铁匠一锤砸下，你想当然地以为，一个山坳里的打铁匠，招式再实也有限，便未尽全力去接。就这一分轻慢，那铁锤穿过你剑势里的空当，重重砸在你肩上，震得你半边身子发麻，踉跄退出铺外，跌坐在冷硬的石地上。
  - 「你小看了我这炉子。」老铁匠立在火光里，并不追击，「你从名门一路过来，见惯了有名无实，便当天下无名的，都是没本事的。这偏见，比名门的虚名，更耽误你。」这话像那把烧红的铁，烫得你心头一缩——他戳中的，正是你自己都没察觉的那点轻慢。
  - 你撑剑起身，肩上钝痛。是了，方才那一败，败的不是剑，是你还没真把「名」放下。你看不起名门的虚名，转过头，却又用「无名便无实」的老眼光，去量一个守炉几十年的匠人。你破了满江湖的虚，自己心里那点以名取人的成见，却还没破干净。
  - 你合上眼，把「山坳铁匠」这四个字，连同那点自恃，一并沉了下去，直到眼前只剩他那一锤起落间的准头。再睁眼时，那点轻慢散了。你重新握剑，望向火光里的老人——这一回，你只看他的锤，不去管他有名无名。
