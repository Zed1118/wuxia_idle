id: stage_12_04_opening
title: 老铁铺 · 启
paragraphs:
  - 翻过秋山，山坳里一间老铁铺，炉火通明。一个老铁匠赤着膊，正抡锤打一柄农具。铺子破旧，梁上挂满了成品，锄、镰、犁头，没有一件是兵器。铁锤起落，火星四溅，那声音一下一下，砸得整条山坳都在应。
  - 你在门口站定，看他抡锤。每一锤落在哪里、用几分力、隔多久落下一记，都准得分毫不差。铁在他锤下渐渐成形，那准头不是眼看出来的，是几十年守着这一炉火，手上养出来的。你先前见的撑篙、打拳、挑担，都还带着日子的粗糙，这老铁匠的手，却已磨到了细处。
  - 老铁匠察觉你，把锤搁在砧上，火光映着他半张脸。「客官不是来打农具的。」他嗓音沙哑，「我守着这炉子一辈子，没出过这道山，也没求过什么名。就这一门打铁的手艺，不能在我手上断了。」他说「守」这个字时，眼神沉了一沉。
  - 你握住了剑。这守炉的老匠人，是你入中州以来，头一个真正让你提起十分心神的对手。他守的不是名，是这一门实实在在的手艺。你要接他的锤——不接过，便不知这「守成」二字，压着多重的真章。
