id: stage_11_01_victory
title: 许都剑会 · 胜
paragraphs:
  - 那片缭乱的剑光只唬得住看客。三招未完，你已看准他花势之间那一处最大的空当，剑锋斜里递入，抵住他的手腕。他的剑「当」地落在校场的黄土上，剑穗那个好看的花，还在半空晃着。
  - 「你……」锦衣剑客脸涨得通红，先前那股昂头的气派散了大半。你没有说话——他的剑法练得极勤，一招一式都在讲究好不好看，偏偏没往「怎么伤人」上练过一分。招式是给高台上的看客练的，这样的剑，撑得起满场喝彩，撑不起一次真拼。
  - 围观的乡民静了一瞬，又哄地议论开来。有人认出他是颍川剑派挂了名的弟子，交头接耳，说不出的复杂。你俯身拾起他的剑，递还给他：「颍川剑派的名头，我记下了。剑，你还得再练。」
  - 他讪讪接过剑，让开了通往剑会内场的路。你迈步进去，心里头那点对「名门」的怵，淡了一层。中州名门的头一道门面，你算是见着了——名头再响，架势再大，剑递出来是虚是实，一搭手就分明。
