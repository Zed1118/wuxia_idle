id: stage_14_03_victory
title: 山林 · 胜
paragraphs:
  - 弯剑脱手，钉进三丈外的老松，剑尾颤个不停。西域剑客看看空着的手，又看看钉在树上的剑，慢吞吞走过去拔下来，归鞘，整套动作不慌不忙，仿佛输的是别人。「好。」他说，还是那副一字一顿的腔调，「我的剑走偏锋，你的剑——没有锋，到处是锋。」
  - 他退到路旁，替你让开上山的径，忽然又说：「我在西域以为自己很快了。跟着马队走了一万里路，才知道中原的山上，有人把快慢都不当回事。」他抱剑靠上树干，不打算再走了，「上去吧。副将在演武旧坪等你——接他五荡，才见得着主人。你够格。」林风穿树，钉剑的老松嗡嗡作响，像替他把这句话又送了一程。
  - 你走出十几步，身后又传来他慢吞吞的声音：「喂——中原人。」你回头。他仍靠着树，眼睛望着林隙的天，「我走了一万里路，就想看看这边的剑是什么样。今天看到了。」他顿了顿，一字一顿，「值。」你冲他抱了抱拳。西域人还礼的方式，是把弯剑在鞘上轻轻叩了两下。
