id: stage_15_03_victory
title: 戈壁古窟 · 胜
paragraphs:
  - 最后一记杵势被你从正中破开，僧人借力后撤，落在泉边，双掌合十，不再起势。他望着你，眉目舒展：「拦不住了。明王的拳拦得住来势，拦不住去意——施主这一剑里有非走不可的路，佛门管这个叫『行愿』。贫僧拦不得，也不该拦。」
  - 你收剑还礼。僧人从行囊里取出一只干瘪的水囊，就着细泉灌满，双手递来：「西去两日是沙海，沙海里没有甜水。这囊水施主带上——贫僧从西边来，知道那片沙的厉害。」他顿了顿，「沙海里有伙马匪，占道几十年了。施主的剑破得开贫僧的拳，破他们不难，只是莫要伤了性命——他们也不过是沙里讨活的人。」
  - 你接过水囊道谢。僧人合十送你到窟前古道上，忽然又道：「施主的剑往西，贫僧的拳往东——路是同一条，走向不同罢了。他日施主从更西的地方回来，若再经此窟，替贫僧看一眼这些佛像可还坐得安稳。」
  - 你回身望了一眼。灰衣僧人立在层层佛窟之下，身影小得像一粒沙，合十的姿势却稳得像那些石佛。你转身向西，沙海就在两日之外。
