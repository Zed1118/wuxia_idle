id: stage_08_03_defeat
title: 沙夜袭影 · 殇
paragraphs:
  - 烛影摇红卷满的那一瞬，你的剑还追在他的袖影后头。影是虚的，袖是虚的，等你看清哪一线是实的，那一掌已经抵在你胸口。火堆塌下去，只剩红炭。
  - 掌力没有吐出来。灰衣人隔着一层衣衫收了手，把你按坐回沙坡上。「追了我五百里，」他说，「你的剑越追越浮。阴山那夜你站得住，今夜你站不住——你太急着抓住我了。」
  - 他俯身，从火边拾起一根没烧透的胡杨枝，插进沙里。「符我可以自己拿。」他顿了顿，却没有朝你怀里伸手，「可这符认人。抢来的，到了北边也敲不开门。」他直起身，走进黑暗里，声音远远传回来：「想通了再往北走。想不通，就回南边去。」
  - 你靠着沙坡坐了半夜。师父那句遗言翻上来——剑到了一处地方，就要听那处地方的风。你出关以来，草原的风、瀚海的风，一路都在耳边，你一次也没有停下来听过。你只顾着追。天亮时你起身，把那根胡杨枝拔下来握了握，朝北，重新上路。
