id: stage_20_03_victory
title: 关下 · 承
paragraphs:
  - 「走门的。」补墙匠收了架子，喘匀一口气，弯腰把抹子捡回手里，像刚才什么都没发生过。
  - 「几十年了，头一个先跟我过完手、再去叩门的。」他蹲回沟前，「翻墙的有力气没规矩，叩门的有规矩没力气。你两样都有——难得。」
  - 「门下有人等我。」
  - 「有。」他往门洞的方向看了一眼，「拿枪的一早就到了，在门外立着，跟根桩似的。门里头那位——」他顿了顿，「老将军把册子摊开一下午了。墨磨了三道，笔搁在边上，没落。」
  - 「他在等什么？」
  - 「等你走到。」补墙匠往沟里抹了一抹子泥，「销账的笔，几十年没蘸过墨。头一回落笔，得等人到齐了才落——这是老年间账房的规矩，他守了一辈子兵，倒把账房的规矩记得最牢。」
  - 你往城门走。他在背后说了最后一句。
  - 「过了门，土就黏了。」他说，「中原的土跟关外不一样，下脚就知道。走两步，你就到家了——不是你的家，是土的家。人的家在哪儿，那得你自己走着看。」
