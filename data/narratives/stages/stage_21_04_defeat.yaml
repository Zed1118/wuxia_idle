id: stage_21_04_defeat
title: 樵径 · 折
paragraphs:
  - 扁担压下来的时候，你才明白老仆那副宽肩膀是怎么来的。
  - 四十年，一根扁担，一条径。他不快，也不狠，只是每一下都落在你要往前走的那个方向上——不打人，打的是你的去意。
  - 你退回径口，站住了。
  - 老仆也退回石头边坐下，把扁担横在膝上，喘着气，没有得意的意思。
  - 「不是你不行。」他说，「是你太急。」
  - 「急？」
  - 「上山的人我见得多了。走得慢的，是来看看的；走得快的，是来拿东西的。」他抹了把汗，「你走得急——像是要赶在什么之前上去。」
  - 山上很静。四天了，那个十六岁的孩子还没有下来。
  - 「那你说怎么办。」
  - 「歇一夜。」老仆重新拿起针线，「山又不会跑。急着上去的人，上去了也是空手回。」
