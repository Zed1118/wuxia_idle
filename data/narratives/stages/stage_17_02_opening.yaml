id: stage_17_02_opening
title: 黑风口 · 起
paragraphs:
  - 黑风口不是一道口子，是两列砂岭之间三十里长的一条槽。风从西边灌进来，被两边的岭夹着，越走越窄，越窄越急，到最里头，风已经不是吹了，是推。你进去不到半个时辰，天就黑了——不是入夜，是砂把日头盖住了。
  - 睁不开眼。你把袖子蒙在脸上，只留一线看脚下，可脚下也看不见——砂在地面上横着流，像一条浅河，河面高一阵低一阵。走了不知多久，抬头看，两边的岭还是那样；再走一阵，还是那样。你开始拿不准自己是在往前走，还是被风推着在原地打转。
  - 天地在这里压下来。不是比喻——风把砂顶到半空，半空又压回地面，人夹在中间，肩上像当真压着东西。中原的高手较量，比的是谁的势更足；此刻你才知道，还有一种势不属于任何人，它就在那儿，几千年了，不冲你来，也不为你让。
  - 就在这时，风里出现了一个不动的东西。
  - 起先你以为是块石头。走近了才看清是个人，背对着风，两脚分开钉在砂里，一柄阔背刀反手拄着，刀身贴着小腿，替他挡住半边的砂。他一动不动，砂在他身后堆起了一道小小的丘。
  - 「站住。」他没有回头，声音是逆着风送过来的，居然一个字没散，「再往前二十步是个坎。这风里看不见，掉下去就出不来了。」他这才转过身，须发上结着一层砂壳，「我在这口子上守了十一年。往西的人，我拦下来的比放过去的多。」
  - 「不是不让走。」他把阔背刀往砂里一顿，刀身入土半尺，风撞在刀面上发出低沉的一声呜，「是这条槽里，急的人先死。你要过，先在这风里跟我站一站——站得住，我送你到头；站不住，你回去等风停。」
