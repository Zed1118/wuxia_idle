id: stage_15_04_victory
title: 沙海故道 · 胜
paragraphs:
  - 大刀最后一次扬起，又缓缓落回沙里。总瓢把子拄着刀站定，胸口起伏，盯着你看了很久，忽然仰天大笑，笑声惊起沙丘后一片鸦群：「好！好本事！跟当年那一个一样——从老子的刀阵里过去，一条性命都不取！」
  - 他把大刀往沙里一插，挥手喝退四周的马匪，从怀里摸出一只酒囊丢过来：「沙海的规矩改一改——这条道，今日给你让开。」他抹了把脸上的沙，语气沉了些，「当年那个背剑的过去之后，再没回来。你们中原的高手，一个一个往西走，走过阳关就没了音信。老子在这沙海里守了几十年道，就想守着看看，到底有没有人能从西边走回来。」
  - 你饮了一口酒，把酒囊丢还给他。烈酒混着沙粒，辣得咽喉发烫。总瓢把子接住酒囊，指了指西边：「顺着石桩再走一日，出了沙海就望得见阳关。关上那位老将军——」他咧嘴一笑，「几十年了，比老子还轴。你过得了他那一关，才算真出了中原。」
  - 马匪们让开故道，退上沙丘。你背起行囊往西走，走出很远，回头望时，总瓢把子还拄着刀立在道中央，像沙海里又多了一根石桩。
