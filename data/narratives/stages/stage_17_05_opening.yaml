id: stage_17_05_opening
title: 西凉腹地门前 · 起
paragraphs:
  - 沙海是有边的。走了七天，第七天傍晚，脚下的砂忽然实了——不是塌完的实，是底下有土的实。再走半里，砂里开始混进碎石，又半里，出现了草：一丛一丛贴着地长的骆驼刺，硬得像铁丝。你在草丛边站住，回头看，来路上那片白茫茫的东西已经落在身后，像退潮之后的滩。
  - 前面是一道长长的缓坡，坡顶上立着一个人，背对着你，仰头看天。
  - 天上有雁。这个时节的雁本该往南，这一队却贴着地平线往西斜插，一会儿排成一线，一会儿散开，落到远处的丘背后不见了。那人一直看到雁全落尽，才转过身来。
  - 他年纪不大不小，一身半旧的皮袍，腰上没有刀，只在左手里松松地攥着一条丈许长的绳子，绳头坠着个铜环。
  - 「等你多时了。」他说。
  - 「你认得我？」
  - 「不认得。」他把绳子换到右手，「我等的是从东边、走完沙海、还站着的人。这七天里我看着你过了黑风口，过了古城，在深处打断了老四那一下。你走到这儿，我就该在这儿。」他抬了抬下巴，指向坡下——坡下的地势沉了下去，远处有一线更深的黑，黑里有一缕淡烟，笔直地立着。
  - 「凉州在那儿。我领人进去。」他顿了顿，「不过在领之前，有一场要打。」
  - 「为什么？」
  - 「因为你眼下这个样子，进去也白进。」领路人把绳子抖开，铜环在坡上划出一道弧，砂沿着弧线腾起来又落下，「你一路打过来，靠的都是快。快是好东西——在中原好使，在人和人之间好使。可进了那扇门，你要面对的不是人。」
  - 他把绳子收回来，绕在小臂上一圈，两圈。
  - 「我教你最后一样。天地不跟你比快。你砍它，它不痛；你推它，它不动。它只在一个时候松口——它自己使劲的那一下。风起来的时候不能顶，风将歇的时候才能借；沙立起来的时候打不动，沙要落下来的那一线，一根手指就能拨。」
  - 绳子抖直了，铜环沉沉地垂在他身前，像一枚不动的坠子。
  - 「这一场，你多半打不动我。」他说得极平静，「打不动就对了。你要找的不是怎么打动我，是等我什么时候松那一下。」
