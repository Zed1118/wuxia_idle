id: stage_17_05_defeat
title: 西凉腹地门前 · 挫
paragraphs:
  - 你一直在打他。
  - 剑快，招密，一轮接一轮，不给他喘息——这是中原三十年教给你的打法，也是这一路上一直好使的打法。可打在他身上，全像打进了沙里。到后来你自己的气先散了，绳子只轻轻一带，人就跪在了砂上。
  - 领路人把绳子收了，蹲下来，与你平视。
  - 「你没在等。」他说，「从头到尾，你一次都没等。」
  - 「等什么？」
  - 「等我松那一下。」他伸出一根手指，在你面前的砂上戳了一个点，又在旁边戳了一长串密密的点，「你出了这么多手——」他抹掉那一长串，「都在这里。而我松口，只在这一下。」他留下那个孤零零的点。
  - 「快没有用。天地面前，快是最没用的东西。」他站起身，把绳子绕回小臂，「你一路上赢，是因为你比人快。到这儿赢不了，是因为我不跟你比这个。」
  - 他往坡下看了一眼，那缕烟还立着。
  - 「回去。歇一夜，或者歇十夜。想明白了再上来——想明白的那一刻你自己会知道，不用我说。」
