id: stage_09_01_opening
title: 符引出关 · 启
paragraphs:
  - 出了受降城，官修的路只剩最后一段。碎石铺的道，一里一里往北收窄，到一处塌了半边的烽燧下断了。烽燧以北，连牧人的草径也没有了，只有碛石和风。你在烽燧下歇脚，摸出铜符搁在膝上——符面朝北的一角，比别处烫。
  - 烽燧背风的一侧蹲着几个人，一色的旧皮袄，马拴在坍墙后头。为首的是个刀疤脸，起身拦在道当中，把一柄环首刀横在膝弯上。「往北？」他打量你，「这最后一段路是我们几个的道。过烽燧，得留下点买路的东西。」
  - 你说你只是借道，找符引的那个人。刀疤脸和身后几个对了个眼色，都笑起来。「符？那一位的符？」他把环首刀提起来，「揣着那玩意往里走的，前头也有过一个，尸首还在碛子里晾着呢。留下剑，我们送你回城，比那位仁慈。」
  - 几个人散开，堵住烽燧两侧的豁口。你把铜符收回怀里——它还烫着，朝北那一角烫得更紧，像在催你往前。这最后一道有路的坎，绕不过去。你按住剑柄，迎着横风站定。
