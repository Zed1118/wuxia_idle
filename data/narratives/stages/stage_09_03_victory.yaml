id: stage_09_03_victory
title: 蜃楼幻影 · 承
paragraphs:
  - 阴影扑到剑前，散了；再聚，再散。你始终没有追出那一寸。它聚不成形，缠不住人，终于像退潮一样瘫回沙里，化成一摊打旋的细沙，被风卷去了东边，卷去了那座本不存在的城。
  - 四下重新空下来。东边的天地线干干净净，没有城，没有水，没有那个灰袍的身影。你站了一会儿，才觉出后背全是冷汗。
  - 那不是灰衣人。可那声音、那站姿、那招手的样子，分明是你心里记着他。蜃楼照的不是前头的景，是你心里放不下的念想——你越想追上谁、留住谁，它就照出谁。你没追，它便没了。
  - 铜符还烫着，指着北。你朝北迈步，忽然懂了灰衣人临别那句「你别认路」——认路的是念想，念想会把你引向一座空城。符不认念想，只认那口井。你顺着符走，把那座扭曲的城彻底留在了身后。
