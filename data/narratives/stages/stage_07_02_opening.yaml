id: stage_07_02_opening
title: 雪压关城 · 启
paragraphs:
  - 云中的这座关城比雁门矮，城砖是旧的，垛口积着半尺厚的雪。城门半开，门里门外都没有人声，只有风从垛口的豁处灌进来，把城楼上一面褪了色的旧旗吹得直响。
  - 你进城这一日，雪下得正紧。城里的屋舍空了大半，北派把哨卡设在了城楼上。你抬头，城楼上一队骑手正勒马看你——是北地的矮脚马，耐寒，踏雪无声。
  - 当先一骑打马下来，雪沫溅了一路。「又是南边来的。」骑手的声音闷在风里，「戍卡放你过雁门，不算数。这关城是北派的门面，要过，先接我三招。」他马鞍上挂着一对短锤，人未近，锤风先到——比关外那名戍卒又重了一层。
  - 你侧身让过第一锤，雪地里立稳。北派重手，一层比一层沉。你晓得再往里去，还有更重的在等着。你没有退，拔剑迎了上去。
