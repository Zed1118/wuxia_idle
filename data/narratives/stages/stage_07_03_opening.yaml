id: stage_07_03_opening
title: 山道伏影 · 启
paragraphs:
  - 过了云中，道就窄了。阴山的余脉一路往北铺开，松林密得遮天，山道在林子里绕来绕去。雪落在松针上，簌簌地掉。你走在道上，听得见的只有自己的脚步，和雪落的声响。
  - 走到一处岔口，你忽地停住。松林深处有个影子一晃就没了——灰色的，很快，像一片被风卷走的旧布。你想起关城哨骑那句「灰衣人在城外露过面」。你没有去追。追不上，也不该追。
  - 影子没了，另一拨人却从松树后转了出来。这一拨北派游哨不使重手，脚下轻，手里是薄背的短刀，走的是快、是巧。「重手一门，也有走轻的？」你心里一动。当先一名游哨已经欺到近前，刀光在松影里一闪即没。
  - 你横剑一格，火星在雪光里迸开。这一路你终于看清：北派不止「重」的一门。要过阴山，先要过这一关的快刀。
