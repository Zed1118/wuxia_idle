id: stage_09_05_defeat
title: 符尽之处 · 殇
paragraphs:
  - 他只出一手。你想接，那片沙尘却不在你剑锋所指的地方；你想躲，它已经到了。一瞬之间，天地只剩黄沙，你连人带剑被卷得辨不清方向，踉跄着单膝跪进碛里。等沙落定，老人已重新坐回井边，仿佛从未起身。
  - 「你追了。」老人没有回头，声音平得像井里的死水，「也可能是你躲了。追也好，躲也好，都是在等它落。这一诀不能等——它落下来的时候，你该已经在里头了。」他顿了顿，「阴山的风你听懂了，大碛的风你听懂了，到我这儿，你还差一口气。」
  - 你撑着剑站起来，胸口闷得发疼。铜符从怀里滑出来，落在黑石上，凉的。你捡起它——它不烫了，可你知道那一位就在三步之外。符尽的地方原来不是终点，是最后一道，也是最难的一道坎。
  - 师父那句遗言最后一次翻上来：剑到了一处地方，就要听那处地方的风。这井边没有风。你忽然明白，没有风的时候，要听的是自己的心跳，是那口不肯出的气。你合上眼，把这一路的一切沉下去，沉到底，再睁眼，重新握剑，面向井边那个从未真正出手的老人。
