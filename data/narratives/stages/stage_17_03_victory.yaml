id: stage_17_03_victory
title: 沙埋古城 · 胜
paragraphs:
  - 他的刀始终没有离开身前三尺。四十年守下来，这个人已经不会进攻了——他所有的招数都是往回收的，收得极密，像一道门闩，你推一次，他落一次。你推了许多次，最后一次没有推，改成了等：等他那一闩落到底、旧势已尽、新势未起的那一线，剑贴着刀脊滑了进去。
  - 长刀停住。老卒低头看了看抵在自己号衣前襟上的剑尖，忽然笑了，笑得眼睛里都是砂：「四十年了。」
  - 「验过了。」他退开一步，把卷刃的长刀拄在砂里，转身朝着空无一物的西边一伸手，「城门在这儿。请。」他推了一下——什么也没有，只有砂在他掌前簌簌落下一片。可他推得郑重，像当真推开了两扇包铁的门。
  - 你回头看他。他已经坐回檐下，重新拿起那块破布。
  - 「黑风口的老哥问你还活着没有。」你说。
  - 他擦刀的手停了一下：「回他，活着。」停了停，又补了一句，「告诉他别惦记。这城总得有人守到最后一天。」
  - 「守到最后一天，然后呢？」
  - 「然后砂把我也埋了，跟这城一块儿。」他说得平平常常，像在说今晚吃什么，「那不叫没了。埋在一块儿，就还是城里的人。」他抬起浑浊的眼睛看你，「往西走吧。再往里，就是沙海最深的地方了。那儿有个卷沙的——他跟我不一样，他不守东西。你留神。」
