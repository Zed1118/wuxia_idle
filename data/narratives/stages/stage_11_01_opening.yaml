id: stage_11_01_opening
title: 许都剑会 · 启
paragraphs:
  - 许都城外一片开阔的校场，正办着中州一年一度的剑会。彩旗招展，高台上坐满了看客，台下一圈圈围着看热闹的乡民。你从边塞一路走来，头一回见这般排场——光是外场迎客的架势，就摆出了几十号劲装佩剑的人，个个昂着头，像谁欠了他们银子。
  - 一名锦衣剑客横到你面前，先不问来路，倒把自己的师承报了个满：「在下出身颍川剑派，师从『中州七剑』之一的柳长风，你可听过？」他见你神色平淡，眉头一皱，「北边来的？也罢，颍川剑派的名头，你迟早得知道。这剑会外场，不是随便什么人都能进的。」
  - 他拔剑一抖，剑穗甩出一个好看的花，「想进去开开眼，先接我三招。接得住，算你有资格；接不住，趁早哪儿来回哪儿去，别在中州给你北边的野门派丢人。」那三招使将出来，招式繁复，剑光缭乱，看得台下一片叫好。
  - 你却没跟着叫好。你在碛北跟真肯拼命的人过过手，一眼便看出这满场花哨底下的空当——招式是练给人看的，不是练来杀人的。你握住剑柄，由他那片剑光缭乱，只等一个破绽。
