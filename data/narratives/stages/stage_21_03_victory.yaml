id: stage_21_03_victory
title: 嵩山旧坪 · 承
paragraphs:
  - 年轻人坐在地上，撑着手，喘得厉害，脸上却是亮的。
  - 「取到了。」他说。
  - 「取到什么了？」
  - 「取到『不用取』。」他抹了把汗，站起来，「我这十几年一直想，那个人往西看见了什么——一定是个了不得的东西，看见了就不一样了。刚才交手我才明白，前辈身上没有那种东西。」
  - 「那有什么？」
  - 「有走过。」他说，「就只是走过。走过和听说过，不是一回事——你们这一路的招，没有一招是巧的，全是笨招，笨到我拆不开。笨招拆不开，是因为它后面压着几十年，我压不住。」
  - 坪上的人陆陆续续围了过来，没人说话，就是站着看。
  - 「所以答案是：没有答案，只有路。」年轻人朝石碑那边看了一眼，「我爷爷那一辈论高低，我们这一辈论看见了什么——两辈人都想坐在这坪上把事情弄明白。可弄明白这件事，坐着办不了。」
  - 他忽然朝你行了个礼，很规矩，不像江湖上的。
  - 「敢问前辈往哪儿去？」
  - 「往东。官道断的地方。」
  - 「山上？」他愣了一下，随即眼睛更亮，「那条樵径？我们这儿有人上去过。」
  - 你也愣了。
  - 「上去几个？」
  - 「这些年前前后后有七八个。」他说，「上去的都下来了，下来之后就不太一样——不肯多讲，只说山上有个人。有一年一个师兄回来，只说了一句：『那位不教招，只是坐在那儿，你打上去，他不还手，你就自己知道自己差在哪儿了。』」
  - 你没有作声。
  - 「今年开春又走了一个。」年轻人说，「最小的那个，十六。他不听劝，说要自己上去看看。」
  - 松涛忽然大起来，把坪上的话音压了一半。
  - 「他带了什么？」你问。
  - 「什么也没带。」年轻人想了想，「哦——带了半块饼，还有一枚旧铜符。他说是几年前在道上捡的，符面朝着来路。他认死理，说朝着来路的符就是留给后来人的，既然捡着了，就得顺着往前走完。」
  - 你伸手按了按怀里。镜是圆的，温的。
  - 那样的符，你这一辈子在道上留过不少。留的时候没想过谁会捡。
