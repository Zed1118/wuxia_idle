id: stage_19_04_defeat
title: 关城再叩 · 败
paragraphs:
  - 你跪在门洞外的砂地上，撑着地才没有倒下去。怀里那半面镜硌着肋骨，硌得比先前更疼。
  - 接关人站在你面前，没有再出手。
  - 「起来。」他说。
  - 你起来了。
  - 「我不是在跟你分高下。」他退回门洞里，重新背起手，「我守这道门三十六年，只学会看一样东西——一个人身上有没有带着不属于他的分量。」
  - 「你说我配不上。」
  - 「我没这么说。」他摇头，「我说的是：你现在揣着它，是揣着；不是带着。揣着的东西，路一颠就掉了。」
  - 门洞里的风穿出来，凉得刺骨。
  - 「回去把气顺一顺，再来叩这道门。」他说，「我一直在。」
