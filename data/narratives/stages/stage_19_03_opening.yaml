id: stage_19_03_opening
title: 黑风口外 · 起
paragraphs:
  - 黑风口是两片砂丘夹出来的一道窄缝。来的时候你从东边进，风顶着你，走一步退半步；这一回你从西边来，风在背后，一进口子就把你往前送，得用力撑着才不至于跑起来。
  - 缝里有块背风的岩，岩下坐着一个人，闭着眼。
  - 你走到他跟前，他没睁眼。
  - 「往东的。」他说。
  - 「风告诉你的？」
  - 「你走路的声音告诉我的。」他这才把眼睛睁开一条缝，「往西走的人脚步重，一步一步往下砸；往东回去的人脚步轻，是被风推着的。二十来年了，从这口子过去的人我听了上千个，回来的不到十个。」
  - 他说话的时候，风从缝里穿过去，呜呜地响，像有人在很远的地方吹埙。
  - 「有人托我问你一句话。」你说，「风到底往哪边吹。」
  - 他笑起来，笑得眼睛都眯上了：「量砂的那位。他问了我三十年。」
  - 「你说风哪边都吹。」
  - 「那是实话。」他站起来，动作很慢，站直了才看出他其实很高，「早上往东，午后往西，入夜转北。这口子是活的，风在里头打转。他不信，他要一个准数——他量了一辈子准数，听不得没准数的话。」
  - 「那你的说法呢？」
  - 「我没有说法。」他把手拢在袖子里，「我在这儿听了二十年风，听出来一件事：想在风里站稳，不能问它往哪吹。风是变的，你要是跟着它变，就永远在原地打转；你要是顶着它，迟早顶不住。」
  - 「那怎么办？」
  - 「你自己往哪走，就往哪走。」他把袖子里的手抽出来，「风顺了，借它一把；风逆了，低头过去。它往哪吹，跟你往哪走，本来就是两件事。」
  - 你站着没动。这句话你在别处听过——不是原话，是同一个意思。有个人在嘉峪关的石阶上坐了一夜，第二天留下一句：剑到了一处地方，就要听那处地方的风。
  - 你把这句念给他听。
  - 听风人沉默了很久。
  - 「听风，不是听它往哪吹。」他终于说，声音低下去，「是听清楚它在吹，然后照旧走自己的。」他抬起手，「说到这儿就够了。往东的人我不白放——过了我这一关，你才配把这句带回去。」
