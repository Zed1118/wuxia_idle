id: stage_12_02_victory
title: 槐花巷 · 胜
paragraphs:
  - 汉子的拳沉实得出奇。没有虚招，没有诱敌，一拳就是一拳，砸在你剑上，震得你手臂发麻。你与他对了三十余拳，才寻着他换气的一线缝隙，剑背贴上他手腕，逼停了他这一拳。他收势极快，退开一步，抱拳，仍是那副憨厚模样。
  - 你收剑喘了口气，心里明白方才为何这般吃力——他这拳没有半点巧劲可借，全是二十年苦功堆出来的硬底子。你想拆他的招，偏偏他就没有「招」，只有「熟」。熟到极处，笨拳也成了利器。名门那些花团锦簇的绝学，反倒经不起这样一拳一拳的实砸。
  - 「客官好剑法。」汉子憨憨一笑，「我这拳没名没目，练了二十年，没拜过师，也没得过什么名头，就图个手熟。街坊问我练它作甚，我也答不上来——练顺了手，心里踏实，如此而已。」
  - 你把这句「心里踏实」记了下来。名门弟子把一辈子练在名头上，越练越空；这汉子把二十年练进一双拳里，不图人知，反倒踏实。你收剑出巷，槐花沾了满肩。中州的实，你又见着一分，都在这些不图名的人手上。
