id: stage_11_05_victory
title: 问鼎台 · 胜
paragraphs:
  - 鎏金公被逼到血气翻涌，终于要使出那压箱底的鎏金诀，金光凝聚，要将四十年的名头尽数灌进这一诀里。可你在他蓄势的一瞬看清了——那金光耀眼，却耀在最表的一层，往里去，竟是虚的。你不躲那片金光，剑锋径直穿进金光的芯里，将他这一诀，硬生生截在了半途。
  - 金光溃散。你收剑立在原地，鎏金诀那一截未尽的势，反倒像一道没走完的路，清清楚楚落进你眼底——原来这名震中州的一诀，起势极华，收势却软，四十年里，老人练的始终是那层镀在面上的金，从没往金底下的骨上练过一分。你顺着这未尽的势，反手一引，那半途而废的一诀，竟在你手里第一次走到了尽头。
  - 「……你把它，练全了。」鎏金公怔怔望着你手中的剑，声音里没有败意，倒像卸下了压了四十年的什么。「我这鎏金诀，唬了中州半世人，也唬了我自己半世。」他从袖中取出一卷剑谱，抛给你，谱面上「鎏金」二字，金漆已斑驳，「拿去。这一诀，落在懂剑的人手里，才算得上真解。别学我，把一辈子练在了名头上。」
  - 你接过剑谱，与怀里那枚止水旧印、那枚凉铜符搁在一处。中州名门最响的一层名头，你也看到了底——名震中州，却虚有其表。守拙翁托你看江湖走到了哪一步，这「虚」的一半，你算是看全了。剩下的路，你要去寻的，是那配得起名头的、实的一半。
