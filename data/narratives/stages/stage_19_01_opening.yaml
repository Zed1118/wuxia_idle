id: stage_19_01_opening
title: 东望 · 起
paragraphs:
  - 出了那片碗底，路开始往上。你走了半日，回到丘脊上，从这里可以看见来时的整条道——它比你走的时候要短。
  - 短得不像话。当初一程一程捱过来，每一程都长得看不见头；此刻站在高处一眼扫过去，那些程与程之间连界都没有，就是一条淡淡的痕，从脚下拉到天边。
  - 你站着看了一会儿，往东走。
  - 走到第二个丘口，有人在那儿等着。
  - 他坐在背风的一面，面前摊着一块布，布上晾着几样东西：一只旧水囊、半截绳、一块磨得发亮的马镫。都是路上用的物件，都旧得不成样子。他见你过来，把布角捏起来一抖，砂粒簌簌落下去。
  - 「东边来的。」他说，「这回是往东去的。」
  - 「你在这儿等人。」
  - 「等了很久了。」他站起来，个子很高，背有些驼，一双手大得出奇，指节上全是老茧，「当年我也往西走。走到西凉城下，看见那座城，就在城外坐了一夜。第二天早上我掉头回来了。」
  - 你没有问为什么。
  - 「你不问？」他倒有点意外。
  - 「问了也是你自己的事。」
  - 他笑了一下，笑得很短：「说得对。我自己想了三十年，也没想明白当时怕的是什么。后来我就不想了，改在这儿坐着——往西去的人我不拦，往东回来的人，我得拦一拦。」
  - 他把布卷起来，塞进怀里，两手空出来，垂在身侧。
  - 「往西去容易。人一股劲上来，什么都不顾，走多远都行。」他往前迈了半步，砂在他脚底下压实了，「难的是走完了往回走。往回走的时候，那股劲没了——支着你的东西，得换一样。」
  - 「换成什么？」
  - 「你要是走得过去，就不用我说。」他抬起那双大手，「走不过去，说了也没用。」
