id: stage_18_05_victory
title: 火堆前 · 胜
paragraphs:
  - 那一掌落下来的时候，你没有躲。
  - 他说得没错——那一掌很慢。慢到你看清了他掌心的纹路，看清了掌风把火苗压平的整个过程。也正因为慢，你眼睁睁看着自己所有能退的地方一处一处被占住：左边是火，右边是石，往后退半步是他掌势最厚的那一片。
  - 中原的三十年在这一刻全部不管用。快没有用，招也没有用。你脑子里只剩下沙海里那个人说的一句话——你要找的不是怎么打动我，是等我什么时候松那一下。
  - 于是你不躲了，也不打了。你就站在那儿等。
  - 掌势最盛的时候没有松。压到你面门前三寸的时候没有松。真正松的那一下，是在掌势将尽、他要把手收回去换第二掌的那一线——快得几乎不存在。
  - 你在那一线里进了手。
  - 火堆哔剥响了一声。
  - 霸主的手停在半空，收也没收，落也没落。他就那么停着，停了很久，然后慢慢把手放下来。
  - 「四十年。」他说。
  - 他重新坐下，往火里添了一根柴。这是今天第三回。
  - 「你接住了。」
  - 你也坐下。手臂到现在还在麻，那不是被打的麻，是接那一掌时震进骨头里的麻。
  - 「我以为要打很久。」你说。
  - 「本来是要打很久的。」霸主说，「你要是跟我拆招，拆到天亮也拆不完，最后累死在这儿。你没拆。」他抬眼看你，「你从头到尾只出了一次手。」
  - 「有人教我等。」
  - 「谁？」
  - 「沙海里领路的那个。」
  - 霸主点了点头，像是早就知道，又像是这一刻才真正确认了什么。
  - 「他是我放出去的。」他说，「放出去二十年，就为了在那儿等一个从东边来、还站得住的人，教他最后一样东西。他教会你了。」
  - 火矮下去一截，他没有再添柴。
  - 「那一掌现在是你的了。」霸主说，「名字你也可以自己改。不过我劝你别改——留着它，等哪天你也在一个地方等久了，你就知道当初我为什么起这么个名字。」
  - 「西出阳关无故人。」你念了一遍。
  - 「三十岁的人才起得出这种名字。」霸主说，「那时候我觉得这条路上不会再有人来了。」
  - 他从怀里摸出一样东西，在手里掂了掂，没有立刻拿出来。
  - 「你从黑石上过来的。」
  - 「过来了。守镜人说，来过一个，没取。」
  - 「你也没取。」
  - 「没取。」
  - 霸主把手摊开。掌心里是半面小铜镜，缠枝纹从断口处延过来。
  - 「那就现在给你。」他说。
