id: stage_15_05_opening
title: 阳关城下 · 起
paragraphs:
  - 出了沙海再走一日，地平线上起了一道黑线。走近了，黑线长成一座关城——阳关。夯土的城墙被几十年风沙打出深深浅浅的沟，城头一面旗帜半卷着，关门紧闭。落日在关墙后头沉下去，长烟贴着戈壁浮起来，把整座孤城衬得像一枚钉进天地之间的铁楔子。
  - 关门前立着一个人。甲胄旧得发暗，须发全白，腰背却挺得笔直，像跟这座关立了同样久。他远远望着你走近，不动，直到你在一箭之地外站定，才开口，声音沙得像风磨过城砖：「老夫在这道门前站了几十年。东来的放进来，西去的放出去——只有一种人，老夫要亲手称过才放行。」
  - 「几十年前，有个背剑的少年从这道门底下过，往西去了。老夫看他年轻，抬手放了行——这一放，几十年没等到他回来。」老将缓缓抬手，按上腰间的刀柄，「打那以后老夫就守着一条新规矩：中原顶尖的人物要出这道关，得先接老夫一战。接得住，关门为你开；接不住，趁早回头——省得老夫再多等一个几十年。」
  - 他拔刀。刀身暗沉无光，像一根门闩。「你是山上下来的那位。借关一战——中原送你出关之前，总得有人称一称你这留符人的分量。」关墙上的残旗忽然停了，长烟落日，孤城之下，再没有别的声音。你放下行囊，拔剑出鞘。
