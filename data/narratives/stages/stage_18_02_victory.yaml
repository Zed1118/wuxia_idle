id: stage_18_02_victory
title: 沿烟一线 · 胜
paragraphs:
  - 他被你带得转了半圈，脚下的白壳终于碎了一片，人往侧后踉跄了两步，扶着砂梁站住。
  - 站住之后他没有再上前，反而先低头看了看自己踩碎的那一片壳。
  - 「碎了。」他说，语气里有点意外，也有点高兴，「这几年还没人让我踩碎过。」
  - 你收势站定。
  - 「你没有直着来。」他抬起头，「你先往我左边虚了一下，我往左封，你才从右边进来的。」
  - 「你说的，直着走的人见不着。」
  - 「我是那么说的。」他把短褐上的白粉拍掉，让开了那条道，「不过说是一回事，真有人听进去是另一回事。这几年从我这儿过去的人多了，听进去的少。」
  - 他往烟那边看了一眼。
  - 「你还是可以直着走。」他说，「现在直着走没关系了——刚才你要是直着来，那就还是急；现在你知道该绕的时候能绕，直着走也不过是省两天。」
  - 你道了谢，往前走。走出十几步，他在后面又喊了一声。
  - 「城下坐着个老的。」他说，「他跟我们不一样。我们是拦人的，他是等人的。你别跟他动手动早了——他能坐在那儿，是有道理的。」
