id: stage_14_01_victory
title: 山道 · 胜
paragraphs:
  - 信使退了七步，自己收住了势。他看看自己的手腕，又看看你，忽然笑了，翻身上马，行了一个西凉的军礼——右拳抵心，微微俯身：「山道配得上。」他说，「三天锣鼓没白敲，我家主人最怕的就是白来一趟。」
  - 你问他马队还有多远。他拨转马头往山下走，声音从山道上飘回来：「先锋已在山脚驿馆候着了。西凉人不空手拜山，你打赢我，只算接了帖子——后头一程比一程重，你慢慢接。」马蹄声得得远去，这一回不是敲锣，是实打实的下山。你立在道旁，听那声响一路远了，心里反倒定了：远客既到，一程一程接便是。
  - 山道重归寂静，石上却留着两行新鲜的蹄印，一路朝山下去了。你俯身细看——蹄铁打的掌比中原的宽厚，钉痕极深，入石三分。来的不是三五游骑，是一支真正行了万里路的马队。你拍了拍石上的浮土，起身往山下走。第一程接住了，后头四程，一程比一程沉。
