id: stage_16_01_victory
title: 阳关外驿道 · 胜
paragraphs:
  - 枪势用老，老卒收枪杵地，喘了两口气，笑出满脸的皱纹：「好。老将军说接得住他的刀，果然也接得住老夫这杆枪——他称过的分量，做不得假。」
  - 他把长枪扛回肩上，朝驿道尽头努了努嘴：「看见那块界石没有？道到那里就断了。界石往西一步，就是戈壁——没有驿，没有亭，没有人给你递手。西凉的路，不是修出来的，是走的人自己一脚一脚踩出来的。」
  - 「去吧。」老卒转身往土屋走，走了两步又停下，背对着你说了最后一句，「老将军还在关上望着呢。走远些再回头看一眼——关墙上那排灯，能送你送到黑石滩。」
