id: stage_08_01_victory
title: 塞外风急 · 终
paragraphs:
  - 雁翎刀落在草里。为首那人从马上翻下来，单膝跪进残雪，半天没爬起来。余下的马贼把马圈在一箭之外，谁也不敢再催蹄。
  - 「好剑。」他喘着气，把刀捡回去，却不敢再出鞘，「漠南道上走了二十年，没见过你这路数。客官要找人，问吧，小人知无不言。」
  - 你又说了一遍：灰衣，独行，往北。他想了想，一拍大腿。「见过。三日前，从这条草径上过去的。」他朝北一指，「那人邪性——我们弟兄照规矩围他，他袖子一摆，头马自己就让开了道。人不像人，倒像一阵风过去的。他往瀚海方向去了，客官，那边可不是人待的地方。」
  - 你谢过，继续往北。风还是那么急，草原尽头隐隐现出一线黄沙。三日的脚程，你要把它追回来。
