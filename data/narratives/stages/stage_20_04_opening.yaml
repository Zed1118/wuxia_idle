id: stage_20_04_opening
title: 接程 · 起
paragraphs:
  - 关门在望。门还闭着，门外一箭之地，立着一杆枪。
  - 枪插在地上，枪杆缠着新布，白得扎眼。送关旧部立在枪边，甲还是不穿，短打还是那身洗得发白的，人比枪站得还直。
  - 「站里灶是温的？」他先开口。
  - 「温的。」
  - 「马槽里料是新的？」
  - 「新的。」
  - 「那就好。」他点点头，像是放下了一件大事，「站不能空。人能走，站不能空——温的灶等人，跟人等人，是一个意思。」
  - 「你来接我。」
  - 「老夫送了三十年。」他伸手握住枪杆，把枪从地里拔出来，动作不快，稳得像从鞘里抽刀，「替关里送出去的人，数不清。送出去的，回来的，你是头一个。送，老夫是熟手；接——」他把枪横过来，「是生手。生手得从头学。」
  - 「学之前呢？」
  - 「规矩照旧。」枪尖压下来，稳稳指着你，「递手，不递话。」
  - 「老将军呢？」
  - 「门下。」他说，「那本册子摊开一下午了。笔搁在边上，墨磨了三道。老夫在这道上三十年，头一回见他晌午就开始磨墨。」
  - 你看了一眼那条新布。他顺着你的目光看下去，握枪的手紧了紧。
  - 「枪上的布，三十年没换过，烂了就拿旧布续。」他说，「今儿早上换的新的。」
  - 他没解释为什么。风把新布吹得笔直，白得像一条没写过字的纸。
  - 「来。」他说，「最后一程，老夫送过你。头一程，老夫接你。」
