id: stage_17_01_opening
title: 砂丘初程 · 起
paragraphs:
  - 天亮时风歇了。砂丘一夜之间换了模样——昨日记住的那道浪脊没了，另一处又鼓起一道新的。沙海不留路，也不留昨天。你辨了辨日头的方位，朝西边下丘，一脚踩空，整个人顺着丘坡溜下去两丈，站起来时靴筒里灌满了砂。
  - 第二个丘，第三个丘。到第五个丘上，你已经明白一件事：这里不能「走」。中原的步法讲究落地生根，一步一桩，桩子扎得越稳走得越远；在砂上，桩子扎得越深，人陷得越死。你试着放轻，脚尖点地就抽，倒是不陷了，可一阵风过来，人像片叶子似的往侧里飘，落地又是一个趔趄。
  - 丘顶上有人。他侧坐在浪脊上，一条腿曲着，一条腿伸出去踩在坡面上，那半边坡的砂正往下淌，淌得极慢，而他连身子都没晃一下。见你上来，他打量了你一眼——先看脚，再看剑。
  - 「东边来的。」他说，不是问句，「看脚就知道。你们那边的人上丘，都想踩住它。」他抬了抬那条伸出去的腿，坡上的砂又往下淌了一寸，他随着淌的势往下滑了一寸，人还是不晃，「踩不住的。这一片沙从这儿到凉州，没有一处踩得住。」
  - 「我姓什么不要紧，这一片人都叫我踏沙的。」他站起来，两脚在坡面上一分一合，整个人竟顺着塌下去的砂往下走了半丈，脚下的砂一直在动，他一直在动，动得同一个拍子上，「往西的路我领过不少人。领之前有个规矩——先让他摔一跤。摔明白了，路才走得下去。」他朝你抬了抬下巴，「来吧。你要是能在这道坡上站住，我认你不用领。」
