id: stage_15_01_opening
title: 山门官道 · 起
paragraphs:
  - 下山的头一日，官道旁就有人候着了。七八位中原同道，散立在道旁的黄叶里，见他走近，齐齐抱拳。为首的是一位使拳的宗师，双臂抱在胸前，笑声先到：「掌门西行的信儿，比掌门的脚程快。我等赶了两日路，在这儿候着——不为别的，江湖的老规矩：远行的人，得有人送。」
  - 你还礼，问如何送法。使拳的宗师大笑，退开三步，沉腰摆架：「空手送人，不成敬意。中原的路数，以拳送行——把我等压箱底的东西亮给你看一遍，你带着上路，路上想起来，就当是中原在背后跟着你。」道旁的同道纷纷散开，让出一片黄叶铺地的官道。
  - 秋风卷着叶子从两人之间穿过。你望着这位专程赶来递拳的同道，忽然想起当年那些一程一程走到山前来讨教的人——从前是别人走到你面前，如今是你要走出去，头一程就有人拦路递手。江湖送行不用酒，用的是真功夫。
  - 你解下背上的剑，横在身前，还了一礼：「那就请诸位——送我一程。」
