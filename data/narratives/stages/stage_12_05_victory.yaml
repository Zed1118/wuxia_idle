id: stage_12_05_victory
title: 荒村野店 · 胜
paragraphs:
  - 无名客被逼到实处，终于要使出那一招绵里藏针。他出手极慢，一掌绵绵推来，软得像拂过一阵风，全无半分锋芒。可你在他蓄势的一瞬看清了——那绵软的掌势底下，一点针尖般的劲，正藏在最深处，只等你松一口气，便要直透心脉。你不去挡那层绵，剑锋径直探进绵势的芯里，硬生生把那枚藏着的针，截在了半途。
  - 绵势溃散。你收剑立定，那一招未尽的针劲，反倒清清楚楚落进你眼底——原来这一招的厉害，全在一个「藏」字：把最狠的针，藏进最软的绵，藏进几十年无人知晓的骨头里，不到生死一线，绝不露锋。你顺着那截未尽的针劲，反手一引，绵里藏针这一招，竟在你手里第一次，从绵到针，走了个圆满。
  - 「……你把针，看出来了。」无名客怔怔望着你的剑，脸上没有败色，倒像了却了一桩心事。他从怀里取出一方素帕，帕上没有字，只一道针脚绣的暗纹，抛给你，「拿去。这一招，得有人接得住绵、看得穿针，才算真解。名下终究要有实——你把江湖的虚实两半，都看全了。」
  - 你接过那方素帕，与怀里那枚止水旧印、那枚凉铜符、那卷鎏金诀，搁在一处。守拙翁托你看江湖走到了哪一步，「虚」的一半在名门，「实」的一半在这荒村——如今两半看全，你总算能回那位守死潭边的老人一句了。野店外，中州再往深、往高，还有更陡的路。你收起素帕，转身推门，一流这一程走到了头，往上的那一程，才刚要起脚。
