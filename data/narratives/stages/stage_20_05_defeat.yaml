id: stage_20_05_defeat
title: 孤城开 · 败
paragraphs:
  - 「差一线。」
  - 刀已经归鞘。门闩纹丝没动。
  - 守关老将站在门下看你。天光落尽了，他的影子跟城门的影子叠在一起，分不出来。
  - 「开门的一手，接的人得空出手来接。」他说，「你手上还攥着东西——攥着来路，攥着怀里那块铜，攥着一路上人家递给你的话。都是好东西。可接这一开的时候，得放下。」
  - 「放下？」
  - 「门开了，你是进门的人。」他说，「进门的人，两手要空。东西进了门再拾起来，一样也少不了。」
  - 他转身走回门下的阴影里。
  - 「回去想想。老夫等了几十年，不差这一晚——墨干了，明日再磨就是。」
