id: stage_13_05_victory
title: 绝顶平台 · 胜
paragraphs:
  - 候峰翁出手了。那一招起得极慢，慢得像云在动——他抬手，满台的云气、云下的群山、四十六年的等待，仿佛都被他这一抬手拢进了剑势里。你忽然看清了：这一招的狠处不在力，在「全」——他把整座山看了四十六年，一剑递出来，山的每一处高低都在他剑里，你往哪儿躲，哪儿就是他先看尽的地方。你不躲了。你也抬起眼，顺着他剑势望向云下的群山——他把山看尽了，可他是坐着看的；你是一路走上来看的。剑锋迎着那一片「全」递进去，递进了他唯一没看过的角落：来路。
  - 云气轰然散开。候峰翁的剑停在半空，你的剑停在他袖前三寸。满台俱静，只有风。老人怔怔望着你的剑，望了很久，忽然笑了，笑声很轻，像落了四十六年的雪终于化了：「原来如此……我把山看尽了，独独没回头看过来路。你替我看见了。」他收剑入袖，从怀里取出一卷素绢，绢上没有字，只画着满纸的山，一笔比一笔低，最低的一笔落在卷尾，「拿去。一览众山，从此是你的了。」
  - 「你不下山？」你接过素绢问。候峰翁重新在石前坐下，把那局残棋一颗颗收进棋盒：「不下了。我等的事，今天等到了。」他抬手指向来路，又指向云外更远的地方，「你看——看江湖的人，走到头，就成了别人要看的江湖。从前是别人留符给你，往后，是你留东西给别人了。绝顶之上没有更高的山，可有比山更远的。往那边去，替我们这些停在山上的，再看看。」
  - 你立在绝顶，来路尽低。怀里的止水旧印、凉铜符，此刻忽然沉了——不是重了，是换了分量：从前它们是前人留给你的路标，从今天起，轮到你了。你把凉铜符取出来，压在峰顶青石之下，符面向着来路。候峰翁看着，点了点头，不再说话，低头重又摆他的棋。云合拢又散开，你在峰顶站成了一块新的路标。
