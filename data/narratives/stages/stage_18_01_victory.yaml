id: stage_18_01_victory
title: 碛口 · 胜
paragraphs:
  - 短棍脱了手，在砂岩上磕出一声闷响，滚到岩壁根下。守哨往后退了两步，撑住岩壁站定，喘了几口，把手上的砂在裤子上抹了抹。
  - 「过。」他说。
  - 就一个字。他弯腰把短棍捡起来，重新在原处坐下，靠回岩壁上，姿势和你来时一模一样。
  - 你从他身边走过去，走出几步，他在背后开了口。
  - 「你刚才有一下没出手。」
  - 你回头。
  - 「我抡开的时候，你本来能进来的。」他说，「你没进，等我棍势老了才进的。」他把棍子在膝上摆正，「东边来的人，十个有九个在我抡开的那一下就抢进来了。抢进来的，都被我砸出去了。」
  - 「有人教过我。」
  - 「沙海里那个？」守哨点了点头，像是早就知道，「那他没白教。」
  - 他把头往西边偏了偏。豁口那一头，白壳一直铺向淡青色的一带，那缕烟就从那里升起来。
  - 「顺着烟走。」他说，「不过路上还有人不让你顺着走。」
