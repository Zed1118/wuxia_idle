id: stage_09_05_opening
title: 符尽之处 · 启
paragraphs:
  - 窄口的另一头，是一片洼地。风到这里忽然停了，静得反常。洼地中央一口枯井，井边坐着个须发皆白的老人，一件洗得发灰的旧袍，手边搁着段辘轳绳，像在这儿坐了半辈子。他身边没有兵器。铜符在你怀里烫到极处，随即，一点一点地，凉了下来。
  - 「符，到头了。」老人没有回头，「北派宗匠铸这枚符，是要有人替北派把这条路走到尽头。你走到了。」他缓缓起身——就这一起身，你半生见过的高手，没有一个是这样站起来的。没有气势外放，没有杀意逼人，只是站起来，天地间却仿佛只剩他一个人还站着。
  - 你握剑的手沉了沉，问他是不是那一位。「我是守井的。」老人淡淡道，「那一位、这一位，都是旁人叫的。我守着北派的根，守了四十年，就等一个到得了这儿的人，来接我这一诀。」
  - 「接得住，你带走。接不住，」他抬眼看你，眼神平静得没有一丝波澜，「你就留在这井边，陪我再守些年月。」他手一抬，掌心空空，什么招式都没有——可你脊背发凉，本能地知道：他一动手，便没有回头。你把这一路的沉、轻、烫、凉，把阴山大碛悟到的全部，尽数提到了剑上。
