id: stage_09_04_victory
title: 黑水绝壁 · 承
paragraphs:
  - 守口人退了半步，撑着石壁，胸口起伏。他低头看了看被剑气逼开的手臂，忽然咧嘴笑了，笑得畅快。「过得了。」他让开窄口，「四十年，第四个。进去吧。」
  - 你收剑要走，他又叫住你。「那位……不好打。」他斟酌着措辞，「他不使兵器，不使花招，一辈子就一手。你尽管把浑身的能耐都拿出来，一次拿完——他不给第二次。」
  - 你谢过他，侧身钻进窄口。石壁夹在两旁，只透下一线天光，脚下黑石凉得刺骨，铜符却烫得像要烙穿衣襟。这一路的沉、轻、烫，到此刻烫到了顶。
  - 窄口的另一头透出光来。你握了握剑，一步跨了出去——碛北最深处，符尽的地方，就在眼前。
