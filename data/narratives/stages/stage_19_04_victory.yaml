id: stage_19_04_victory
title: 关城再叩 · 承
paragraphs:
  - 他退到门洞的阴影里，扶着墙站住，喘了一阵。日头正在往上走，门洞里的阴影一寸一寸退回去。
  - 「经过手了。」他说。
  - 你把怀里那半面镜取出来，摊在掌心。铜面上蒙了一层砂，你用袖子擦了擦，它就亮起来，映着门洞外面那一块方方正正的天。
  - 接关人看了很久，没有伸手去碰。
  - 「三十六年，我头一回看见它。」他说，「守镜人守的是那半面，霸主收着的是这半面。我在中间守门，两头都听说过，两头都没见过。」
  - 「你现在见到了。」
  - 「嗯。」他往后靠在墙上，「跟我想的不一样。我以为会是个了不得的物件。」
  - 「它就是一面镜子。」
  - 「就是一面镜子。」他重复了一遍，忽然笑出声来，笑得肩膀直抖，笑到最后咳起来，扶着墙咳了半天，「好。好得很。三十六年守着一句话，话里说的东西，就是一面巴掌大的破镜子。」
  - 你把镜子收回怀里。
  - 「你要去黑石滩。」他说。
  - 「嗯。」
  - 「合上以后呢？」
  - 你想了想：「不知道。」
  - 「不知道也好。」他从墙边直起身，走回门洞正中，重新背起手，站成你头一回见他时那个样子，「你走吧。这道门今天为往东的人开。」
  - 你走出去十几步，回头看。他还站在那儿，背对着东边的太阳，影子拖得很长，一直拖到你脚底下。
  - 「明天你还站在这儿吗？」你喊。
  - 「站。」他的声音从门洞里传出来，被墙荡了一下，「话说完了，门还在。」
