id: stage_16_03_victory
title: 沙海孤驿 · 胜
paragraphs:
  - 短戟双双插回炕头的土里。行客甩了甩发麻的手腕，神色郑重起来——先前那点散漫收得干干净净：「接得下这对戟的中原人，我头一回见。」
  - 他从火上取下酒坛，倒了两碗，把一碗推过来：「打完了，你是客。」酒极烈，一口下去从喉咙一路烧到胃里，烧出一身热汗——在入冬的沙海里，这是活命的喝法。你喝完，他把你的碗又添满，这一碗不劝，自己抱着坛子喝。
  - 「往西再走两天，出了沙海这一段，就是游骑的地界。」行客抹了抹嘴，「西凉游骑，巡边的马队，不认中原的名号，只认手上的分量。领队的游骑将，使一手快刀——你这样走路的，他隔着一里地就能盯上。」他把碗底朝你一亮，算是礼数，「我能递你的话只有一句：别跑。跑，就输了。站住，接他的刀。」
