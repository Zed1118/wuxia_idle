id: stage_16_03_opening
title: 沙海孤驿 · 起
paragraphs:
  - 戈壁到头，砂就深了。一脚一个坑，风卷着砂粒扑在脸上，生疼——沙海到了。走到日头偏西，砂丘之间忽然露出一角屋檐：一座孤零零的驿站。不是中原的形制，墙是砂土混着红柳条夯的，厚墩墩的，门口挂着一串风干的葫芦，风一过，空空地响。
  - 这是西凉人自己设的驿。推门进去，一铺土炕，一方火塘，火上煨着一坛酒。炕上盘腿坐着一个人，皮裘敞着怀，正就着火烤一张饼，听见门响，头也不回：「东边来的？」
  - 「驿外砂上的脚印，中原人的走法——脚跟太实，吃砂。」他把饼掰成两半，一半递过来，自己咬着另一半，含混地说，「我从凉州城来，回沙海南边的族帐去。你从中原来，往凉州去。一座驿，两头的路，凑一晚。」
  - 吃完饼，他拍了拍手上的渣，从炕头拎起一对短戟，往当地一站：「西凉的规矩——同住一驿，先过手，再喝酒。打完了，你是客；打不完，你是过路的，酒不留你。」他掂了掂戟，咧嘴一笑，露出一口白牙，「东边的功夫讲师承，我们这边的功夫，讲活命。来，让你看看活命的功夫长什么样。」
