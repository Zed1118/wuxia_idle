id: stage_08_03_opening
title: 沙夜袭影 · 启
paragraphs:
  - 入夜，瀚海冷得快。你在两道沙梁夹着的洼地里生了一小堆火，胡杨枯枝烧起来，噼啪作响。火光照出去不到一丈，一丈之外，是漆黑的沙海和满天冷星。你和衣靠着沙坡，剑横在膝上。
  - 三更前后，火忽然矮了一矮。没有风，火苗却齐齐朝一边倒。你睁眼，剑已在手。火堆对面，不知何时坐了一个人——灰衣，风帽压着眉，来时没有一点声息。「两次了。」他开口，声音不高，像沙子从指缝里漏下去，「阴山下一次，这里一次。你追我，追得太紧了。」
  - 「符在你怀里。」他伸出手，摊开，掌心朝上，「拿它没用的东西，给我。我不伤你，你回南边去。」火光跳了跳，你看清他掌缘一线极淡的红痕——是阴山那夜烛影的旧伤。你把剑又按紧了些。符是宗匠所托，他说它该往哪里去，你日后自会知道。不是这里，不是这样给出去。
  - 「不给。」你说。灰衣人收回手，站起来，风帽底下轻轻叹了一声。「那就再来一次。」他袖口一沉，烛影摇红的起手，你在阴山见过——可这一次，是在没有烛火的沙夜里。火堆猛地暗下去。你跃起，剑出鞘。
