id: stage_08_05_victory
title: 残照回风 · 终
paragraphs:
  - 那一卷袖风第三次折返时，你没有追。剑收在身前，脚下钉住，任袖影从面门前卷过去——卷空了。回风之力尽处，是他旧力已竭、新力未生的那一线。你一剑递进去，停在他袖口。
  - 灰衣人整条手臂垂了下来。他看着你的剑尖，看了很久，忽然笑了一声，笑声里没有恨。「前两程你都在追。」他说，「追我的人，都死在这一卷回风底下——它专等追的人。你今夜不追了。」他后退半步，靠着山墙坐下去，「你不追了，我就输了。」
  - 你收剑。残照里，他袖风折返的路数还留在你眼底——起势如退，收势如进，虚实全在一个「回」字。破过它的人，才看得清它。这一手灰袖回风，从今夜起，你也会了。
  - 「坐吧。」灰衣人拍了拍身边的墙根，语气像卸掉了什么，「符你收好。有些话，说给能进碛北的人听，才不算白说。」山影一点点漫上来，残照只剩墙头一线。你在他身边坐下。风又起了，这一次，你听见了。
