id: stage_18_02_opening
title: 沿烟一线 · 起
paragraphs:
  - 出了碛口，那缕烟就一直在正前方。
  - 这是一条极好走的路——白壳平整，没有起伏，只要盯着烟走，一天能走出很远。走了小半日，你发现脚下开始有了别人的脚印，不多，深浅不一，都朝着同一个方向。有人走过这条路，而且不止一个。
  - 再走一程，脚印忽然全断了。断得很齐，像是走到这里的人都被谁拦下来，一起折向了别处。
  - 拦你的人从左边的砂梁上下来，走得很轻，落脚的地方白壳都没碎。他年纪很轻，穿一身洗得发白的短褐，两手空着。
  - 「不能这么走。」
  - 「为什么？」
  - 「因为你走的是直线。」他在你前面三步停住，抬手指了指那缕烟，「这条道，从碛口到城下，直走两天。绕着走，四天。你要是问城里的人，他们都会告诉你绕着走。」
  - 「路远一半，图什么？」
  - 「图见得着。」他说。
  - 你没听懂。
  - 他也不解释，只把手放下来，脚下往旁边挪了半步，正好挡在你和那缕烟之间。
  - 「盯着一个东西直着走过去的人，眼里就只剩那个东西了。」他说，「等他走到跟前，什么也看不见——他把一路上的东西全走丢了，到了地方就只有一个空壳子在那儿站着。这样的人进去，见着了跟没见着一样。」
  - 「所以你拦。」
  - 「所以我拦。」他笑了笑，笑得很和气，「我拦不住急着去的。急着去的都从我旁边过去了，一个个都过去了。可我还是站在这儿。」
  - 他把重心沉下去，两手仍旧空着，只是十指微微张开。
  - 「你要是能把我拨开，我就当你不急。」
