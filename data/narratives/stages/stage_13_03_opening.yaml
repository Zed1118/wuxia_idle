id: stage_13_03_opening
title: 竹林 · 启
paragraphs:
  - 石阶尽头，云散了些，漫山是一片竹。竹子长得极高，风一过，满山的绿一齐俯仰，竹涛声像很远的水。林中小径扫得干干净净，却看不见扫地的人。你走出百十步，前后左右的竹子长得一模一样，来路不知不觉就隐进绿里了。
  - 「再往深处走，就出不来了。」一个声音从竹梢上落下来。你抬头，一个青衣人斜倚在三丈高的竹梢上，竹子被他压得微微弯着，弯出一个极稳的弧。他手里抛着一枚竹果，上上下下，「我在这儿住了二十年。山下的人叫我竹隐客——其实不是我隐在竹里，是竹子把我留下了。」
  - 他轻飘飘落下来，落地无声：「我当年也想去山顶。走到这片竹林，突然觉得不必了——你看这竹子，长到这个高度，就该把锋收起来。越高越要低头，这是竹子教我的。登到高处反收锋，不是怯，是惜。惜这一身的功夫，不愿拿去换山顶那一口冷风。」他抬手，两指一并，隔空点了点你的剑，「你要上去，我不拦。可我瞧你剑上的锋太露——露到山顶，是要折的。我替你收一收。」
  - 你握剑戒备。满林竹涛一静，千百竿竹子一齐低了头，像千百个收住了锋的人。这一关，考的不是你进不进，是你收不收。
