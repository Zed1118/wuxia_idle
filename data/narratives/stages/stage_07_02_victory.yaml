id: stage_07_02_victory
title: 雪压关城 · 捷
paragraphs:
  - 短锤脱手，插进雪里，没到锤柄。哨骑勒住马，没有再冲。城楼上那面旧旗被风卷起，又落下。
  - 「三招……你接下了。」骑手翻身下马，把插在雪里的锤拔出来，「南边那位李掌门飞升的事，连我们这关外都听说了。原以为他门下不过是借了余荫的空架子。」他看你一眼，语气里那点轻慢淡了，「看来不是。往北去吧，阴山脚下的山门，宗匠等着你。灰衣人昨夜也在城外的林子里露过一面——那人的心思，你猜不透，也别去猜。」
  - 你收剑，回望这座雪压的关城。第二战比第一战沉，可你迎上去的时候，握剑的手没有抖。太祖的余荫在雁门关就断了，往北的每一步，都是你自己踏出来的。接掌门户那日压在肩上的那点惶恐，一路的雪把它一层层压了下去。
