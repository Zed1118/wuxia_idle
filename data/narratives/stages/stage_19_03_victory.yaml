id: stage_19_03_victory
title: 黑风口外 · 承
paragraphs:
  - 风忽然停了。不是小了，是整个口子里的风一下子没了，静得能听见砂粒落在岩上的声音。
  - 听风人靠着岩坐下去，喘着气笑。
  - 「打转的风，遇上不打转的人。」他说，「二十年头一回。」
  - 你在他旁边坐下。风又起来了，这一回是往东的。
  - 「那句话，」他忽然问，「留在石阶上的那位，后来去哪儿了？」
  - 「他没往西走完。」你说，「他走到最西边，坐在火堆前，一句话没说，就回来了。回来以后又走了很多年，最后走没了。」
  - 「走没了是什么意思？」
  - 「没人知道。」
  - 听风人点点头，像是这个答案正合他意。
  - 「我年轻的时候在中原听过一件事。」他说，「说是有个背剑的往西去了，一去不回。那时候我以为一去不回是死在路上。现在我懂了——一去不回，是他回来的不是原来那个人，所以算不得回。」
  - 他从怀里摸出一小截芦管，两头封着，中间开了几个孔。
  - 「拿着。风大的时候插在砂里，它自己会响。」他把芦管递过来，「响得准不准不打紧。要紧的是——你听见它响，就知道风在吹；知道风在吹，你才好照旧走自己的。」
  - 你接过来，指头搓了搓，管身被摸得很滑。
  - 「往东再走一日，是关城。」他说，「接关人还在。当年你进关的时候他拦过你一次。」
  - 「他还会拦？」
  - 「会。」听风人闭上眼睛，重新靠回岩上，「他这个人一辈子只做一件事——看什么该过去，什么不该。你进关那回，他看的是你够不够格进去。这一回他看的是别的。」
