id: stage_20_01_victory
title: 旧驿东行 · 承
paragraphs:
  - 缰绳收回去的时候，换马人喘了几口气，把绳头仔细盘好，才抬起头来。
  - 「腿里还有东西。」他说，「不是力气。力气这种东西，走到沙海就该用完了——是别的。是那种……马身上也有。老马识途的那个途，不在眼睛里，在腿里。你这双腿，把整条路都装进去了。」
  - 「站主的枪，缠了新布？」
  - 「你看见枪架了。」他点头，「三十年，那杆枪的布让风磨烂过几茬，他都是拿旧布续。今儿早上走的时候，一整条新的，白得扎眼。我问他，他不说。要我猜——接人跟送人不一样。送人是常事，穿什么都行；接人是喜事，得换身干净的。」
  - 他往东指了指。
  - 「前头两座亭子是空的，第三座边上有烽燧，守烽的在。替我给他带句话——柴再干，也别盼着点。」
  - 「这话什么意思？」
  - 「他听得懂。」换马人重新蹲回马棚边上，拿起刷子，「三十年了，他那堆柴晒了码、码了晒，干得一点就着。干柴是好柴，可好柴的命是不点。他有时候忘了这个。」
  - 你往院门外走。走到门口，他在背后又说了一句。
  - 「灶给你留着火。」他没回头，「站主的规矩——站里灶不能凉。人能走，灶不能凉。等你过了关，这站上的灶，还这么温着。」
