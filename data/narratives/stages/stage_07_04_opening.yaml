id: stage_07_04_opening
title: 灰衣重现 · 启
paragraphs:
  - 松林尽头是一片开阔的雪坡。坡上立着一个人。灰色的长衫，双手空空负在身后，站姿松松的，像一株没有风也会自己晃的旧竹。你一眼就认出他——门中旧档里记过的那个灰衣人，十年前槐树下双手空空的那一个。他没老，也没变。
  - 「新掌门。」他先开的口，声音很淡，「李寒飞升，我在关外听说了。」他偏了偏头，「十年前，我从北派手里取了一门重手，唤作『千钧坠岳』。你往北来，是要替北派讨这门功夫的说法？」他轻轻笑了一下，「那门重手，从来不是我的本事。我不过借它，藏了十年。」
  - 他抬起手。你原以为会看见那门刚猛的重手，可他袖底翻出来的，是另一路东西——阴柔、轻、飘忽，像一支被风晃动的烛火。「今夜给你看的，才是我自己的。」他说。袖影一动，满坡的雪光忽然都暗了一暗——像有谁把一室的烛火，同时压低了半分。
  - 你握紧了剑。这一手阴柔，比北派的重手更难缠——重手你看得见，这一手你看不清它落在哪里。灰衣人的本命，在阴山的雪坡上，第一次朝你亮了出来。
