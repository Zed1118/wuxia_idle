id: stage_07_01_victory
title: 北地风寒 · 捷
paragraphs:
  - 戍卒的拳收住，退了两步，单膝按进雪地。他没有再起手。缠在拳上的布带松了半圈，露出底下磨出老茧的手。
  - 「这剑……是南边那位新起的掌门？」他喘着气，抹了把脸上的雪，「北派的帖子九日前才下，你来得倒快。」他偏头往北一指，「过关吧。往北是云中，再往北是朔方。你要找的重手宗匠，在阴山脚下的山门。灰衣人这几日也在关外露过面——那人，你自己当心。」
  - 你收剑入鞘。北地的风还在刮。这一战赢得不算险，可你心里清楚：没有师父替你挡下一招。师父那句「剑到了一处地方，就要听那处地方的风」，你到雁门关外，才头一回自己去听。风很冷，你却听得比在山门里还清楚一些。
