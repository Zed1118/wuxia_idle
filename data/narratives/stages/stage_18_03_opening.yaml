id: stage_18_03_opening
title: 西凉城下 · 起
paragraphs:
  - 城是傍晚看见的。
  - 你先看见的其实不是城，是墙——一圈土墙，夯得极厚，却不高，比中原随便一个县城的墙都矮。墙上没有垛口，没有旗，没有守兵走动。墙里露出来的屋顶是平的，一片挨着一片，都很低。没有城楼，没有钟鼓，走到这么近了，也听不见一点市声。
  - 你在中原见过的城，隔着三里就能听见。这座城安静得像睡着了。
  - 那缕烟从城中心升起来，到了这个高度已经很淡，可还是笔直的。
  - 城门是开的。门口两侧没有人。只在门洞外的墙根下，坐着一个老人。
  - 他身前铺了一张旧毡，毡上摆着一只粗陶碗，碗里有水。他坐得很端正，两手搭在膝上，看着东边——也就是你来的方向。
  - 你走到他跟前，他抬眼看你，看了很久，久到你以为他要说什么，可他先端起碗喝了一口水。
  - 「坐。」他说。
  - 你在毡边坐下。
  - 「你等谁？」你问。
  - 「不等谁。」老人把碗放回毡上，「等一个答案。」
  - 「什么答案？」
  - 「四十年前我问过一句话，问完就一直坐在这儿。」他说得很慢，「我问的是：一个人在一个地方守着，守到死也没等来人，那他这一辈子算什么。」
  - 你没有答。
  - 「我问的人当时也没答我。」老人说，「他说，你去坐着，坐到有人从东边走进这道门，你自己就知道了。」他抬手指了指城门，「我就坐了四十年。这四十年里，从这道门进去的人不少，可从东边走进来的，你是第三个。」
  - 「前两个呢？」
  - 「第一个是个背剑的。他进去了，出来了，往西走了，没跟我说一句话。」老人的声音里没有怨，「第二个是抬进去的，没能出来。」
  - 他站起身。站起来的动作很慢，可站直之后腰背笔挺，两只手垂下来时，袖子里有细微的一声响。
  - 「所以我还得再问一次。」他说，「你别怪我。我等了四十年，总要看看这一次进去的人，配不配得上我这四十年。」
