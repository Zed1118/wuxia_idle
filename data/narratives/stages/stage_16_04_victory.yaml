id: stage_16_04_victory
title: 大漠游骑 · 胜
paragraphs:
  - 快刀停在半空，刀风散尽。游骑将盯着你看了两息，忽然把刀往鞘里一送，翻身上马：「有分量。」
  - 他抬手一挥，围着的马队应声分开，让出往西的一条道来。「前面一天的路，就是门户关城——西凉的门。」游骑将拨转马头，与你并辔走了几步，声音放平了些，「门下有个人，我们都叫他接关人。霸主座下的老人，在那道门底下等东边来的人，等了几十年。」
  - 「我们这些巡边的，称的是斤两。」他一磕马腹，马队卷着砂尘往北去了，只有最后一句话留在风里，「他称的，是霸主等了几十年的那个分量。过得了他那一刀，你才算真进了西凉。」
