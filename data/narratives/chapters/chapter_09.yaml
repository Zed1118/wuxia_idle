id: chapter_09
title: 碛北
prologue: |
  受降城的北门，过了就没有城了。

  出城那日是霜降，天还没亮透。守城的老卒替他拉开半扇门，望了望门外那片灰茫茫的地，又望了望他背上的剑。
  「客官真要往那儿去？」老卒说，「出了这道门，往北三百里没有井，没有人，没有路。走进去的，老汉守城二十年，没见回来过一个。」
  「我找一个人。」他说。
  「那位？」老卒忽然压低了声音，「城里也有人提起过那位。可提的人都说不清那位是谁，只说——符到得了的地方，人到不了。」
  他没接话，从怀里摸了摸那枚铜符。符还在。

  铜符是北派宗匠临终塞给他的，一路往北，在阴山沉过，在大碛的废寺里轻过。此刻攥在手心，不沉也不轻，只是烫——像揣了一小块没熄的炭。
  灰衣人没有同来。那半桩旧事，那道回不去的门，都留在了大碛的废寺里。临别时灰衣人只说了一句：「符认路，你别认路。往里走，符烫手的地方，就是那一位。」
  他记下了。

  师父李寒当年北行，到阴山折返；灰衣人再往北，到大碛的废寺便走不动了。再往里，是两代人都没踩到过的地方。
  他站在受降城的北门下，朝那片没有路的地望过去。枯黄的碛石铺出去，一直铺到天地相接的那条线，连一株胡杨都没有。
  风是横着走的，卷起碛面的沙，打在脸上生疼。
  他把铜符按在胸口，迈过了那道门槛。
  师父说过，剑到了一处地方，就要听那处地方的风。
  这处地方没有路，可它有风。
  他不怕没有路了。
epilogue: |
  符尽之处，是一片洼地。洼地中央有一口枯井，井边坐着一个老人。

  老人须发皆白，一件洗得发灰的旧袍，手边搁着一段打水的辘轳绳，像在这儿坐了半辈子。他身边没有兵器。
  「符，烫手了吧。」老人没有回头，「北派宗匠铸这枚符那年，我在旁边看着。他说，总得有个人替北派把这条路走到头。走到头，符就该凉了。」
  新掌门把铜符取出来。符还烫着，却已在一点点凉下去，像一块认了主的铁。
  「你就是那一位。」
  「我是守井的。」老人笑了笑，「北派的根不在阴山，不在大碛，在这口井里的一瓢水。守了四十年，总算等来一个到得了的人。」

  老人起身时，动作慢得像不会武功。可就是那一起身，新掌门背上的汗毛全竖了起来——他这半生见过的高手，没有一个是这样站起来的。
  只有一场。没有多余的话，没有多余的招。老人出手即收，收手即定。
  新掌门用尽了阴山、大碛、这一路上悟到的全部，才在那一瞬看清：所谓沉默出手，不在快，在不给对手第二次机会，也不给自己第二次机会。
  他赢了，赢得极险，也极静。

  老人重新坐回井边，像什么都不曾发生。他解下贴身一物，搁在井台上——半卷磨得起毛的旧谱，谱上无字，只有他一辈子沉在碛北的那一诀。
  「拿去。」老人说，「符引你到这儿，你只当这是尽头。可你回头看看——」
  新掌门回头。来路上，他自己踩出的脚印，一串一串，一直延到天边。
  「路是你踩出来的。符的那头不是答案，是又一个开始。」

  下山那日，还是霜降后的天色。铜符凉透了，他没有扔，揣着它，像揣着一段走完的旧路。
  他想起师父那句遗言的后半截，这一次全听懂了：听那处地方的风，不为到某一处地方，是为知道下一步该往哪儿迈。
  受降城在身后，大碛在身后，那一位也在身后。
  身前，是他还没走过的路。
  边塞三程，到此地为止。
  江湖，才刚往深处去。
