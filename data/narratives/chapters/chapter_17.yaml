id: chapter_17
title: 沙海纵深
prologue: |
  过了门户关城，路就没了。

  不是断了，是被埋了。新掌门在关城以西走了半日，脚下的夯土一寸寸变松，最后连「道」这个字都不成立——只剩砂。砂丘一浪叠着一浪，浪脊被风削得极薄，薄到看着像随时会塌；踩上去，果然就塌。他一脚下去陷到膝，拔出来，再一脚，又陷。走出二里地，人已经出了一身汗，回头看，来路上那串脚印早被风抹平了，像谁也没来过。

  他在第一个背风的丘窝里停下来，坐着喘。这一坐，才觉出不对——不是累，是他这一身的本事，在这里忽然不作数了。踏雪无痕的轻功，讲的是借力：借地的硬，借草的韧，借石的棱。可砂没有硬处，没有韧处，没有棱。你越用力，它越让；它越让，你陷得越深。中原三十年练出来的每一分「稳」，到了这里，全成了往下坠的分量。

  天黑得极快。风起来了，砂从丘脊上腾起来，横着走，扑在脸上像细针。他把外袍兜在头上，缩在丘窝里听——沙海的夜里没有别的声音，只有风，从极远的地方推过来，从头顶上过去，又推向更远的地方。中原的夜里总有点什么：更鼓，犬吠，谁家孩子哭。这里什么都没有。大得没有边，静得没有底。

  他忽然想起阳关外那一夜，也是这样的风，也是这样的天。那时他觉得「西边真大」；此刻他才明白，那时看见的还是关外，不是沙海。关外是人退到了尽头，沙海是人根本没进来过。

  也想起了一句更早的话。几十年前有个背剑的人从这条路上走过去，在嘉峪关的石阶上坐了一夜，第二天留下一句：剑到了一处地方，就要听那处地方的风。

  当年读到这句，他当是句气话——剑就是剑，还能听风？如今坐在砂里，风从头顶上一浪一浪过去，他忽然听懂了：这不是气话，是实话，是那个人当真在这里坐过一夜、当真往下陷过、当真把中原带来的那一套试到不管用之后，才写得出来的一句。

  沙海纵深在前面。他把剑横在膝上，等天亮。这一程要学的东西，跟剑没有关系。
epilogue: |
  从最后一道丘脊上望过去，西凉腹地的轮廓在天边浮了出来。

  不是城，还看不见城。是一线更深的黑——沙海到那里忽然沉下去，像一只碗的底。碗底上有极淡的一点烟色，笔直地立着，久久也不散。有人在那里烧火。烧了不知多少年。

  新掌门在丘脊上站着，没有往下走。

  他回头看了一眼身后这一程：砂丘初程上那个把他从半塌的浪脊里拎出来的踏沙客；黑风口里那个替他挡了一整夜风的刀客；沙埋古城里守着一座空城不肯走的老卒；沙海深处那双卷沙的手；还有最后那个人——领路的。一程一程，每个人教他一样东西，最后那个人教的最要紧。

  硬打，打不过。

  这不是认输。领路人那一战他从头到尾没占过一分上风，可他也不是被打败的——是被教会的。天地在这里比人大，你越使劲，它越让；你等它，它反而推你一把。风卷起来的时候不要顶着风走，等风势将歇未歇的那一线，人跟着落下去，比顶着走快十倍。雁阵懂这个道理，所以雁能过沙海；人不懂，所以人陷在砂里。

  他低头看自己的手。指节还在发麻，是接那最后一招时震的。招式已经在身上了，可比招式要紧的是那一线——什么时候该动，什么时候该等。中原三十年教他怎么出手；沙海这一程教他怎么不出手。

  风从身后推过来，还是冬天的风，跟出阳关那夜是同一股。它推着他，一直推到这道丘脊上，此刻还在推。

  黑石上那面铜镜又浮上来。守镜人说，来过一个，没取。他自己也没取。镜子的另一半在西凉深处——如今那「深处」就在眼皮底下了，一线黑，一缕烟。

  故人。接关人说霸主等东边来的故人，这句话他说了几十年。新掌门在丘脊上站到日头偏西，忽然觉得这两个字他还是没想明白——素未谋面的两个人，凭什么算故？还是说，「故」不在见没见过，在走没走过同一条路、在同一个地方陷过同一次砂？

  那就下去问。

  他没有即刻下去。今日不进。这一程学的东西还热着，热的时候进去，容易又想着硬打。等它凉透，等它变成手上的一分稳，再走那最后一段。

  他转身，在丘脊背风的一面坐下来，把剑横在膝上，看那缕烟。烟极淡，极直，一直立到天上去。烧火的人不急。等了几十年的人，不会急在这一天。
