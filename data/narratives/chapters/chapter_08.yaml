id: chapter_08
title: 出塞
prologue: |
  雁门关的门洞朝北，风从洞里灌进来，像一条看不见的河。

  新掌门是清晨出的关。
  没有信使催他，没有战帖逼他——这一程是他自己定的。
  临行前夜，他在山门里那把椅子上坐了一炷香。
  椅子是李寒留下的，他坐了，也就起得来。
  师弟们送到关下，他摆摆手，叫他们回去。
  「门户看好。」他说，「我去去北边。」
  去多久，他没说。师弟们也没敢问。

  怀里那枚铜符，越往北越沉。
  符上的门纹他描过许多遍——是北派的纹路，却比北派山门上那道凿痕更老。
  宗匠说过，灰衣人借走的不止一门重手，还有半桩旧事。
  旧事的另一半在哪儿，符知道。
  出关第三日，他在驿道尽头碰见南来的商队。
  领队的老把式望了望他背上的剑，又望了望他身后。
  「客官一个人？」
  「一个人。」
  老把式咂了咂嘴，没再说话，鞭子一甩，车队朝南去了。

  李寒当年北行，走到阴山就折返了。
  阴山以北，大碛以里，师父的脚印没有到过。
  新掌门站在驿道上朝北望——
  漠南的草原从脚下铺出去，一直铺到天边，枯黄压着残雪。
  风比关内的野，吹得人衣袍贴骨。
  他把铜符按了按，迈开步子。
  这一程，连师父的旧路都没有了。
  路要他自己踩出来。
epilogue: |
  大碛尽头那座废寺，连匾都没有了，只剩半堵山墙挡着风。

  灰衣人坐在墙根下，袖口垂着。
  那一手「灰袖回风」被破之后，他没有再起手。
  「你不追了。」他说，「我就输了。」
  这话旁人听不懂，新掌门听懂了。
  这一路他追了五程，愈追愈紧，愈追愈空。
  直到残照里那一卷袖风折回来，他忽然收剑不动——
  风要折返，由它折返，他只守自己那一寸。
  就是那一停，破了灰衣人藏了半生的本命。

  「北派逐我出门那年，我十四岁。」灰衣人说。
  他说得很慢，像在数墙缝里的雪。
  「他们说我练不得刚猛，骨头是阴柔的骨头。
  我偏要拿一门最重的重手给他们看。
  拿到了，藏了十年，还是练不成。骨头骗不了人。」
  他抬眼望北。
  「大碛再往里，还有一位。北派的根不在阴山，在那位手里。
  我到不了那儿——符在你怀里，你到得了。」

  新掌门取出铜符。
  符不凉了，也不沉了，轻得像一片干透的胡杨叶。
  他忽然想起师父那句遗言——剑到了一处地方，就要听那处地方的风。
  在阴山，他听懂了前半句：师父的风是师父的，他的风要他自己听。
  在这座废寺，残照压着雪，风一丝也无。
  他听懂了后半句：
  风不来的时候，不追，不赶，守着自己那一寸站定——
  站定了，自己便是风。

  灰衣人留在了废寺，守他回不去的门。
  新掌门把铜符收进怀里，朝大碛更深处望了一眼。
  那一位，在符的那一头。
  下一程，连路都没有了。
  可他已经不怕没有路了。
