id: chapter_13
title: 山外青山
prologue: |
  荒村野店的油灯还在身后亮着，新掌门已经走出了中州的地界。怀里两枚旧物——止水旧印、凉铜符，贴着三卷真解：止水诀、鎏金诀，还有新得的那卷绵里藏针。虚与实两半，他都在名下看全了；可守拙翁要问的「哪一步」，他越答越觉得，答案不在身后，在前头的山上。

  中州再往深、再往高，官道断了，只剩下一条被草埋了半截的樵径。行路人说，那条路通的是绝顶——几十年没人上去过，也没人下来过。从前他循着别人留下的符走江湖，一枚符一段路；这一回，没有人给他留路标，往上的路，得他自己起脚。

  他把两枚旧物按了按，进山。山外的山比中州的高，高得看不见顶。他忽然明白，看过江湖的人，迟早要走到江湖外面去看一看——而那上面等着什么，谁也说不清。
epilogue: |
  候峰翁收了一览众山，绝顶平台上的云慢慢合拢，又慢慢散开，像几十年的等待轻轻吐出一口气。

  新掌门立在峰顶，来路尽低。他想起这一路：山脚茶棚里只讲不出手的老把式，半山寺里知足的知客僧，竹林里藏锋的隐客，断崖上拦路的守关人——他们都是走到某一步便停下的人，停得各有各的道理。而峰顶这位老人，登到了最高处却不走，坐了几十年，只为等一个走得上来的人，把下一程亲手交出去。守拙翁守死一地，困在旧路里；候峰翁守到绝顶，把路守成了活的。同样是等，一个等成了困，一个等成了传。

  他摸出怀里那两枚旧物。从前他是接符的人——止水印、凉铜符，都是前人留给他的路标，引他一段一段走到今天。此刻峰顶无人再给他留符，他却忽然想把什么留下来。老人说得对：看江湖的人，走到了头，就成了别人要看的江湖。他把那枚凉铜符压在峰顶的石下，符面向着来路——往后若还有人走得上来，这便是他留的第一段路。

  云开处，群山之外还有群山。老人说，绝顶之上没有更高的山了，可有比山更远的东西。他把空了一半的怀里按了按，转身望向老人指的方向——成为江湖的人，脚下的路才刚起了个头。
