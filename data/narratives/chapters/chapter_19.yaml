id: chapter_19
title: 旧路照人
prologue: |
  往东走的头一天，他一直在回头。

  不是舍不得。是这条路他刚走过一遍，方向一掉，全变了样。来时迎着风，砂子扑脸，人只能低着头，看得见的只有脚尖前面那一小块地；如今风从背后推着走，脸抬得起来，先前一段一段捱过去的路，忽然连成一条，一直铺到天边上去。同一片戈壁，走两遍，第二遍才看清它长什么样子。

  他想起在丘脊上看的那缕烟。看了三天：头一天看的是「那底下是谁」，第三天看的是「那个人今天又添了柴」。路也一样。头一遍走的是「前面还有什么」，回头这一遍走的，才是「我是怎么过来的」。

  怀里那半面镜贴着肋骨，走一步硌一下。霸主递过来的时候没交代要他做什么，只说了一句「所以现在给你」。他试过举起来照——镜太小，又只有半面，里头装不下一整张脸，缺的那半边是空的，空得很齐整，像被谁按着一条线掰下去的。

  第二天他就不回头了。回头没有用：要看的东西不在身后那几里地里，在整条路上。而整条路，得走完才看得见。

  这一路上他遇见了几个人。都不年轻了，都在这条道上待了很久，都不是拦他去路的意思——是来看一看的。看东边来的那个人，如今往东回去，还是不是同一个人。
epilogue: |
  两半镜合上的时候没有声音。

  他原以为会有的。铜跟铜碰，总该响一下。可那两半贴上去，就那么严丝合缝地贴住了，连一道缝都看不出来，倒像它本来就是整的，中间那道线是后来才有人画上去的。

  合上的镜子照出一张脸。是他自己的脸，风砂刻过，比出关那年老。他把镜子转了转，让它对着西边——镜里是戈壁，是黑石，是一路过来的砂；再转向东——镜里是同一片戈壁，同一片黑石，同一路的砂。

  他这才明白守镜人守的是什么。镜子搁在黑石上几十年，镜面朝天，谁也不照，就那么亮着。它等的不是一个来取它的人，是一个能被它照全的人——照得出来路的人。来路要够长，长到镜子里装得下；也要够整，整到从哪一头看过去都是同一条。

  他把镜子收进怀里，往东。前面是阳关。四十年前有个背剑的从那道关门出去，一路向西，没有回头；后来他从同一道门出去，也一路向西。如今他要从那道门回去——这条道上，他是头一个走回去的。

  关那头是中原。中原那头，还有嵩山，还有昆仑。他忽然有点想笑：霸主说人间的路走到头，剩下的那一段不在东西南北里。可他这两天走的分明是正东。

  也许那一段本来就不在别处。往东走的这条路，跟当年往西走的那条，是同一条；走的人不一样了，路就不是原来那条了。所谓不在东西南北里，是说它不在地上——它在走过的人身上。
