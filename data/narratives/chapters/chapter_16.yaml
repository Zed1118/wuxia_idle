id: chapter_16
title: 凉州词
prologue: |
  关门在身后合拢的那一声，走出半里地还听得见。

  新掌门在关外的戈壁上走到天黑。回头望，阳关的城楼已经缩成天际线上一个小小的黑点，关墙上的灯火次第亮起来——那是中原最西边的灯火。灯火以西，就没有中原了。他站了一会儿，把这排灯看进眼里，然后转身，朝着没有灯的那半边天走。

  风变了。出关之前，风里还有秋的余温；出关这一夜，风忽然就硬了，带着砂，带着冰碴子的凉——西边的冬天来得早，不打招呼。他把外袍紧了紧，寻了块背风的黑石，在石后生起一小堆火。火光扑扑地跳，照亮脚边一小圈砂地，再往外，是一整片望不到边的黑。

  火光里他想起守关老将的话：替老夫，也替这座关，看一眼西边如今的样子。西边如今的样子——他抬眼望，夜色里的戈壁一直铺到看不见的地方，没有山，没有树，没有一点人间的轮廓。大，静，冷。中原的江湖是人挤着人的，庙堂、山门、擂台、市井，一层挨着一层；西边的江湖，先是天地，再是人。人在这样的天地里，声音要放低些——不是怕，是不必。

  凉州在前面。几十年前有人走过这条路，一路向西，没有回头。如今这条路上又多了一个人。火堆哔剥响了一声，他添了根柴，把剑横在膝上。明天起，一程一程，把西边走出来。
epilogue: |
  门户关城在身后了。这一次，身后的门没有合拢——西凉的门开着，风从门洞里穿堂而过，吹向更西的地方，像是替关城送客。

  新掌门站在关城西侧的高坡上回望。东边，阳关早已沉在天际线底下；黑石滩此刻也看不见了。但他记得那面铜镜——巴掌大的一面，镜背缠枝纹被风砂磨浅，镜面朝天，搁在黑石上，几十年风砂，居然没有磨花。守镜人说，来过一个，没取；今天第二个，也没取。

  不取的理由，他想，应该不一样。当年那人不取，是走得急——剑往上走的那段路刚到头，他急着去看更远的地方，一面镜子，来不及懂。如今他不取，是懂了——那面镜子不是一件东西，是一句话。话要等说话的人亲口说，东西要等主人亲手给。隔着几十年，他替那个背剑的人，把这句话听懂了一半。剩下的一半，在西凉深处。

  接关人放行时说的话还在耳边：霸主在西凉深处等，等东边再来一个故人——这句话，他说了几十年。故人。新掌门咀嚼着这两个字。他与霸主素未谋面，算不得故；可这条路上的每一程——驿道尽头的枪，黑石上的镜，孤驿里的酒，门户关下的刀——都像是几十年前就备好了的，专等一个东边来的人，一程一程收下去。等的年头足够长，来的人就是故人。

  或许在那位看了中原几十年的人眼里，肯把这条路走完的，就是故人。

  往西，沙海铺向纵深，砂丘一浪叠着一浪，一直叠进天里。凉州词里唱过的地方——长烟，落日，孤城，如今都到眼前来了。入了冬的风从身后推着他。下一程，沙海纵深。
