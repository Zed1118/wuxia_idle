id: chapter_21
title: 绝顶交程
prologue: |
  官道往东，一程比一程热闹。

  出了阳关是砂，过了砂是土，过了土，路两旁开始有田。田里有人直起腰看他，看一眼又低下去——在这条道上，一个风尘仆仆往东走的人不算稀奇。稀奇的是他走得慢。他不赶路了。几十年里他没有一天不是在赶路，如今关在身后合上了，他忽然发觉自己有的是时间。

  潼关。黄河。嵩山。三个名字，他年轻时听人说起过，后来自己一个一个走过去，如今又要倒着走回来。来路铺成去路，去路又铺回来路——他忽然想，一条路走两遍，第二遍走的其实是自己。

  怀里那面镜合着，贴着肋骨，温的。

  再往前，官道会断。断在中州最深的地方，剩下一条被草埋了半截的樵径，通着一座没有名字的山。几十年前他从那条径上去过一次，在绝顶见了一个等了半辈子的老人。老人把下一程交到他手里，然后就走了。

  他在那块石头下面，压了一枚铜符。

  符面朝着来路。
epilogue: |
  少年下山那日，天很好。

  他把符收在怀里，走到山道口又回头，问了最后一个问题：「前辈在这儿等了多久？」

  他想了想。从上山那年算起，其实并没有多久——真正在等的那些年，是走在外面的那些年。他没有这样答，只说：「不久。你比我想的来得早。」

  少年下去了。山道拐了三拐，人就看不见了。

  他一个人在绝顶上坐到黄昏。云在脚下合了又开，来路群山依旧低。候峰翁当年说，绝顶之上没有更高的山了，可有比山更远的东西。那时他不懂，只当是老人不肯明说的谜。今日他懂了：远的不是山，是人——一个人走到头，路就断在他脚下；把路交出去，路就还长着。

  他把身上几样东西一一解下来，摆在石上：剑、镜、旧铜符的印子还留在石底的凹处。风从东面来，掠过平台，把云推开一线，露出极远处一点雪白——那是昆仑的方向。四件物事还在那儿，雪埋了一半，替他压着另一段没走完的路。

  霸主说过，人间的路走到头，剩下那一段不在东西南北里。他坐在绝顶上，头一次不急着知道那一段在哪里。门在那儿，什么时候推，是他自己的事。

  山下有人在往上走。

  一年比一年多。
