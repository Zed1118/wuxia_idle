id: chapter_18
title: 阳关故人
prologue: |
  他在丘脊上坐到第三天，才下去。

  头两天他没有想什么大事。饿了嚼一口干粮，渴了抿一口水，剩下的时间就看那缕烟。烟每天早上起来，笔直地立到天上，到傍晚淡下去，第二天照旧。看到第三天上午，他忽然发觉自己看烟的心思变了——头一天看的是「那底下是谁」，第三天看的是「那个人今天又添了柴」。前一个念头急，后一个念头不急。他知道可以下去了。

  下坡比上坡难。砂在脚底下松，人往下走，砂也往下走，走两步滑一步，越想稳住越滑得快。他试了几回，最后索性不稳了——脚往下探，砂垮下去，他顺着垮下去的那股劲往下滑一段，脚尖在滑势将尽的时候一点，再探下一步。这样反倒又快又省力。滑到坡底回头看，一道浅浅的痕从丘脊一直拉到脚下，像谁用手指在砂上划了一笔。

  碗底比在上面看着大得多。上面看是一线黑，下到底才知道那是一整片沉下去的地——地面结着盐一样的白壳，踩上去咔咔地碎，碎壳底下是暗红的土。风到了这里忽然小了，被四面的丘挡住，只在头顶上呼呼地过，人站在底下听得见风，却吹不着。安静得有点不像话。

  他站着听了一会儿，忽然明白了那缕烟为什么能笔直地立那么久——这里没有风。几十年前有人挑了这么个地方生火，多半也是因为这个。

  往前走。白壳一直铺出去，远处有淡青色的一带，是那圈土墙。烟就从墙里头出来。

  从东边来的路，到这里只剩最后一段了。他把外袍解开又系紧，试了试腰上的剑，然后想起自己这一路上其实很少拔剑——中原那三十年练的东西，出了阳关以后一件一件都不管用，到沙海里连站都站不稳。他倒也不觉得可惜。不管用的那些，本来就该在半路上放下。

  只有一件事还没有着落。故人。

  接关人说了几十年，领路人临别时又说了一遍，可这两个字他到现在也没想明白。素未谋面的两个人，凭什么算故？他一路走一路想，想到的答案都不牢靠——走过同一条路算不算？在同一处地方陷过同一次砂算不算？都像是，又都差一点。

  差的那一点在哪儿，大概要见了人才知道。

  烟在前面。他往烟那边走。
epilogue: |
  火堆很小。

  比他想的小得多。三块石头围着一小堆炭，火苗只有半个巴掌高，风到不了这里，所以它一直那么烧着，不旺也不灭。霸主坐在火堆边，把一根新柴推进去，火舌舔上来，噼地响了一声。

  「烧了多少年？」他问。

  「记不清了。」霸主说，「起头是为了取暖，后来是为了让东边看得见。」

  他在火堆对面坐下。刚打完的那一场还在身上，指节发烫，气息浮着，可心里出奇地静——比这一路上任何时候都静。

  霸主从怀里取出一样东西，摊在掌心上。是那面小铜镜的另一半。巴掌大的一面，缠枝纹从断口处接着延过来，与黑石上那半正好合成一整枝。

  「这半在我这儿。」霸主说，「那半在黑石上，搁了几十年，风砂没磨花它。」

  「我见过。」他说，「我没取。」

  「我知道。守镜人跟我说了。」霸主把镜子递过来，「所以现在给你。」

  他没有立刻接。他想起了昆仑山顶那件事——也是这个人，对着他师父，把剑插回鞘里，说了四个字：无物可赠。

  「我师父，你什么也没给他。」

  「他不需要。」霸主说，「他那时候已经到了不需要东西的地方。我拿什么给他都是累赘，所以我什么也没给——那不是舍不得，那是给不着。」火光在他脸上跳，「你不一样。你还在路上。路上的人手里得有点东西，不然走着走着就忘了自己为什么走。」

  他伸手，把那半面镜子接了过来。凉的，比火堆边的空气凉。

  「另一半我不去取了。」他说。

  「不必取。」霸主往火里又添了一根柴，「镜子本来也不是给你照人的。两半分在两头，才叫得住两头的人各走一趟。你走了这一趟，那一趟当年也有人走过——现在这两趟接上了。」

  他低头看掌心里的半面铜镜，忽然就把那两个字想明白了。

  故人不在见没见过。故人是：有一个人在很远的地方，为了一件跟他自己没什么关系的事，等了几十年；而另一个人，隔着几十年，把那件事走完了。等的和走的对上了，就是故。

  师父当年也走到了这里，可他没把这一趟走完——镜子搁在黑石上，他从旁边过去了，急着去看更远的地方。他带回中原的是那三句话，不是这半面镜子。如今镜子交到手里，意思是：他没接上的那一头，有人替他接上了。

  「西出阳关无故人。」他念了一遍那五个字。

  「那是我起的名。」霸主笑了一下，是这一夜里第一次笑，「起的时候我三十岁，站在关外往东看，看了半年没看见人。就以为这辈子都不会有。」

  「现在呢？」

  「现在这名字得改一个字了。」霸主说，「不过招还是那个招。名字改不改，招都在你身上了。」

  火烧得矮下去。霸主没有再添柴。

  他在火边坐到天快亮。东边的天先白起来，白到能看见土墙的轮廓时，他站起身。腰上的剑还是那柄剑，怀里多了半面镜子。走出去几十步，他回头看了一眼——火堆前那个人还坐着，没有送。

  往东回去的路很长，可他知道自己不会立刻往东。

  西边到这里就到头了。人间的路走到头，剩下的那一段，不在东西南北里。他抬头看了看天——天还是那么大，可这一次他不觉得压人，只觉得远。

  远，也是要一步一步走的。
