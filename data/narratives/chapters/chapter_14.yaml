id: chapter_14
title: 山外来客
prologue: |
  凉铜符压在峰顶石下的第七天，新掌门在半山古寺里安顿下来。晨钟暮鼓，云起云落，他每日登台一次，看一眼符面朝向的来路——从前他循着别人的符走江湖，如今他自己成了留符的人，便想守一守这条路的头一段，等第一个走得上来的人。

  等来的人没有走上来。是先骑着马来的。山下官道断处，马蹄声在山道上敲了三天，不急不缓，像有人拿鼓槌一下一下叩山门。寺里知客僧上山回话：西凉来了一支马队，百人百马，停在山脚十里外，不入村镇，不扰行旅，只派了一个信使上山递话——他家主人听闻中原绝顶换了新人，万里而来，借山一战。

  新掌门想起候峰翁的话：绝顶之上没有更高的山了，可有比山更远的东西。他原以为自己总要下山去寻那个「远」，却不曾想，他站定的这些日子，「远」先找上门来。他整了整衣冠下山。知客僧送他出山门，低声问：「客人万里而来，掌门应是不应？」他望着山道上被马蹄新踏出来的印子，答道：「人家递了三天的锣，没有一锣敲错地方——是懂礼数的远客。懂礼数的拳头，更要好好接。」

  成为江湖的第一课，原来不是走出去，是站住了，接住循名而来的拳头。从前他循符而行，见山开山；如今他立在山门之内，山外的江湖，倒要先来称一称他这个「留符人」的分量。
epilogue: |
  马战宗师把十荡十决留下，牵马下山。百人百马在山脚列队，来时三天三夜的马蹄声，去时只有一阵，转眼出了山口，像一阵风退出了这座山。

  新掌门将那卷杀法贴在怀里，与止水诀、鎏金诀、绵里藏针、一览众山放在一处。五卷真解，五段路，如今多了一段从山外来的。宗师临行勒马回望，只说了一句话：「你这样的身手，西凉不是没人想见——阳关外头，还有一位比我老得多的人，看了中原几十年。」马队远去，这句话却留在了山上，比马蹄声更沉。

  他回到峰顶，石下的凉铜符还在，符面仍旧向着来路。可他忽然发觉，自己看山的眼睛变了：从前看山，看的是高低；如今看山外，看的是远近。群山之外还有群山，群山之外，还有关山万里——阳关外的老者、西凉的马队、比山更远的整个江湖，都在那条路的尽头等着。

  候峰翁说，成为江湖的人，脚下的路才刚起了个头。他把怀里的真解按了按，转身望向西方。云开处，关山如黛，一程比一程远。这一回，不是远客来叩山了——是他要下山，去赴那个更远的约。

  临行前，他又登了一次峰顶。石下的凉铜符静静压着，符面向着来路，等下一个走得上来的人。他忽然明白，留符人不是守山人——符留在这里，路却要往前走。候峰翁守到绝顶，把路守成了活的；他要做的，是把这条活路，再往外送一程。

  下山那天，半山古寺的钟敲了三声。知客僧问他还回来么。他望着西去的官道，笑了笑：「回来。山在这里，符在这里，走多远，都得回来。」说罢整衣西行。山门外，秋风初起，万里关山的头一程，从他脚下开始。
