id: chapter_11
title: 名门之虚
prologue: |
  往中州腹地走了半月，新掌门怀里多了一样东西——守拙翁抛给他的那枚止水旧印，与那枚凉透的铜符搁在一处。一枚是走完的边塞旧路，一枚是守死一地的老人托付的念想。两样都凉，却都压在心口，沉甸甸的。

  越往里走，「名门」这两个字听得越多。中州腹地不比边塞，这里没有马贼，没有隘口，有的是一座座传了几代的门户、一场场排场极大的剑会、一家家挂着金字招牌的镖行。路边随便一个茶棚，都有人绘声绘色地议论某家少门主剑法通神，某位老前辈四十年前如何名动一时。名头一个比一个响，听得人心头发怵。

  可走得近了，新掌门渐渐咂出别的味道来。许都的剑会外场上，那些自称名家的，招式花团锦簇，中看不中用；金鼎门的后辈，仗着祖上留下的一块匾额行走江湖，自己一手剑却稀松平常；洛阳的榷场里，竟有人拿银子和交情，硬生生堆出一个「名震一方」的名头。

  守拙翁守死一地，是一种踏不出去的困；这中州名门，名头响得震天，本事却未必配得起——这又是另一种。老人临别那句话又在耳边响起：替我看看，这潭水外头的江湖，究竟走到了哪一步。他此刻看见的，是满江湖的名头，和名头底下参差不齐的真章。

  名，是旁人给的；本事，是自己练的。这两样，在中州这地界，隔着的距离，比他先前想的要远。他把两枚旧物按了按，一步步往那些金字招牌的深处走去。
epilogue: |
  鎏金公收了手，那一身唬了中州半世的威势，也随着问鼎台上的金光一起黯了下去。

  新掌门收剑站定，忽然想通了这一路见过的所有名头。剑会外场那个花架子，金鼎门那块吃老本的匾额，榷场里拿银子堆起来的虚名，还有眼前这位名震一方的老名宿——他们都有响亮的名，却都在名底下空着一块。鎏金公的鎏金诀是好招，可他练了大半辈子，练的始终是那层镀在面上的金，不是金底下的骨。名是真名，本事却是虚的。

  他想起守拙翁。老人守死一地是虚，这些名门徒有其名也是虚——一个困在自己走过的旧路里，一群困在旁人给的名头里，殊途，却一样迈不出那一步。破过鎏金诀，新掌门才真懂了：名头压在人身上，练招的人得先担得起它，招才作数；担不起，名越大，人越空。

  这中州名门的深浅，他算是看到底了。看到底，心里反倒空落落的——满江湖的名，他见了个遍，却还没见过一个名副其实、真把本事练到骨子里的人。守拙翁托他看江湖走到了哪一步，他如今看清了「虚」的这一半，便格外想去寻另一半：这满是虚名的江湖里，究竟还有没有「实」的东西。

  他把止水旧印和那枚凉铜符重新收好，转身走下问鼎台。台下是中州更深、更远的去处。名的这一程走完了，往下，他要去找的，是配得上名头的那点真章。
