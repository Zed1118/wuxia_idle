id: chapter_20
title: 东入阳关
prologue: |
  往东走的第三天，他踏上了驿道。

  夯得结实的官道从关门底下伸出来，笔直往西——他是从西头走上来的。道旁十里一座驿亭，越往东，亭子越新：先是四根柱子顶着半个棚，后来有了完整的顶，再后来，亭柱上漆过的地方还辨得出淡淡的红。他一路走，像把一条旧路从头到尾翻新了一遍。其实路没有变，变的是方向。

  怀里的镜不硌了。两半合上的那天起，它就是圆的，贴着肋骨，走再远也只是温温的一块。起先他还常常伸手按一按，后来不按了——它长在那儿了。

  出关那年他走过这条道，记得的是逆着走的它：风顶着脸，亭子一座比一座破，走到最后一座，有个老卒平举长枪，送了他最后一程。顺着走回来才看见，驿道每一座亭子的门都朝东开。修路的人打一开始就知道，这条道上的人多数往西去；亭门朝东，是给回来的人留的——尽管几十年里，回来的人一个也没有。

  他会是头一个。
epilogue: |
  关门在他身后合拢的时候，天刚黑透。

  这一声他听过一回。那一年这一声在他背后响，声音往西追了他半里地——关替他把中原关上了。今日这一声还是这一声，他却是站在门里头听的。同一扇门，两面听，声音不一样：外头听是送行，里头听，是收留。

  老将把那本册子收进了门房。册子上今日添了一笔，销了一行半。销整行的是他自己；销半行的那个人不回来了，话回来了。老将说这就算清了。他想，账清不清，原来不看两讫，看的是记账的人肯不肯搁笔。

  关内驿站的灯亮着。灯火往东，一盏接一盏，接到看不见的地方——中原的灯是一层挨着一层的，一直挨到嵩山脚下。他在灯下坐了很久。西边没有灯。西边的夜里，有一面镜子朝着天，替满天星子亮了几十年；有一堆柴码得整整齐齐，三十年没点过；有一座城，城心一缕烟，笔直。那些都不是灯，可他一样一样想过去，竟觉得比这满道的灯火还亮些。

  往东，官道通向中原腹地。潼关，黄河，嵩山——来路的最后一段，一程一程铺回山门去。霸主说，人间的路走到头，剩下的那一段不在东西南北里。他走在正东的官道上，却头一次觉得离那一段近了：路走完的时候，走路的人得把路放下来，搁到别人肩上去。放下来的地方，不在东西南北里。

  在山上。
