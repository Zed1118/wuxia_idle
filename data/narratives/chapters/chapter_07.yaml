id: chapter_07
title: 北望
prologue: |
  李寒飞升那一夜过后的第九日，山门里那把旧椅一直空着。

  大弟子每日照旧扫院、喂马、开山门。
  椅子他不去坐。剑他不去动。
  师弟们唤他一声「掌门」，他应，
  应过之后总要顿一顿——那两个字压在肩上，比一柄剑还沉。
  他今年二十有六，随师父学了十一年。
  论剑、论内力、论那三句遗言，他都听师父讲过。
  可师父走的那条路，是师父自己走出来的。
  ——他还没有自己的那一条。

  第九日午后，山下来了一名北地口音的信使。
  信使递上一封素笺，笺上只一行字：
  「闻贵派新立掌门，北派重手一门，欲上山讨教。」
  落款是雁门关外一处旧宗门的印。
  师弟们围过来看，神色都有些不安。
  大弟子把素笺收进袖里，站在空椅前立了半晌。

  他知道这封信的由头。
  师父飞升，本门声名一夕之间传遍江湖，北地也听见了。
  木秀于林。有人要来试一试这片新起的林子扎得稳不稳。
  ——试的其实不是本门，是他这个新掌门。

  当年师父离山北行，一路听过西凉的风、中州的风、昆仑的风。
  三处风听完，他就走进了化境。
  大弟子把师父那句「最后那一段路要自己走」在心里念了一遍。
  他忽然明白：师父把路走完了，可师父没有替他走。
  他这一程要去的地方，师父从没到过——
  那是更北的关外，雁门以北，云中、朔方、阴山一线。
  师父的余荫照不到那么远。
  过了雁门关，就只剩他自己。

  他没有坐那把椅子。
  他把师父留下的剑取下来，背在身上，朝北走了一步，又走一步。
epilogue: |
  阴山脚下那一战过后，北派山门的檐角还在落雪。

  北派重手宗匠退到石阶上，那柄「千钧坠岳」的重手，此夜第一次没有压住人。
  他没有把这门功夫的来历再瞒下去。
  ——十年前，这门重手被一个灰衣人夺了去。
  今夜灰衣人先一步在关外现了身，用的却不是这门刚猛，而是他自己那一手阴柔。
  两条线在阴山交叉，又各自散开。
  宗匠从怀里取出一枚旧铜符，符上刻着北派的门纹，递了过来。
  「新掌门，这枚符你收着。」他说，「它该往哪里去，你日后自会知道。」

  新掌门接过铜符。
  符很凉，凉得像雁门以北的风。
  他没有像师父那样把物件放下——他把它收进了怀里。
  这一程他不是来放下什么的，是来拿起什么的。

  他站在阴山脚下，回想这一路：北地的风寒、雪压的关城、山道里的伏影、
  灰衣人重现时那一手烛影、宗匠那一记千钧压顶。
  一处一处，都不是师父替他挡下的。
  师父三句遗言里那一句「剑到了一处地方，就要听那处地方的风」，
  他到这一刻才算听懂了半句——
  师父听的是师父的风，他要听的，是他自己的。

  空椅还在山门里空着。
  他知道回去之后，那把椅子他可以坐了。
  ——不是因为他接了师父的位子，
  是因为他这一程，头一回没靠师父的余荫，自己赢了下来。

  怀里那枚北派铜符轻轻一沉。
  它指着更北的地方。
  那地方师父没去过，他也还没去过。
  下一程的风，在符的那一头等着。
