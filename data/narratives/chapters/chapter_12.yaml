id: chapter_12
title: 名下之实
prologue: |
  问鼎台的金光散尽，新掌门走下中州名门的最后一级石阶。怀里那枚止水旧印、那枚凉铜符，又添了一卷金漆斑驳的鎏金诀剑谱。三样东西压在一处，他心头却比先前更空——满江湖的名头他见了个遍，竟没见着一个名副其实、把本事练进骨子里的人。

  守拙翁那句托付又在耳边响起：替我看看，这潭水外头的江湖，究竟走到了哪一步。「虚」的这一半，他算是看全了；可老人要看的是「哪一步」，不是「哪半步」。他想去寻另一半——这满是虚名的中州，究竟还有没有「实」的东西。

  于是他没有回头，反倒往名门够不着的地方走去：没有金字招牌的渡口，没有排场的陋巷，没人吆喝的山道。名是旁人给的，本事是自己练的；他先前在名门堆里寻本事，寻错了地界。真章若还在，该在那些无人抬举、也不图人抬举的角落里。他把三样旧物按了按，一步步走进中州最不起眼的深处。
epilogue: |
  无名客收了那一招绵里藏针，荒村野店的一盏油灯晃了晃，又稳稳亮着，像什么都不曾发生过。

  新掌门收剑坐下，忽然把这一路的虚实两半，都想通了。中州名门那一程，他见的是有名无实：剑会的花架子、金鼎的旧匾额、榷场买来的名声、鎏金公镀在面上的那层金。荒村野渡这一程，他见的是有实无名：撑篙翁的篙、巷陌拳师的拳、挑山客的担、守炉铁匠的锤，还有眼前这位连姓名都不肯留下的人。名与实，在江湖上原是两回事——名门把名扛在肩上，压得人越来越空；这些无名的人把本事种进骨头里，不图人知，脚下反倒沉甸甸的踏实。

  他想起守拙翁。老人守死一地，是把自己困在走过的旧路里；这无名客不图名头、不守一处，却把守拙翁没走通的那一步，悄没声地走全了。一个是守拙的困，一个是守拙的成，殊途，却都在这个「实」字上照见了彼此。守拙翁托他看江湖走到了哪一步，如今虚实两半看全，他总算能回那位老人一句：走到了「名下终究要有实」这一步。

  野店外是中州再往深、再往高的去处。一流这一程，从循符入中原，到看破名门虚实，他走到了尽头。往下的路更陡，那两枚旧物、这几卷真解，他还得带着，替一个守死在潭边的老人，接着往上看。
