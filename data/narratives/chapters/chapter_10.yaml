id: chapter_10
title: 中州
prologue: |
  受降城南下的第三日，铜符彻底凉了。

  新掌门贴身揣着它，像揣一段已经走完的旧路。阴山、大碛、碛北，符烫过的地方在身后连成一线，一线之外，是他没有再回头的边塞。守城的老卒说过，往北走进去的，没见回来过一个。他回来了，还带回了那一位压在井底四十年的一诀。

  越往南，人越多。碛石换作黄土，黄土换作青石板，风里头一回有了炊烟和市声。他走过榷场，走过驿站，走过一座座从前听都没听过的镇子，听人议论中州的剑会、洛阳的镖行、嵩山脚下几家彼此看不顺眼的门户。江湖这两个字，在边塞不过是风沙里一个模糊的方向，到了这里，忽然又近又杂——近得他一时竟不知该往哪儿落脚。

  铜符不再烫了。它不再替他认路。符引他到过尽头，剩下的路，得他自己认。

  他想起下山时那一位说的话：符的那头不是答案，是又一个开始。当时只当是句宽慰，此刻走在陌生的青石板上，才咂出别的意思来。师父北行，到阴山折返；灰衣人再往北，到大碛便走不动了；他自己走到了符尽之处。可符尽之后的这片江湖，师父没来过，灰衣人没来过，那一位守着一口井，也从没出来过。

  再往前，是三个人都不曾替他探过的路。

  新掌门在一处渡口停下，望着南面重重叠叠的山影。他没有符了，也不再需要符。第一步迈出去时，脚下的青石板和别处并没有什么不同，可他清楚，从这一步起，路是他自己踩的了。
epilogue: |
  止水潭的水，被那一诀搅了四十年来头一回的乱，又慢慢平复下去，重新照出天光。

  守拙翁坐回潭边的青石上，像什么都不曾发生。他守着这一潭水、这一方地界，守了大半辈子，规矩不曾越过一寸，脚步不曾踏出十里。他的止水诀守得滴水不漏，可也正因守得太稳，那一诀里没有半分向前的意思——守得住旧地，便踏不出新路。

  新掌门收剑。他忽然懂了，一流之上那一层薄薄的窗纸，捅破它的不是更稳的守，是敢往没有路的地方迈的那一步。守拙翁输的不是招，是他四十年没肯挪的那双脚。

  「你要往哪儿去？」老人问，声音平得像脚下的潭水。

  「往深处去。」新掌门说。他自己也说不清深处是哪里，可他知道那是师父没到过、灰衣人没到过、连守着这潭水的老人也没到过的地方。

  师父那句遗言，他这一路听了三回。这一回，他听到了尽头——剑到了一处地方，就要听那处地方的风；可这潭边没有风，静得能听见自己的心跳。他这才明白，风到不了的地方，人得自己走成一阵风。师父的话到这儿走完了，再往下，没有遗言可循，得他自己往下说。

  守拙翁没有再拦。他从青石缝里抠出一枚磨得发亮的旧印，抛给新掌门。印上刻着「止水」二字，边角已经残了。「拿着。」老人重新阖上眼，「守了一辈子，也该有人替我看看，这潭水外头的江湖，究竟走到了哪一步。」

  新掌门把旧印收进怀里，与那枚凉透的铜符搁在一处。他转身，沿着潭边那条没有人走过的小径，往中州更深处去了。

  江湖到这里，才刚露出它真正的深浅。
