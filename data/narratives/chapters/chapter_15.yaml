id: chapter_15
title: 关山一程
prologue: |
  钟敲了三声，山门就在身后了。

  新掌门走在下山的官道上，走得不快。秋风比前几日紧了些，把道旁的黄叶一阵阵卷到脚边。他没有骑马——马战宗师的马蹄声敲了三天山门，他记住了那份不急不缓；可他自己的路，还是想用脚走。当年别人循着符，一程一程走到他的山前；如今符留在峰顶石下，他把自己交给这条往西的路。

  路是旧路。出中原往西，先走官道，再渡黄河，过河西，穿沙海，尽头是阳关。几十年来，这条道上走过商队，走过马队，走过僧人和刀客——也走过一个背剑的少年，一路向西，没有回头。道上的车辙一层压着一层，最早的那些，已经和土长在一起了。

  他知道自己要去哪里。阳关外头，有一位看了中原几十年的人；马战宗师临行留下的那句话，比马蹄声更沉，在山上压了一季。绝顶之上没有更高的山，可山外有关，关外有更远的江湖。候峰翁说，成为江湖的人，路才刚起头——那么这万里关山，总得有人去走头一程。

  官道向西，笔直地伸进秋色里。他整了整背上的剑，一步一步走下去。走出半里，回头望了一眼：山还在，符还在，钟声已经停了。他不再回头。
epilogue: |
  关门开了。

  守关老将亲手拉开门闩，那扇几十年只在日出日落时开合的城门，在他面前缓缓让出一条路。门洞很深，风从关外灌进来，带着沙的干燥和落日的余温。老将立在门边，像立了一辈子的那样直，只是抱拳的手比先前缓了些：「关是朝廷的关，门却为走得出去的人开。老夫守到今日，守的就是这一开。」

  新掌门立在关下，没有立刻走。他回头望：关内是中原，官道、沙海、古窟、渡口、山门，一程一程铺回去，尽头是那座山，山上有符，符面向着来路。五卷真解贴在怀里，第六卷是新的——孤城闭，守关人的杀法，落闩的功夫。他忽然想起一路上的人：送行的拳，渡口的剑，窟前的僧，沙海里服软让道的马贼——中原用五程路送他到这里，每一程都递了一手。

  再往前望，关外是另一片天。戈壁铺到天边，长烟落日，大得没有边际。那位看了中原几十年的人，就在这片大里的某一处。老将顺着他的目光望出去，缓缓道：「当年有个背剑的少年往西去，老夫抬手放了行，一晃几十年，再没有音信。今日你再走这条道——替老夫，也替这座关，看一眼西边如今的样子。」

  新掌门抱拳，深深一礼。然后他转身，一步跨出了关门。

  身后，城门缓缓合拢，门闩落下，声音沉沉的，像一句送行。山外青山，山外来客，关山一程——山字打头的这段路，到这里走完了。关外的风迎面而来，万里关山，头一程尽处，是下一程的起点。
