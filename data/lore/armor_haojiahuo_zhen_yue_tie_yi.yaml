id: armor_haojiahuo_zhen_yue_tie_yi
name: 镇岳铁衣
default_lore:
  - text: |
      石镇岳身长丈许，常年披一领玄铁重衣，江湖人称「铁衣客」。
      此衣以断魂庄秘法锻打，三十六片铁叶叠为鱼鳞，
      刀斧加身只闻铮铮，不见血痕。

  - text: |
      他守庄门十余年，未尝退过半步。
      有言「过铁衣客这一关，先问脚下石阶答不答应」。
      铁衣沉重，寻常人披之寸步难行，唯刚猛内力可驭。

continued_lore_obtained:
  - text: |
      于「{source}」得此铁衣。上身那一刻双肩骤沉，
      你才懂石镇岳十年不退，退的不是敌，是这身重量。
  - text: |
      {source}一遭，镇岳铁衣归你。三十六片铁叶各有一道旧凹，
      是十年间挡下的三十六道杀招留的记。
  - text: |
      在 {source} 拿到镇岳铁衣。铁叶相叠处生了薄锈，
      你没有去磨——石镇岳生前也从不磨，锈是守出来的。

continued_lore_boss_defeated:
  - text: |
      于「{stage_name}」一战胜 {boss_name}。
      {boss_name} 的最后一击落在铁衣上，只留一声闷响。
      你站着没动——铁衣客当年也是这么站着的。
  - text: |
      胜 {boss_name} 于 {stage_name}。铁叶又添一道新凹，
      你忽然觉得这衣裳认的不是主，是肯站着不退的人。
  - text: |
      {stage_name}一战，{boss_name} 力竭。
      你身上铁衣纹丝未乱——石镇岳留下的，从来不是甲，是「不退」二字。
