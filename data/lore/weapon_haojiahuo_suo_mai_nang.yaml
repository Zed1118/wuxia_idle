id: weapon_haojiahuo_suo_mai_nang
name: 锁脉囊
default_lore:
  - text: |
      断魂庄主苏无咎行走江湖，从不佩剑，只腰悬一只乌沉软囊。
      囊中银针细若牛毛，淬「锁脉」之术——针出无声，
      中者周身真气如遭绳缚，一时动弹不得。

  - text: |
      有人见他三针锁一位成名剑客的三处大穴，
      那人僵立当场，剑尚未出鞘。
      后来苏无咎败于来客，此囊连同锁脉针法一并留在了庄中。

continued_lore_obtained:
  - text: |
      于「{source}」得此软囊。指尖探入，银针凉而不刺，
      你忽然明白苏无咎为何从不佩剑——针在，剑便多余。
  - text: |
      {source}一遭，锁脉囊归你。囊口那道旧折痕还在，
      是苏无咎十年间开合无数次留下的。
  - text: |
      在 {source} 拿到锁脉囊。你试着捻起一枚针，
      针尖朝下悬着，稳得像没有重量——这才是它可怕的地方。

continued_lore_boss_defeated:
  - text: |
      于「{stage_name}」一战胜 {boss_name}。
      收针时你才发觉自己没动过第二步——
      锁脉一道，本就不给对手第二步。
  - text: |
      胜 {boss_name} 于 {stage_name}。银针尽数收回囊中，
      你想起苏无咎的旧话：锁的不是穴，是那口不肯认输的气。
  - text: |
      {stage_name}一战，{boss_name} 僵立不能动。
      你没有补第二针——苏无咎当年也从不补。
