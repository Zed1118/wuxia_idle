# 百草岭远征配置（§8.2）。战斗敌池与深度曲线均为生产单一真相源。
normal_node_minutes: 90
elite_node_minutes: 180
# batch3 联合经济探针拍板中档(Lv100→170 ~18天专挂)·rewardsForNode 消费·探针留 ratchet
base_exp_per_battle: 170
hp_recover_pct_per_node: 0.10
qi_recover_pct_per_node: 0.25
zhangshi_pct_per_layer: 0.05

combat:
  # 第 1 节点以模板基础值开局，随后逐节点线性增长并 clamp。封顶后由第 31 节点起
  # 的瘴蚀（恢复逐层归零）继续形成有限远征压力，不无限膨胀 HP/攻击。
  depth_curve:
    first_node: 1
    base_multiplier: 1.0
    hp_growth_per_node: 0.04
    attack_growth_per_node: 0.02
    hp_multiplier_cap: 4.0
    attack_multiplier_cap: 2.5
    hp_value_cap: 60000
    attack_value_cap: 2000

  # 非险关战斗为单敌遭遇。稳定 nodeSeed 在三支队伍间选择，覆盖三流派。
  normal_enemy_teams:
    - id: baicao_normal_gangmeng
      enemies:
        - id: enemy_baicao_shanjia
          name: 山甲悍匪
          realmTier: sanLiu
          realmLayer: shuLian
          school: gangMeng
          baseHp: 3200
          baseAttack: 300
          baseSpeed: 95
          skillIds:
            - skill_gangmeng_changlian_basic
            - skill_gangmeng_changlian_skill
          iconPath: assets/enemies/enemy_baicao_shanjia.png
    - id: baicao_normal_lingqiao
