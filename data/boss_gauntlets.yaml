# 断魂庄三关配置（§8.2）。Phase C C1.3.2 填敌队机制（design §5.2-5.4）。
# 敌队机制走 EnemyDef 既有字段：chargeSkillId + vulnerability（苏无咎锁脉针破招脆弱）、
# guardianWard（石镇岳铁衣护阵·软门槛=护法血墙 taunt 非减伤·见 memory
#   feedback_wuxia_boss_ward_noop_under_lowhp_ai）、bossPhases（闻九针三阶段血线）。
# 数值（baseHp/baseAttack/baseSpeed）经三档真实连战探针校准；realm 锚 design §1
# 「承接 Lv100~170 = 三流后段至二流·熟练」。
# skillIds 引用现有 skills.yaml（§8.2 不复制招式定义）；立绘 iconPath 留空占位，
# art 随 Phase C UI 批（MJ）补。敌队引用完整性校验在 GameRepository 加载期跑
# （_enforceGauntletEnemyRedLines：chargeSkillId∈skillIds / guardianIds 队内 / 相位招存在）。
supply_cap: 3
stages:
  - { role: elite, enemy_team_id: gauntlet_su_wujiu }
  - { role: elite, enemy_team_id: gauntlet_shi_zhenyue }
  - { role: boss,  enemy_team_id: gauntlet_wen_jiuzhen }

# ── 通关奖励（§6.2·数值/命名装备 TODO(batch3-probe)）──
# 首通解锁「锁脉针法」秘籍（= 苏无咎所用锁脉针·skill_suo_mai_zhen，击败后习得）。
first_clear_reward_skill_id: skill_suo_mai_zhen
# Boss 胜利三选一命名装备候选（恰 3 件·一槽一件·各偏一流派）。断魂庄专属命名奖励：
# 锁脉囊(苏无咎飞针·灵巧) / 镇岳铁衣(石镇岳护阵·刚猛) / 摄魂铃(镇庄物·阴柔)。
reward_candidate_equipment_ids:
  - weapon_haojiahuo_suo_mai_nang
  - armor_haojiahuo_zhen_yue_tie_yi
  - accessory_haojiahuo_she_hun_ling
# 参战全员经验/领悟点（§6.2·首通全额，重复通关取半）。TODO(batch3-probe) 占位。
first_clear_reward_exp: 300
first_clear_reward_insight: 20
# 每名精英提供的经验（§6.2「两名精英各 5%」）。§6.3 失败结算发「已击败精英经验」=
# 已击败精英数 × 本值。占位 50 ≈ first_clear_reward_exp(30% 整包) 的 1/6（5/30）。
# TODO(batch3-probe)：真·百分比拆分（每精英 5% 当前层经验需求）随联合探针统一定案。
elite_reward_exp: 50

