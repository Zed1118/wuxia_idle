            - skill_yinrou_changlian_fang_skill
          aiMode: focus
          onEnterMechanic: chargeCounter
          titleKey: bossPhase_desperate   # 逆行封脉 flavor 题字留 C2.5 UI
        - hpThresholdPct: 0.35            # <35%：断魂九针，进攻模式解锁绝招
          unlockSkillIds:
            - skill_yinrou_changlian_fang_ult
          aiMode: aggressive
          onEnterMechanic: chargeCounter
          titleKey: bossPhase_desperate   # 断魂九针 flavor 题字留 C2.5 UI
