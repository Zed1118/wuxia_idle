      vulnerability:
        outOfWindowDamageMult: 0.35       # §5.4 逆行封脉窗外承伤 0.35
      bossPhases:
        - hpThresholdPct: 1.0             # 100-70%：集中，优先攻最低血
          aiMode: focus
        - hpThresholdPct: 0.70            # 70-35%：逆行封脉（蓄力开脆弱窗口）
