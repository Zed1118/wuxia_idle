  # ── 最终关：断魂庄主·闻九针（阴柔单人 + 高血三阶段 + 逆行封脉脆弱 0.35）──
  gauntlet_wen_jiuzhen:
    - id: enemy_gauntlet_wen_jiuzhen
      name: 闻九针
      realmTier: erLiu
      realmLayer: shuLian
      school: yinRou
      baseHp: 42000          # 高血扛首击方触相位（memory boss_phase_needs_hp）·守 <60000
