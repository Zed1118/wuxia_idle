        - skill_lingqiao_jichu_ult
        - skill_suo_mai_zhen              # 招牌蓄力技（阴柔·qiDrainPct 0.30）
      iconPath: ''
      isBoss: true
      chargeSkillId: skill_suo_mai_zhen   # §5.2 未破招夺 30% 最大真气
      vulnerability:
        outOfWindowDamageMult: 0.65       # §5.2 破招后两拍窗口，窗外承伤 0.65
