  # === stage_01_05 · 风雨渡口（章末大 Boss · 撑伞高人，跨 2 阶 erLiu 设计）===
  # 章末大 Boss 跨阶到 erLiu，玩家方 xueTu 攻击 ×0.3（近破防免疫）、
  # 被 erLiu 攻击 ×2.5（高伤一击）—— 明确暗示「未升阶不可挑战」（GDD §3 三阶节奏）
  - id: stage_01_05
    name: 风雨渡口
    dropSkillManualId: skill_xie_yu_chuan_lian  # 波B 真解(撑伞高人「斜雨穿帘」· 同招为其蓄力技)
    stageType: mainline
    chapterIndex: 1
    prevStageId: stage_01_04
    narrativeOpeningId: stage_01_05_opening
    narrativeVictoryId: stage_01_05_victory
    narrativeDefeatId: stage_01_05_defeat
    requiredRealm: xueTu
    enemyTeam:
      # 2026-05-29 D 段难度修:原敌人 realmTier=erLiu(+2 阶 vs 章节 xueTu),是全 6
      # 章末 Boss 唯一双 +2(其余 Ch2/Ch3 at-tier、Ch4-6 lead≤+1),sim on-level
      # ceiling 0%(满配玩家也打不过)= 数据不一致硬墙。对齐 Ch2/Ch3 at-tier 体例:
      # 全员 xueTu / dengFeng(峰层显精英)/ jichu 技能组(boss 留 ult)/ 数值按
      # Ch2 boss premium(同阶 mob ×1.1 HP / ×1.07 atk)缩放到 xueTu 档。
      - id: enemy_xueTu_umbrella
        name: 撑伞高人
        realmTier: xueTu
        realmLayer: dengFeng
        school: yinRou
        baseHp: 3800
        baseAttack: 170
        baseSpeed: 165
        skillIds:
          - skill_yinrou_jichu_basic
          - skill_yinrou_jichu_skill
          - skill_yinrou_jichu_ult
          - skill_xie_yu_chuan_lian                 # 波B 真解双用:Boss 招牌蓄力技「斜雨穿帘」
        iconPath: assets/enemies/umbrella.png
        isBoss: true
        chargeSkillId: skill_xie_yu_chuan_lian      # 波B 破招:蓄力技(玩家破招拦截,首通掉同招真解)
        # 批二②:弱点/抗性。yinRou 被 gangMeng 克(阴柔怕刚猛)→ 弱点×1.25;
        # yinRou 克 lingQiao(阴柔克灵巧)→ 抗性×0.75。
        schoolDamageTakenMult:
          gangMeng: 1.25
          lingQiao: 0.75
        # 第七阶段批二 ①:章末大 Boss 二阶段。满血起手 → 跌破 50% 入「背水一击」,
        # 解锁同阶(jichu·xueTu §5.3)固元术 + 转攻势 + 触发蓄力反击。
        bossPhases:
          - hpThresholdPct: 1.0
            # hpThresholdPct: 1.0 = 起始阶段；无 titleKey（策略层仅为 next>=1 触发转阶段题字）
          - hpThresholdPct: 0.5
            unlockSkillIds:
              - skill_yinrou_jichu_fang_ult           # jichu 阶(对齐 xueTu §5.3)
            aiMode: aggressive
            onEnterMechanic: chargeCounter
            titleKey: bossPhase_desperate
        cycleBossPhases:
          2:
            - hpThresholdPct: 1.0
            - hpThresholdPct: 0.80
              unlockSkillIds:
                - skill_yinrou_jichu_fang_skill
              aiMode: focus
              titleKey: bossPhase_desperate
            - hpThresholdPct: 0.45
              unlockSkillIds:
                - skill_yinrou_jichu_fang_ult
              aiMode: aggressive
              onEnterMechanic: chargeCounter
              titleKey: bossPhase_desperate
    isBossStage: true
    factionId: shaolin                              # Ch1 竹林 Boss · 少林地盘(orthodox)
    bossRecruit:                                  # P4.1 1.1 Q6B · 战胜后 40% rng pick 招降
      candidateRef: bamboo_swordsman              # data/sect_candidates.yaml 已配(lingQiao 三系)
    dropTable:
      - equipmentDefId: weapon_xunchang_tie_jian
        dropChance: 1.0
      - equipmentDefId: weapon_xiangyang_chang_jian
        dropChance: 1.0
      - equipmentDefId: armor_xunchang_bu_yi
        dropChance: 0.50
      - equipmentDefId: armor_xiangyang_pi_jia
        dropChance: 0.50
      - equipmentDefId: weapon_xunchang_fei_shi
        dropChance: 0.50
      - equipmentDefId: accessory_xunchang_yu_pei
        dropChance: 0.40
      - inventoryItemDefId: item_xinxuejiejing
        quantity: [1, 2]
        dropChance: 1.0
      - inventoryItemDefId: item_silver
        quantity: [25, 40]
        dropChance: 1.0  # 银两(P1 占位,待 balance)
      - inventoryItemDefId: item_jingyandan_large
        quantity: [1, 1]
        dropChance: 0.25  # 经验丹大档(balance T4 校准统一 0.2→0.25)
      - inventoryItemDefId: item_scroll_kai_bei_shou
        quantity: [1, 1]
        dropChance: 1.0  # 秘籍掉落(T5 balance:首通必得,isFirstClear gate 于 stage_entry_flow;重打 skip)
    baseExpReward: 15
    difficultyMultiplier: 1.8
    biome: dock
    sceneBackgroundPath: assets/scenes/battle_dock.png
    weather: rain

