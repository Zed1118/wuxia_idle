  # · 承 Ch18 章尾 hook「人间的路走到头,剩下的那一段,不在东西南北里」→ 不再往西,掉头东返。
  # · **地理走向决定关序**:西行链为 Ch16(阳关驿道→黑石戈壁→沙海孤驿→大漠→门户关城)
  #   → Ch17(砂丘→黑风口→沙埋古城→沙海深处→腹地门前)→ Ch18(碛口→沿烟→城下→演武场→火堆前)。
  #   东返即倒着走,故 Ch19 五关 = 西凉城下 → 沙海深处 → 黑风口 → 门户关城 → 黑石戈壁,
  #   恰好把两个既有人物(接关人/守镜人)落在 {4,5} Boss 位上,Boss 位体例不用动。
