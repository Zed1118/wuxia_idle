  # === stage_21_05 · 绝顶平台(= Ch13_05 同一处 · 灵巧末 Boss · 交程 = 章眼 · 敌层 dengFeng = cap 49 同层)===
  # 主线终关。Ch14「符面向着来路,等下一个走得上来的人」在此兑现:那个人到了。
  # 玩家坐在候峰翁当年的位置上,要做的不是赢,是「把路守成活的」(chapter_13:12)——
  # 故胜负条件换轴:surviveTicks(段级拍板 B·主线首用)。撑满即胜,不必击败少年。
  # 真解「山外无山」与 Ch13 候峰翁「一览众山」严格成对(4800 → 7800),
  # 兑现 chapter_14:8「绝顶之上没有更高的山了,可有比山更远的东西」。
  - id: stage_21_05
    name: 绝顶平台
    stageType: mainline
    chapterIndex: 21
