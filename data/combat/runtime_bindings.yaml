# Production runtime binding contract for the Ch1 Black Wind Ridge slice.
# Coordinates and role composition remain TUNING candidates for G2.
# The current host does not consume the verified-only namespaces below.
runtime_bindings:
  - stage_id: stage_01_03
    encounter_id: ch1_encounter_03_ambush
    entrances:
      - id: ch1_entrance_s03_front
        spawn_position: {x: -520, y: 80}
      - id: ch1_entrance_s03_rear
        spawn_position: {x: 520, y: 80}
      - id: ch1_entrance_s03_upper
        spawn_position: {x: 0, y: -120}
    positions:
      - id: ch1_position_s03_slot_01
        world_position: {x: -360, y: 120}
      - id: ch1_position_s03_slot_02
        world_position: {x: -240, y: 140}
      - id: ch1_position_s03_slot_03
        world_position: {x: -120, y: 120}
      - id: ch1_position_s03_slot_04
        world_position: {x: 0, y: 140}
      - id: ch1_position_s03_slot_05
        world_position: {x: 120, y: 120}
      - id: ch1_position_s03_slot_06
        world_position: {x: 240, y: 140}
      - id: ch1_position_s03_slot_07
        world_position: {x: 360, y: 120}
      - id: ch1_position_s03_slot_08
        world_position: {x: -360, y: 0}
      - id: ch1_position_s03_slot_09
        world_position: {x: -120, y: 0}
      - id: ch1_position_s03_slot_10
        world_position: {x: 120, y: 0}
