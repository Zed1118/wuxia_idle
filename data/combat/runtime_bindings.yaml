# Production runtime bindings for migrated mainline encounters.
# Shared role behavior stays catalog-driven; stage coordinates remain explicit.
runtime_bindings:
  - stage_id: stage_01_01
    encounter_id: ch1_encounter_01_roadbreak
    base_enemy_id: enemy_xueTu_thug_a
    entrances:
      - id: ch1_entrance_s01_road_west
        spawn_position: {x: -520, y: 80}
      - id: ch1_entrance_s01_road_ridge
        spawn_position: {x: 0, y: -120}
      - id: ch1_entrance_s01_road_exit
        spawn_position: {x: 520, y: 80}
