# Production Chapter 7 army ecology. Multipliers stay inside the established four-role envelope.
archetypes:
  - id: ch7_army
    variants:
      - role_id: army_shield
        display_name: 盾兵
        attack_token_kind: melee
        hp_multiplier: 1.1
