  # === Floor 49 · 大 Boss · 武圣·登峰 · 九霄魔尊 ===
  # 原 floor30 九霄魔尊迁移登顶——护法墙 taunt + 脆弱窗全套机制原样；乘子参数沿用旧 Task5 诊断值，A5 balance 探针复校
  - floorIndex: 49
    sceneBackgroundPath: assets/scenes/battle_innerrealm.png
    baseExpReward: 90
    requiredRealm: wuSheng
    bossKind: major
    narrativeOpeningId: tower_49_opening
    narrativeVictoryId: tower_49_victory
    enemyTeam:
      - id: enemy_tower_boss_49
        name: 九霄魔尊
        realmTier: wuSheng
        realmLayer: dengFeng
        school: yinRou
        baseHp: 59500
        baseAttack: 2000
        baseSpeed: 400
        skillIds:
          - skill_yinrou_chuanshuo_basic
          - skill_yinrou_chuanshuo_skill
          - skill_yinrou_chuanshuo_ult
        iconPath: assets/enemies/tower_boss_30.png
        isBoss: true
        schoolDamageTakenMult:
          gangMeng: 1.25
          lingQiao: 0.75
        # [balance] 护法墙 taunt（原 floor30 机制原样迁移登顶）:护法(左使/右使)存活时主 Boss
        # 被 taunt 从自动目标池排除(BattleAI.isGuardedBoss),逼玩家先清护法;护法全灭
        # 后 Boss 进池 + 脆弱窗口接管。damageTakenMult 0.15 仅对「手动越护法直捶」生效。
        # 旧 Task5 诊断在 sanLiu 数值下校准,数值抬到 wuSheng 后乘子语义不变,A5 探针复校。
        guardianWard:
          damageTakenMult: 0.15
          guardianIds:
            - enemy_tower_49_cultist_a
            - enemy_tower_49_cultist_b
        vulnerability:
          outOfWindowDamageMult: 0.10   # 机制型:护法墙(taunt)破后靠脆弱窗口打残局。
                                        # 窗口靠 bossPhases chargeCounter 相位(0.90/0.50)。
