      - id: enemy_tower_boss_32
        name: 绝顶剑魔
        realmTier: jueDing
        realmLayer: jingTong
        school: lingQiao
        # 血量与 vuln 乘子联动校准(2026-08-04 vulnerability_window 诊断迭代):
        # 55000×0.12 时 on-level 0/20 全败 → 45000×0.30+浅开窗 18/20 →
        # 40000+atk 1500 定稿(2026-08-04 诊断迭代):满配 20/20 必胜,
        # 同阶 0 强化偶胜(软门槛非绝杀),跨阶全败(门槛真咬合)。
        baseHp: 40000
        baseAttack: 1500
        baseSpeed: 330
        skillIds:
          - skill_lingqiao_jianghu_basic
          - skill_lingqiao_jianghu_skill
          - skill_lingqiao_jianghu_ult
        iconPath: assets/enemies/tower_boss_25.png
        isBoss: true
        schoolDamageTakenMult:
          yinRou: 1.25
          gangMeng: 0.75
        vulnerability:
          outOfWindowDamageMult: 0.35   # 机制教学 soft gate:窗口外(未蓄招/未踉跄)受 35% 伤;
                                        # 窗口靠 bossPhases chargeCounter 相位(0.80/0.50)开。
                                        # 原 floor25 的 0.12 是 sanLiu 数值(6000 血)下校准的,
                                        # 迁 jueDing 段后 vuln 型 Boss 的血量与乘子必须联动。
                                        # 2026-08-04 vulnerability_window 诊断迭代:55000×0.12
                                        # on-level 0/20 全败 → 40000×0.35+浅开窗 0.92+影侍减压
                                        # 后「满配 20/20 必胜·同阶 0 强化偶胜·跨阶全败」
                                        # 软门槛梯度成立。
        cycleVulnerability:
          2:
            outOfWindowDamageMult: 0.30   # 二周目收窄窗口加压(0.35→0.30;0.21 半数败/
                                          # 0.28 仍 17/20,cycle2 诊断校准回全胜线)
        bossPhases:
          - hpThresholdPct: 1.0
          - hpThresholdPct: 0.92
            # 首相位阈值 0.80→0.92(批 A 校准):血量从 sanLiu 6000 抬到 jueDing
            # 55000 后,「跌破 0.80 才首开窗」的前置伤害门槛同比 ×9,窗口外 ×0.20
            # 下 on-level 队开窗前先被打死(vulnerability_window 诊断 0/20 全败)。
            # 浅开窗(-8%)同塔顶 0.90 体例,恢复「满配必胜·欠配可败」软门槛语义。
            unlockSkillIds:
              - skill_lingqiao_jianghu_fang_skill
            aiMode: focus
            onEnterMechanic: chargeCounter
            titleKey: bossPhase_desperate
