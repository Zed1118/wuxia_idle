# =============================================================================
# towers.yaml · 问鼎九霄爬塔（批 A · 塔 30→49 层 1:1 锚死 · spec 2026-08-01）
# =============================================================================
# 共 49 层：floor N ↔ 境界绝对层 N（每 tier 7 层，与主线 cap abs 49 对齐）。
#   xueTu 1-7 / sanLiu 8-14 / erLiu 15-21 / yiLiu 22-28 /
#   jueDing 29-35 / zongShi 36-42 / wuSheng 43-49
#
# Boss 位 14 个：小 Boss = tier 中点 4/11/18/25/32/39/46；
#               大 Boss = tier 末层 7/14/21/28/35/42/49。
# 旧 6 Boss 迁移（5→4 / 10→7 / 15→11 / 20→14 / 25→32 / 30→49，机制原样）+
# 新 8 Boss（18/21/25/28/35/39/42/46；立绘为主线敌池占位，批 C 出专属图）。
#
# 数值曲线：普通敌单体 hp/atk/spd 对齐主线 stages.yaml 同 (tier,layer) 实测中位
# （2026-08-04 提取；主线每 tier 只实配前 3 层，其余层段内线性插值），
# Boss = 同层普通 ×1.6-2.5，全部守 §5.4 Boss HP ≤ 60000 硬线。
# 敌人数：1-7 层 1 人 / 8-14 层 2 人 / 15+ 层 3 人；大 Boss 可带护卫。
#
# 红线（GameRepository._enforceRedLines / progression_red_lines_validator 校验）：
#   - floorIndex 从 1 起唯一连续；层数 ≤ 境界总层数 49（1:1 锚死上界）
#   - bossKind 严格在上述 14 位；其他层必须 null
#   - 普通层 narrativeOpeningId / narrativeVictoryId 必须 null
#   - Boss HP ≤ 60000（boss_hp_max）；敌 baseAttack 全曲线 ≤ 2000（对齐主线顶格）
#
# requiredRealm = 该层敌人境界 tier（拍板 #8；tower_entry_flow 稀有彩头装备阶
# 经 equipmentTierCapOf 从此派生，守卫测钉 requiredRealm ≤ 该层敌人境界）。
# =============================================================================

