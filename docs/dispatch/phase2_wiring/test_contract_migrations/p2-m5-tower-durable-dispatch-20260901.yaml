    reason: 旧测试使用多行声明且标题只承认单一 sweep 通道；替代用例逐条验证旧 sweep 与新增 durable dispatch 两条互斥 exact tuple。

  - deleted: test('first-clear, visible bot, dispatch, and wrong content fail closed', () {
    replacement: test('first-clear、混合 tuple、visible bot 与错内容 fail closed', () {
    reason: 旧标题把所有 dispatch 都视为拒绝，与新增已通层 durable dispatch 合同冲突；替代用例保留首通、可见 bot、错内容拒绝并把拒绝条件收窄为两条通道的混合 tuple。
