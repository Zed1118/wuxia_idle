  - deleted: expect(IsarSetup.currentSaveVersion, '0.42.0');
    replacement: expect(IsarSetup.currentSaveVersion, '0.43.0');
    reason: 加法 collection 与迁移段 13 要求当前版本同步提升；替代断言继续钉死字面版本，防止意外回退或漏升。
