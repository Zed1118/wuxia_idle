  - deleted: expect(status, findsOneWidget);
    replacement: expect(status, findsOneWidget);
    reason: 该断言从三项循环迁移到唯一 dodge status，新用例仍原样保证节点存在。
  - deleted: expect(tester.widget<Text>(status).data, UiStrings.skillReady);
    replacement: expect(tester.widget<Text>(status).data, UiStrings.skillReady);
    reason: 该断言从三项循环迁移到唯一 dodge status，新用例仍原样保证初始可用文案。
  - deleted: expect(tester.getSize(status).width, greaterThan(0));
    replacement: expect(tester.getSize(status).width, greaterThan(0));
    reason: 该断言从三项循环迁移到唯一 dodge status，新用例仍原样保证可见宽度。
  - deleted: expect(tester.getSize(status).height, greaterThan(0));
    replacement: expect(tester.getSize(status).height, greaterThan(0));
    reason: 该断言从三项循环迁移到唯一 dodge status，新用例仍原样保证可见高度。
  - deleted: expect(tester.widget<Text>(defenseStatus(action)).data, expected);
    replacement: expect(tester.widget<Text>(defenseStatus('dodge')).data, expected);
    reason: 共享三项冷却 HUD 已删除，新断言仅锁定唯一 dodge status 的冷却文案。

